# ZORUNLU ALANLAR (bekçi: tests/audit/test_iddia_kutugu.py)
#   id, uzman, ankraj, iddia, severity_iddia, durum
#   durum != beklemede ise -> kanit ZORUNLU
#   durum == uygulandi     ise -> commit + zorlayici_test ZORUNLU
#
# SEVERITY DE BİR ÖLÇÜMDÜR (.claude/rules/audit-methodology.md, 28 Tem 2026):
#   severity_iddia  = kullanıcı/uzmanın beyanı
#   severity_olculen = ölçümden sonra bizim atadığımız  (null = henüz ölçülmedi)
#   İkisi farklıysa GEREKÇE yazılır.

