# -----------------
# Bu, `docs/research/2026-08-12_claude_code_opus5_arastirma_raporu.md` §C.2.8
# (Anthropic kod-migrasyon metodolojisi) adım 3'ün uygulamasıdır:
#   "İş kuyruğunu MEKANİK ve DEVAM ETTİRİLEBİLİR yap. 'Bitti' = çıktı diskte var."
#
# Ve §C.1.10 + CLAUDE.md "Mega Audit Lock (S197)" gereği: raporlanan P0'ların
# %30-70'i fantom olabilir. 12 Ağu 2026 ön ölçümünde, RAPORUN KENDİ §E'sinde
# 3 bulgu fantom/bayat çıktı (E2, E12, E14). Bu yüzden hiçbir iddia
# `durum: dogrulandi` olmadan uygulanmaz.
