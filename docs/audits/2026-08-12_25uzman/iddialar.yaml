         ve 149 (_performance_cache).

      2) 🔴 BELİRLEYİCİ: cache SORU SATIRI tutmuyor, yalnız ÇIPLAK ID LİSTESİ:
           1429-1442: cache_key="BETA:verified_provisional:all"
