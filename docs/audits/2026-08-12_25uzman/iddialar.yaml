  - id: U02
    uzman: "Piotr Woźniak — FSRS-6"
    alan: hafiza
    ankraj: "frontend/src/pages/FSRSReviewPage.tsx + FSRS aralık hesabı (backend)"
    iddia: "'Çok Kolay' işaretlenince aralık 180 günü aşıp YKS tarihini geçebiliyor."
    gorev: "min(calculated_interval, days_until_yks) cap."
    severity_iddia: P2
    severity_olculen: P2
    durum: dogrulandi
    dogrulama:
      - "grep -rn 'interval' backend/algorithms/fsrs*.py backend/services/*fsrs* 2>/dev/null | head -30"
      - "grep -rn 'maximum_interval\\|max_interval\\|MAX_INTERVAL' backend/ --include=*.py | head"
      - "# ÖLÇÜM: gerçek bir kartta 'easy' seçilince dönen interval kaç gün?"
    curutme_sorusu: "FSRS'in kendi maximum_interval parametresi zaten cap koyuyor olabilir — varsayılan 36500 mü, yoksa daha düşük mü ayarlanmış?"
    kanit: |
      YARGI: dogrulandi · karar: A+B mutabik · 2 bagimsiz yargi · 22 Agu 2026
      GEREKCE: Iddianin tetikleyici mekanizmasi ('Cok Kolay' isaretleme) YANLIS: boyle bir UI butonu/etiketi yok (frontend/src'de 'Cok Kolay' grep 0 sonuc), FSRSReviewPage.tsx'te sadece 2 buton var ('Tekrar Et'/'Bildim', boolean is_correct). Ama iddianin OZU (FSRS araligi YKS-tarih-farkinda cap'lenmiyor, 180 gunu asabiliyor) GERCEK ve DAHA DA KOTU: sadece 5 ardisik DOGRU cevapla (herhangi bir ogrenci normal kullaniminda) interval 194 gune cikiyor; 8. tekrarda ~5 yila ulasiyor. 9 Nis 2026'da bir P0 fix (a65ea45e7) '137 yillik due_date'i 36.500 gune (100 yil) clamp'ledi ama YKS-tarihi hic dusunulmedi — bu bosluk halen acik.
      --- KANITLAR ---
      [1] backend/app/services/fsrs_engine.py:64 `MAX_INTERVAL_DAYS: int = 36_500` — tek cap bu, YKS-tarih-farkındalığı YOK. Canlı simülasyon (backend dizininde python ile calistirildi, salt-okunur, DB'ye yazmadi):
      ```
      review 1: interval=3d
      review 2: interval=10d, cumulative=13d
      review 3: interval=30d, cumulative=43d
      review 4: interval=80d, cumulative=123d
      review 5: interval=194d, cumulative=317d  <- 180 gunu asti
      review 8: interval=1829d (~5yil)
      ```
      Bu PUAN_İYİ (rating=3, 'İyi/Good') ile — yani PRODUCTION'DA GERÇEKTEN ERİŞİLEBİLİR olan tek doğru-cevap puanıyla. `frontend/src/pages/FSRSReviewPage.tsx:56-59` `/api/v1/fsrs/review`'a yalniz `{question_id, is_correct}` gonderiyor, `response_ms` YOK. `backend/app/services/fsrs_engine.py:345-375` `answer_to_fsrs_rating()` `response_ms is None` ise HER ZAMAN PUAN_İYİ(3) doner, PUAN_KOLAY(4)='Kolay' asla tetiklenmez. `backend/app/services/cat_session.py:1065` CAT akisinda da `response_ms: None` sabit — yani PUAN_KOLAY tum urunde STRUKTUREL OLARAK ERISILEMEZ (sadece `backend/tests/test_fsrs.py`de kullanilir).
      [2] backend/app/services/fsrs_engine.py:64 `MAX_INTERVAL_DAYS: int = 36_500` (100 yil) — YKS tarihine gore hicbir cap yok (grep 'yks_tarih|sinav_tarih|exam_date' backend/app -> yalniz learning_path_orchestrator.py/learning_path_daily.py cikti, fsrs_engine.py/fsrs_service.py'de SIFIR sonuc). Canli simulasyon (salt-okunur, DB'ye yazmadan python ile fsrs_update() coklu cagri):
      ```
      rep 1: stability=15.47 interval_days=15
      rep 2: stability=137.94 interval_days=138  due=2027-01-07
      rep 3: stability=1017.96 interval_days=1018 due=2029-06-05
      rep 4: stability=6054.88 interval_days=6055 due=2043-03-21
      ```
      App.tsx:396-401 `/fsrs-review` -> FSRSReviewPage.tsx ROTA MOUNT (roller: ogrenci, admin). App.tsx:779 `/admin/labs` -> RevolutionaryDashboard -> FSRSScheduler.tsx (Kolay(4) butonu, satir 592-598) MOUNT (admin-only). Ikisi de AYNI canonical uca gidiyor: app/api/fsrs.py:190 POST /api/v1/fsrs/review -> app/services/fsrs_service.py:apply_review -> fsrs_engine.fsrs_update -> MAX_INTERVAL_DAYS=36500.
