# Pre-commit hooks for code quality
# Run with: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args: [--fix]
        name: Ruff linter with auto-fix
      - id: ruff-format
        name: Ruff formatter

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        name: Black Python formatter
        language_version: python3.12

  # isort - Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: Sort imports
        args: ["--profile", "black"]

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: Check case conflicts
      - id: check-merge-conflict
        name: Check merge conflicts
      - id: debug-statements
        name: Check debug statements

  # MyPy - Type checking (optional, can be slow)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        name: MyPy type checking
        args: [--ignore-missing-imports, --explicit-package-bases]
        files: ^(core/|tests/fast/).*\.py$
        exclude: ^(tests/slow/|tests/integration/).*\.py$

  # Bandit - Security linting
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: Bandit security checks
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Pytest — Fast test execution (last-failed only, unit tests only)
  - repo: local
    hooks:
      - id: pytest-fast
        name: Pytest fast (last-failed)
        entry: bash -c "cd backend && python -m pytest -x -q --tb=short tests/unit/test_algorithm_core_p0.py tests/unit/test_fsrs_v6_service.py tests/unit/test_fsrs_card_persistence.py tests/unit/test_bkt_record_answer_batch1b.py tests/unit/test_bkt_record_answer_batch1b_errors.py tests/unit/test_bkt_zpd_static_methods.py"
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

# Configuration
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
