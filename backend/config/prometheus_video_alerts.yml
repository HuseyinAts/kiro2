# Prometheus Alert Rules for Video Recommendation System
# Learning Path Video Yükleme Sorunu Çözümü - Task 19
# Requirements: 4.5, 4.11, 5.4, 5.12

groups:
  # Video API Performance Alerts
  - name: video_api_performance
    interval: 30s
    rules:
      # High error rate on video recommendations
      - alert: HighVideoAPIErrorRate
        expr: |
          (
            rate(kiro_api_requests_total{endpoint="/api/youtube/recommendations", status=~"5.."}[5m])
            /
            rate(kiro_api_requests_total{endpoint="/api/youtube/recommendations"}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: youtube_api
          service: video_recommendations
        annotations:
          summary: "Video API error rate yüksek"
          description: "Video önerileri endpoint'inde hata oranı %5'in üzerinde ({{ $value | humanizePercentage }}). Son 5 dakikada sürekli yüksek."
          runbook_url: "https://docs.teknofest-egitim.com/runbooks/video-api-high-error-rate"
          dashboard_url: "http://grafana:3000/d/video-api/video-api-dashboard"

      # Slow video API response time (P95 > 3 seconds)
      - alert: SlowVideoAPIResponse
        expr: |
          histogram_quantile(0.95,
            rate(kiro_api_request_duration_seconds_bucket{endpoint="/api/youtube/recommendations"}[5m])
          ) > 3
        for: 5m
        labels:
          severity: warning
          component: youtube_api
          service: video_recommendations
        annotations:
          summary: "Video API yanıt süresi yavaş"
          description: "Video önerileri P95 yanıt süresi 3 saniyenin üzerinde ({{ $value | humanizeDuration }}). Hedef: <3s."
          runbook_url: "https://docs.teknofest-egitim.com/runbooks/video-api-slow-response"
          d"
