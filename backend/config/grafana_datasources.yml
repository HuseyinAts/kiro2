# Grafana Datasources Configuration - Task 52.4

apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      queryTimeout: '60s'

  # PostgreSQL datasource (for direct queries)
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: ${DB_HOST:-postgres}:${DB_PORT:-5432}
    database: ${DB_NAME:-kiro_education}
    user: ${DB_USER:-postgres}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1400
      timescaledb: false
