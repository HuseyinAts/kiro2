[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "teknofest-2025-egitim-eylemci"
description = "AI-powered educational platform for Turkish university entrance exam preparation"
authors = [
    {name = "Teknofest 2025 Team", email = "info@teknofest-egitim.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[tool.setuptools_scm]
write_to = "backend/_version.py"

# Coverage configuration: see .coveragerc (single source of truth)

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["."]
skip_glob = ["*/migrations/*", "*/venv/*", "*/env/*"]

# Flake8 configuration (in setup.cfg since flake8 doesn't support pyproject.toml)
# See setup.cfg for flake8 configuration

# MyPy type checking - Relaxed for development
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for dev
disallow_incomplete_defs = false  # Relaxed for dev
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed for dev
no_implicit_optional = false  # Relaxed for dev
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
show_error_codes = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "pytest.*",
    "factory.*",
    "fake.*",
    "redis.*",
    "celery.*",
    "elasticsearch.*",
    "langchain.*",
    "openai.*",
    "transformers.*",
    "torch.*",
    "numpy.*",
    "pandas.*",
    "sklearn.*",
]
ignore_missing_imports = true

# SECURITY FIX #8: Strict type hints for security-critical modules
[[tool.mypy.overrides]]
module = [
    "core.auth",
    "core.auth_dependencies",
    "core.auth_middleware",
    "core.jwt_auth",
    "core.security_utils",
    "core.data_encryption",
    "core.kvkk_compliance",
    "core.dependencies",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

# Pytest configuration REMOVED - Using pytest.ini as single source
# All pytest configuration moved to pytest.ini to avoid conflicts

# Ruff - Modern, fast Python linter
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    # Core rules
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except (SECURITY FIX #7)
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by black)
    "S101",    # Use of assert (common in tests)
    # SECURITY FIX #7: BLE001 (blind-except) - enabled but ignored for gradual migration
    # TODO: Fix 168+ instances over time. New code MUST use specific exceptions.
    "BLE001",  # Blind except - in gradual migration (see .claude/rules/testing.md)
    "PLR0913", # Too many arguments (common in complex APIs)
    "PLR0915", # Too many statements (common in setup functions)
    "N806",    # Variable should be lowercase (for Pydantic models)
    "B008",    # Function calls in argument defaults (FastAPI dependencies)
    "UP007",   # Use X | Y for Union (not compatible with all versions)
    "PLR2004", # Magic value used in comparison
    "SIM108",  # Use ternary operator (sometimes less readable)
    "RUF001",  # String contains ambiguous characters (Turkish text)
    "RUF002",  # Docstring contains ambiguous characters (Turkish text)
    "RUF003",  # Comment contains ambiguous characters (Turkish text)
    "S104",    # Possible binding to all interfaces (0.0.0.0 is intentional)
    "DTZ005",  # datetime.now() without timezone (acceptable for local use)
    "EM101",   # Exception must not use string literal (Turkish messages)
    "EM102",   # Exception must not use f-string literal
    "B024",    # Abstract base class without abstract methods
    "B904",    # raise in except clause (sometimes necessary)
    "PLC0415", # import not at top level (sometimes needed)
    "S110",    # try-except-pass (sometimes acceptable)
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations/",
    "htmlcov/",
    ".pytest_cache/",
    "tests/slow/",  # Skip slow tests for speed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "PLR2004", # magic value comparison in tests
    "PLR0913", # many arguments in test fixtures
    "T20",     # print statements in tests
]
"**/models/*.py" = [
    "N815",    # mixedCase variable in class scope (Pydantic models)
]
"conftest.py" = [
    "E402",    # Module level import not at top (common in conftest)
]
"scripts/**/*.py" = [
    "T201",    # print statements allowed in CLI scripts
    "S608",    # SQL string build from internal boolean flags (no user input)
]
"hooks/**/*.py" = [
    # 27 Tem 2026: pre-commit hook'ları git'e stdout üzerinden konuşur —
    # print onların ARAYÜZÜ. Bu girdi eklenene kadar ruff hook'u
    # backend/hooks/secret_detector.py'yi T201 ile düşürüyor, yani sır
    # bekçisinin bulunduğu dosyaya dokunan her commit bloklanıyordu.
    "T201",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "models", "services", "api", "algorithms"]
split-on-trailing-comma = true

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "*/tests/*", "*/test_*", "*_test.py"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_subprocess

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
