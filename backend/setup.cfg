[metadata]
name = teknofest-2025-egitim-eylemci
version = attr: backend._version.version
description = AI-powered educational platform for Turkish university entrance exam preparation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/your-username/teknofest-2025-egitim-eylemci
author = Teknofest 2025 Team
author_email = info@teknofest-egitim.com
license = MIT
license_file = LICENSE
platform = any
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Education
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Topic :: Education
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
zip_safe = False
packages = find:
python_requires = >=3.11
include_package_data = True

# Flake8 configuration
[flake8]
max-line-length = 88
max-complexity = 10
select = E,W,F,C
# Ignored error codes:
#   E203: whitespace before ':'
#   E501: line too long (handled by black)
#   W503: line break before binary operator
#   C901: too complex (handled by other tools)
ignore = E203,E501,W503,C901
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .tox,
    .venv,
    venv,
    env,
    build,
    dist,
    migrations,
    static,
    media,
    uploads,
    htmlcov,
    *.egg-info,
    .eggs

per-file-ignores =
    __init__.py:F401,F403
    */settings/*:F401,F403
    */tests/*:F401,F403,F811
    test_*.py:F401,F403,F811
    *_test.py:F401,F403,F811
    conftest.py:F401,F403,F811

# Documentation with pydocstyle
[pydocstyle]
inherit = false
ignore = D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D213,D214,D215,D404,D405,D406,D407,D408,D409,D410,D411,D413,D415,D416,D417
match-dir = (?!migrations).*
match = (?!test_).*\.py

# Pylint configuration
[pylint.MASTER]
load-plugins = pylint_django
django-settings-module = core.settings

[pylint.FORMAT]
max-line-length = 88

[pylint.MESSAGES CONTROL]
disable = 
    missing-docstring,
    invalid-name,
    too-few-public-methods,
    too-many-arguments,
    too-many-locals,
    too-many-branches,
    too-many-statements,
    import-error,
    no-member,
    unused-import

[pylint.DESIGN]
max-args = 10
max-locals = 20
max-returns = 8
max-branches = 15
max-statements = 60
max-parents = 10
max-attributes = 15
min-public-methods = 0
max-public-methods = 25
max-bool-expr = 8

[pylint.TYPECHECK]
generated-members = objects

# MyPy additional configuration
[mypy]
plugins = mypy_django_plugin.main
strict_optional = True
show_column_numbers = True

[mypy.plugins.django-stubs]
django_settings_module = core.settings

