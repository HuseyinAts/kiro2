[pytest]
# Pytest configuration for KIRO2 Backend Tests
# Single source of truth for pytest settings

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    timeout: per-test timeout marker
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    contract: marks tests as API contract tests
    smoke: marks tests as smoke tests
    fast: marks tests as fast tests
    security: marks tests as security tests
    accessibility: marks tests as accessibility tests
    performance: marks tests as performance tests
    benchmark: marks tests as benchmark tests
    revolutionary: marks tests for revolutionary features
    task_44: marks tests for Task 44 implementation
    task_69: marks tests for Task 69 implementation
    task_73: marks tests for Task 73 implementation
    property: marks property-based tests
    infra: marks infrastructure / health / external dependency tests
    serial: marks tests that must run serially
    ml: marks machine learning tests
    zpd: marks ZPD (Zone of Proximal Development) tests
    fsrs: marks FSRS algorithm tests
    irt: marks IRT (Item Response Theory) tests
    load: marks load/stress tests
    e2e: marks end-to-end tests
    golden_flow: marks Golden Flow E2E tests (8 critical user journeys - CI merge gate)
    flaky: marks flaky tests for rerun
    quarantine: marks quarantined tests
    guardrail: marks guardrail detection tests (WP-01/WP-02)
    shared_resource: marks tests that use shared resources

# Test output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Directories to search for tests
testpaths = tests

# Add backend dir + app subdir to Python path for imports
pythonpath = . app

# Minimum Python version
minversion = 7.0

# Timeout for tests (seconds)
timeout = 300

# Asyncio mode
asyncio_mode = auto
