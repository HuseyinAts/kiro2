[pytest]
# ============================================================================
# TEST DISCOVERY CONFIGURATION
# ============================================================================
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================================
# COMMAND LINE OPTIONS
# ============================================================================
addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=10
    --color=yes
    # Warning filters (module-specific for better debugging)
    -W ignore::DeprecationWarning:aioredis
    -W ignore::DeprecationWarning:jwt
    -W ignore::ResourceWarning:asyncio
    -W ignore::pytest.PytestUnraisableExceptionWarning:asyncio
    -W default::UserWarning
    # Sprint 7: Coverage Configuration
    --cov=core
    --cov=api
    --cov=services
    --cov=algorithms
    --cov=models
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=json:coverage.json
    --cov-fail-under=40
    --durations=10
    # Cache enabled for performance

# ============================================================================
# EXCLUDED DIRECTORIES
# ============================================================================
norecursedirs =
    tests/slow
    tests/fixtures
    tests/load
    tests/accessibility
    .git
    .tox
    __pycache__
    *.egg-info
    dist
    build
    venv
    env

# ============================================================================
# CUSTOM TEST MARKERS
# ============================================================================
markers =
    fast: Fast unit tests (runs in < 1s)
    integration: Integration tests (requires database)
    slow: Slow tests (runs in > 10s)
    unit: Unit tests with mocks
    e2e: End-to-end tests
    smoke: Smoke tests for quick validation
    performance: Performance benchmarking tests
    serial: Tests that must run serially (not in parallel)

# ============================================================================
# ASYNC TEST CONFIGURATION
# ============================================================================
asyncio_mode = auto

# ============================================================================
# TIMEOUT CONFIGURATION
# ============================================================================
# Default timeout: 60 seconds (use @pytest.mark.timeout(N) for exceptions)
timeout = 60
timeout_method = thread

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
log_cli = false
log_cli_level = INFO
log_file = pytest.log
log_file_level = DEBUG
