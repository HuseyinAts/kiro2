# Reward Hacking Prevention Configuration
# Daisy Stanton Standards - Exit Code Management

# Global settings
enabled: true
fail_on_warning: false
timeout_seconds: 30.0
max_files: 100

# Per-detector configuration
detectors:
  AssertTrueDetector:
    enabled: true
    severity: CRITICAL
    min_confidence: 0.8
    patterns: []
    exceptions: []

  EchoSuccessDetector:
    enabled: true
    severity: CRITICAL
    min_confidence: 0.8
    patterns: []
    exceptions: []

  PlaceholderDetector:
    enabled: true
    severity: CRITICAL
    min_confidence: 0.8
    patterns: []
    exceptions: []

  CoverageManipulationDetector:
    enabled: true
    severity: CRITICAL
    min_confidence: 0.8
    patterns: []
    exceptions: []

  MockAbuseDetector:
    enabled: true
    severity: WARNING  # Warning by default for mock abuse
    min_confidence: 0.7
    patterns: []
    exceptions: []

  EmptyExceptionDetector:
    enabled: true
    severity: CRITICAL
    min_confidence: 0.8
    patterns: []
    exceptions: []

  HardcodedTestDataDetector:
    enabled: true
    severity: WARNING  # Warning by default for hardcoded data
    min_confidence: 0.7
    patterns: []
    exceptions: []

  CICDBypassDetector:
    enabled: true
    severity: CRITICAL
    min_confidence: 0.8
    patterns: []
    exceptions: []

# Exit code mapping
# 0 = SUCCESS - No reward hacking detected
# 1 = WARNING - Non-critical issues found
# 2 = BLOCKING_ERROR - Critical reward hacking detected

# File type support
supported_extensions:
  - .py
  - .sh
  - .yml
  - .yaml
  - .js
  - .ts
  - .tsx

# Exclusion patterns (files to skip)
exclude_patterns:
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/.git/**"
  - "**/dist/**"
  - "**/build/**"
