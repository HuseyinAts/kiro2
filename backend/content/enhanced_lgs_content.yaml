      - "Türkçe: 25 dakika (soru başına 1.25 dk)"
      - "Matematik: 40 dakika (soru başına 2 dk)"
      - "Fen: 40 dakika (soru başına 2 dk)"
      - "Sosyal: 20 dakika (soru başına 2 dk)"
      - "Son 15 dakika: Kontrol"
    
    question_approach:
      - "Kolay soruları önce çöz"
      - "Zor sorularda şık eleme yap"
      - "Hesap hatalarına dikkat et"
      - "Boş bırakma, tahmin et"

performance_tracking:
  metrics:
    - name: "Doğru sayısı"
      target: "Net artışı"
    - name: "Süre kullanımı"
      target: "Zaman optimizasyonu"
    - name: "Konu bazlı başarı"
      target: "Zayıf alanları güçlendir"
  
  improvement_indicators:
    - "Haftalık net artışı: +2-3"
    - "Deneme sınavı puanı: +10-15"
    - "Zaman yönetimi: -%10 süre"
    - "Motivasyon seviyesi: Yüksek"