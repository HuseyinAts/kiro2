study_plans:
  intensive_4_weeks:
    week1:
      - topic: "sayilar_islemler"
        hours: 6
        focus: "EBOB-EKOK ve üslü sayılar"
    week2:
      - topic: "cebirsel_ifadeler"
        hours: 6
        focus: "Özdeşlikler ve denklemler"
    week3:
      - topic: "geometri"
        hours: 6
        focus: "Pisagor ve üçgenler"
    week4:
      - topic: "mixed"
        hours: 8
        focus: "Karma sorular ve deneme sınavları"
  
  regular_3_months:
    month1:
      topics: ["sayilar_islemler"]
      weekly_hours: 4
      practice_tests: 2
    month2:
      topics: ["cebirsel_ifadeler", "geometri"]
      weekly_hours: 5
      practice_tests: 3
    month3:
      topics: ["all"]
      weekly_hours: 6
      practice_tests: 4

