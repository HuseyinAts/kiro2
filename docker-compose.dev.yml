version: '3.8'

# ============================================================================
# ⚠️  UYARI — BU DOSYAYI VARSAYILAN STACK İLE BİRLİKTE ÇALIŞTIRMA!
# Bu dev compose; frontend(3000), backend(8000) ve KENDİ postgres(PG15)
# servisini tanımlar. Kanonik prod stack (docker-compose.yml) zaten 3000/8000
# kullanır ve host PostgreSQL 18 (port 5434) ile çalışır.
# Bu dosyayı `-f docker-compose.dev.yml up` ile açmak:
#   • 3000/8000 port çakışması → prod stack bozulur
#   • PG15 gölge-DB'si 5434 yerine kendi portunda kalkar → veri karışıklığı
# BETA = SADECE `docker compose up -d` (docker-compose.yml). Dev için önce
# `docker compose down`, sonra dev'i ayrı portlarla çalıştır.
# ============================================================================

services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:15-alpine
    container_name: turkiye_sinav_postgres_dev
    environment:
      POSTGRES_DB: kiro2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=tr_TR.UTF-8"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - kiro2-dev-network
    restart: unless-stopped

  # Redis Cache (Development)
  redis:
    image: redis:7-alpine
    container_name: turkiye_sinav_redis_dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - kiro2-dev-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Chroma (optional) — `docker compose -f docker-compose.dev.yml --profile chroma up`
  # In .env: CHROMADB_HOST=chroma  CHROMADB_PORT=8000  (in-network; host maps 8001→8000)
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: kiro2_chroma_dev
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_dev_data:/chroma/chroma
    networks:
      - kiro2-dev-network
    restart: unless-stopped
    profiles: [chroma]
    environment:
      - ANONYMIZED_TELEMETRY=False

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: turkiye_sinav_backend_dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/kiro2
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production-32-chars}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-not-for-production-32-chars}
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - USE_MOCK_SERVICES=true
      - ENABLE_PERFORMANCE_MONITORING=true
      - HUGGINGFACE_ENDPOINT=${HUGGINGFACE_ENDPOINT:-https://cf781mfqobm2ynkk.us-east-1.aws.endpoints.huggingface.cloud}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - USE_MOCK_RESPONSES=${USE_MOCK_RESPONSES:-true}
      # Chroma: set CHROMADB_HOST=chroma when using --profile chroma (see chroma service)
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app  # Mount source code for hot reload
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./cache:/app/cache
      - ./vector_db:/app/vector_db
      - ./data:/app/data
    networks:
      - kiro2-dev-network
    restart: unless-stopped

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teknofest-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app  # Mount source code for hot reload
      - /app/node_modules  # Prevent node_modules from being overwritten
    depends_on:
      - backend
    networks:
      - kiro2-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  chroma_dev_data:

networks:
  kiro2-dev-network:
    driver: bridge

# Development setup with hot reload for both backend and frontend
# Use: docker-compose -f docker-compose.dev.yml up