# YAML Lint Configuration for KIRO2

extends: default

rules:
  line-length:
    max: 120
    level: warning
  
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  
  document-start:
    present: false
  
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
  
  comments:
    min-spaces-from-content: 2
  
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  
  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
  
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1
  
  key-duplicates: enable
  new-line-at-end-of-file: enable
  trailing-spaces: enable

ignore: |
  node_modules/
  .venv/
  venv/
  frontend/build/
  frontend/dist/
  .git/