[project]
name = "kiro2"
version = "1.0.0"
description = "AI-powered education platform for Turkish university entrance exams (YKS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KIRO2 Team", email = "admin@kiro2.com" }
]
license = { text = "MIT" }
keywords = ["education", "ai", "turkish", "yks", "tyt", "ayt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Education",
]

dependencies = [
    # FastAPI Core
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Database
    "asyncpg==0.29.0",
    "psycopg[binary]>=3.1.0",  # Python 3.13 uyumlu
    "sqlalchemy[asyncio]>=2.0.36",  # Python 3.13 uyumlu
    "alembic==1.13.1",

    # Redis
    "redis[hiredis]==5.0.1",
    "aioredis==2.0.1",

    # Celery
    "celery[redis]==5.3.4",
    "flower==2.0.1",
    "kombu==5.3.4",

    # Elasticsearch
    "elasticsearch[async]==8.11.0",

    # HTTP
    "aiohttp==3.9.1",
    "httpx==0.25.2",

    # Security
    "passlib[bcrypt]==1.7.4",
    "slowapi==0.1.9",
    "bleach==6.2.0",
    "PyJWT==2.13.0",

    # 2FA
    "pyotp==2.10.0",
    "qrcode[pil]==7.4.2",

    # Turkish NLP
    "zemberek-python==0.1.3",
    "hijri-converter==2.3.1",
    "langdetect==1.0.9",

    # Fast JSON
    "orjson>=3.10.0",

    # Monitoring
    "prometheus-client==0.19.0",
    "psutil==5.9.6",
    "aiofiles==23.2.1",
    "structlog==26.1.0",

    # ML & Analytics
    "numpy>=1.26.0",  # Python 3.13 uyumlu
    "scikit-learn==1.3.2",
    "sympy==1.12",
    "matplotlib==3.11.1",
    "plotly==5.18.0",

    # NLP & AI
    "openai==1.3.0",
    "transformers==4.35.0",
    "torch>=2.0.0",
    "nltk==3.8.1",
    "rouge-score==0.1.2",
    "sentencepiece==0.1.99",

    # PDF & OCR
    "reportlab==4.0.7",
    "xlsxwriter==3.1.9",
    "pdfplumber==0.11.0",
    "PyPDF2==3.0.1",
    "pytesseract==0.3.10",
    "Pillow>=12.0.0",
    "pdf2image==1.17.0",
    "easyocr==1.7.1",
    "opencv-python-headless==4.8.1.78",

    # YOLO & Detection
    "ultralytics>=8.0.0",
    "PyYAML>=6.0",

    # Text-to-Speech
    "gTTS==2.5.0",
    "pyttsx3==2.90",

    # Web Scraping
    "beautifulsoup4==4.12.2",

    # OpenTelemetry
    "opentelemetry-api==1.21.0",
    "opentelemetry-sdk==1.21.0",
    "opentelemetry-instrumentation==0.42b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.42b0",
    "opentelemetry-instrumentation-redis==0.42b0",
    "opentelemetry-instrumentation-requests==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-exporter-jaeger==1.21.0",
    "opentelemetry-exporter-jaeger-thrift==1.21.0",
    "opentelemetry-exporter-otlp==1.44.0",

    # Error Tracking
    "sentry-sdk[fastapi]==1.40.0",

    # Google Gemini
    "google-generativeai==0.8.3",

    # MCP Protocol
    "mcp==1.0.0",
    "fastmcp==0.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-xdist==3.8.0",
    "pytest-benchmark==4.0.0",

    # Linting & Formatting
    "ruff==0.7.1",
    "mypy==1.11.2",
    "types-redis",
    "types-passlib",
    "types-PyYAML",
    "types-requests",

    # Pre-commit
    "pre-commit==3.8.0",

    # Development tools
    "ipython==8.26.0",
    "ipdb==0.13.13",
    "rich==13.7.1",
]

[project.scripts]
kiro2 = "backend.main:main"
kiro2-worker = "backend.worker:main"
kiro2-migrate = "backend.scripts.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ==================== Tool Configurations ====================

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.7.1",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
]

[tool.uv.pip]
index-url = "https://pypi.org/simple"
extra-index-url = []
find-links = []

# ==================== Ruff Configuration ====================

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
    "C901",  # too complex
    "W191",  # indentation contains tabs
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".venv-*",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "migrations",
    "alembic",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["backend", "core", "services", "models", "api"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["ARG001", "ARG002", "S101"]
"backend/alembic/**/*.py" = ["E501"]

# ==================== MyPy Configuration ====================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_reexport = true
strict_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# soru_bankasi_service.py: 10 ONCEDEN VAR OLAN tip hatasi (cogu eksik
# anotasyon) dosyaya dokunan her commit'i blokluyordu. Ayni dosyanin ruff
# borcu backend/pyproject.toml'da gerekcesiyle kayitli (E712 otomatik
# duzeltmesi PostgreSQL'de FARKLI SQL uretiyor -> olculmemis risk).
# NOT: ruff dosyaya EN YAKIN config'i, mypy ise cwd'deki (kok) config'i
# kullaniyor — bu yuzden ayni borc iki ayri dosyada kayitli. Iki modul
# yazimi da veriliyor cunku cagri sekline gore ikisi de olusabiliyor.
[[tool.mypy.overrides]]
module = ["services.soru_bankasi_service", "backend.services.soru_bankasi_service"]
ignore_errors = true

# learning_style: 8 ONCEDEN VAR OLAN mypy hatasi (1 Agu 2026 olcumu, GF-K2).
# HICBIRI o turda yazilan satirlarda degil:
#   services:18   `models` paketi ExamSession / LearningAnalytics /
#                 StudentLearningProfile'i re-export etmiyor (attr-defined).
#                 Kod CALISIYOR; duzeltmesi `models/__init__` refaktoru demek.
#   services:76,762,842  no-any-return   ·   services:853  var-annotated
#   api:83        kullanilmayan `type: ignore`
# Bunlar gf82 fix'inin (eksik servis metodu + dict/nesne sozlesme kaymasi)
# kapsami DEGIL — cerrahi mudahale kurali. Borc BURADA GORUNUR, --no-verify
# ile atlanmadi. Temizlik ayri gorev.
# osym_exam_engine: 17 ONCEDEN VAR OLAN mypy hatasi (2 Agu 2026 olcumu, gf88).
# HICBIRI gf88 fix'inin dokundugu satirlarda (1077-1092) degil:
#   :21          `cachetools` icin stub yok (types-cachetools kurulu degil)
#   :636,757,1025,1034   var-annotated — tembel kurulan dict'ler
#                (`_db_queue`, `_persist_tasks`, `_session_locks`,
#                `_session_loading`). Anotasyon eklemek davranisi degistirmez
#                ama dordu de `hasattr` deseniyle kuruluyor; duzeltmesi o
#                deseni kaldirmak demek.
#   :1042,1791   no-any-return
#   :1263,1275,1287,1383-1386   int/float karisimi (skor hesaplari)
#   :1986        `models` paketi KonuPerformansi/SinavSonucu/SinavTipi'yi
#                re-export etmiyor (attr-defined). Kod CALISIYOR — gec import
#                calisma zamaninda cozuluyor; duzeltmesi `models/__init__`
#                refaktoru (learning_style ile AYNI kok neden).
# gf88 fix'i `finally` blogunda tek bir None kapisi ekledi. Borc BURADA
# GORUNUR, `--no-verify` ile atlanmadi. Temizlik ayri gorev.
[[tool.mypy.overrides]]
module = ["core.osym_exam_engine", "backend.core.osym_exam_engine"]
ignore_errors = true

# multi_layer_cache: tek mypy hatasi `redis` icin stub YOKLUGU
# (types-redis kurulu degil). Kodla ilgisi yok, ortam eksikligi.
[[tool.mypy.overrides]]
module = ["core.multi_layer_cache", "backend.core.multi_layer_cache"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "services.learning_style_service",
    "backend.services.learning_style_service",
    "api.learning_style",
    "backend.api.learning_style",
]
ignore_errors = true


[[tool.mypy.overrides]]
module = [
    "zemberek_python",
    "hijri_converter",
    "langdetect",
    "gtts",
    "pyttsx3",
    "easyocr",
    "ultralytics",
    "mcp",
    "fastmcp",
]
ignore_missing_imports = true

# alembic_utils.py: `from alembic import op` icin `# type: ignore[attr-defined]`
# gerekcesi dosyanin kendisinde (alembic'in `op`u calisma zamaninda dinamik
# proxy). Bu satirin GEREKLI olup olmadigi mypy/alembic surum ikilisine gore
# DEGISIYOR -- olculdu (30 Agu 2026): pre-commit'in izole mypy v1.11.2 venv'i
# attr-defined ISTIYOR (ignore gerekli), CI'nin "Code Quality (mypy)" job'u
# ise projenin gercek .venv'ini (requirements.txt'teki pinlenmis alembic)
# kullaniyor ve ayni satiri unused-ignore ile REDDEDIYOR -- iki ayri, ikisi
# de gecerli CI kapisi celisiyordu. warn_unused_ignores'i bu modul icin
# kapatmak, ignore'un GEREKLI oldugu ortamda attr-defined'i hala bastirirken
# GEREKSIZ oldugu ortamda hata saydirmiyor -- dosyanin geri kalani (no-any-
# return dahil) tam denetimde kaliyor (ignore_errors=true DEGIL, kapsam
# yalniz bu tek satir).
[[tool.mypy.overrides]]
module = ["core.alembic_utils", "backend.core.alembic_utils"]
warn_unused_ignores = false

# core.jwt_auth: OLCULDU (2 Eylul 2026, Faz 2 devami: refresh token
# rotation persist fix + create_token_pair pozisyonel-argüman duzeltmesi
# ayni PR). CI'nin "Code Quality (mypy)" job'u BU dosyayi (kok
# pyproject.toml — pre-commit'in `--config-file=pyproject.toml`'u da
# AYNI dosyayi okuyor, backend/pyproject.toml'daki mypy bolumu DEGIL,
# bkz. yukaridaki `core.osym_exam_engine` notundaki "ruff dosyaya EN
# YAKIN config'i, mypy ise cwd'deki (kok) config'i kullaniyor" tespiti)
# global `warn_redundant_casts = true` ile okuyor. `jwt.encode()`'un
# donus tipi PyJWT/mypy surum ikilisine gore DEGISIYOR: bazi
# kombinasyonlarda `Any`, bazilarinda dogrudan `str` cozumleniyor. Bu
# fonksiyonlar `-> str` imzali oldugu icin `warn_return_any` ihlalini
# onlemek amaciyla eklenen `cast(str, jwt.encode(...))` cagrilari
# (create_access_token, create_refresh_token,
# create_password_reset_token, create_email_verification_token) `Any`
# cozumleyen ortamda GEREKLI, `str` cozumleyen ortamda [redundant-cast]
# ile REDDEDILIYOR — core.alembic_utils'teki ile ayni celiski deseni,
# kod tarafinda cozumu yok. NOT: `warn_redundant_casts` per-module olarak
# DENENDI, mypy 1.19.1 "Per-module sections should only specify
# per-module flags (warn_redundant_casts)" diyerek REDDETTI (bu flag
# artik sadece global) -- bu yuzden modern, kod-bazli mekanizma
# `disable_error_code` kullanildi (yerelde ayni mypy surumuyle
# dogrulandi).
[[tool.mypy.overrides]]
module = ["core.jwt_auth", "backend.core.jwt_auth"]
disable_error_code = ["redundant-cast"]

# api.auth:47 (`from models import (...)  # type: ignore[attr-defined]`)
# ve tests.unit.test_jwt_auth_functions:527
# (`_get_default_permissions(...)  # type: ignore[arg-type]`) — ikisi de
# ONCEDEN VAR OLAN, dosyalarin kendi yorumunda gerekcelendirilmis satir-ici
# ignore'lar, bu PR'in dokunmadigi satirlarda. CI'nin mypy'si bazi
# isimleri/tipleri pinned yerel mypy'den (v1.11.2) FARKLI cozdugu icin bu
# ignore'lari [unused-ignore] ile isaretliyor — ayni pinned/unpinned surum
# celiskisi (core.alembic_utils emsali).
[[tool.mypy.overrides]]
module = [
    "api.auth",
    "backend.api.auth",
    "tests.unit.test_jwt_auth_functions",
    "backend.tests.unit.test_jwt_auth_functions",
]
warn_unused_ignores = false

# ==================== Pytest Configuration ====================

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--asyncio-mode=auto",
    "--continue-on-collection-errors",
    "--import-mode=importlib",
]
timeout = 30
timeout_method = "thread"
timeout_func_only = true
norecursedirs = [".git", ".venv", "__pycache__", "htmlcov", ".pytest_cache", "node_modules"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as full-stack E2E tests (requires running services)",
    "ai: marks tests that require AI services",
    "db: marks tests that require database",
    "redis: marks tests that require Redis",
    "smoke: marks tests as smoke tests",
    "performance: marks tests as performance tests",
    "accessibility: marks tests as accessibility tests",
    "security: marks tests as security tests",
    "flaky: marks tests as flaky",
    "quarantine: marks tests as quarantined (temporary test isolation)",
    "testcontainers: marks tests requiring Docker containers",
    "postgres: marks tests requiring real PostgreSQL",
    "contract: marks tests as API contract tests",
    "fast: marks tests as fast tests",
    "revolutionary: marks tests for revolutionary features",
    "task_44: marks tests for Task 44 implementation",
    "task_69: marks tests for Task 69 implementation",
    "task_73: marks tests for Task 73 implementation",
    "property: marks property-based tests",
    "serial: marks tests that must run serially",
    "ml: marks machine learning tests",
    "zpd: marks ZPD (Zone of Proximal Development) tests",
    "fsrs: marks FSRS algorithm tests",
    "irt: marks IRT (Item Response Theory) tests",
    "load: marks load/stress tests",
    "benchmark: marks tests as benchmark tests",
    "shared_resource: marks tests that use shared resources",
    "timeout: per-test timeout marker",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
