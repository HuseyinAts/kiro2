# PostgreSQL Streaming Replication Configuration
# Task #23: PostgreSQL Single Point of Failure Fix
#
# Architecture:
# - Primary (read-write): postgres-primary
# - Replica (read-only): postgres-replica
#
# Usage:
#   docker-compose -f docker-compose.replication.yml up -d

version: '3.8'

services:
  # Primary PostgreSQL Server
  postgres-primary:
    image: postgres:15-alpine
    container_name: kiro2_postgres_primary
    hostname: postgres-primary
    environment:
      POSTGRES_DB: ${DB_NAME:-kiro2}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password_here}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=tr_TR.UTF-8"
      # Replication settings
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_secure_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
      - ./postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba-primary.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - kiro2_replication
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Replica PostgreSQL Server (Streaming Replication)
  postgres-replica:
    image: postgres:15-alpine
    container_name: kiro2_postgres_replica
    hostname: postgres-replica
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password_here}
      PGUSER: replicator
      PGPASSWORD: ${REPLICATION_PASSWORD:-replicator_secure_password}
    ports:
      - "5435:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
      - ./postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - kiro2_replication
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer - Connection Pooling (optional but recommended)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: kiro2_pgbouncer
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-changeme_strong_password_here}@postgres-primary:5432/${DB_NAME:-kiro2}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:5432"
    depends_on:
      - postgres-primary
    networks:
      - kiro2_replication
    restart: unless-stopped

networks:
  kiro2_replication:
    driver: bridge

volumes:
  postgres_primary_data:
  postgres_replica_data:
