# KIRO2 Logstash Pipeline Configuration
# Centralized logging for YKS AI Education Platform

input {
  # Beats input (from Filebeat)
  beats {
    port => 5044
    codec => json
    tags => ["beats"]
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp"]
  }

  # HTTP input for webhook-style logging
  http {
    port => 8080
    codec => json
    tags => ["http"]
  }
}

filter {
  # Parse JSON logs from KIRO2 backend (structlog format)
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    # Flatten parsed fields to root
    if [parsed] {
      mutate {
        rename => {
          "[parsed][level]" => "log_level"
          "[parsed][event]" => "event"
          "[parsed][timestamp]" => "log_timestamp"
          "[parsed][logger]" => "logger_name"
          "[parsed][correlation_id]" => "correlation_id"
          "[parsed][trace_id]" => "trace_id"
          "[parsed][user_id]" => "user_id"
          "[parsed][session_id]" => "session_id"
          "[parsed][service]" => "service_name"
        }
        remove_field => ["parsed"]
      }
    }
  }

  # Parse non-JSON logs with grok
  if ![log_level] {
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:event}",
          "%{GREEDYDATA:event}"
        ]
      }
      tag_on_failure => ["_grokparsefailure"]
    }
  }

  # Normalize log levels
  if [log_level] {
    mutate {
      uppercase => ["log_level"]
    }

    # Map Python log levels to standard
    translate {
      field => "log_level"
      destination => "log_level_normalized"
      dictionary => {
        "DEBUG" => "DEBUG"
        "INFO" => "INFO"
        "WARNING" => "WARN"
        "WARN" => "WARN"
        "ERROR" => "ERROR"
        "CRITICAL" => "FATAL"
        "FATAL" => "FATAL"
      }
      fallback => "INFO"
    }
  }

  # Add GeoIP for client IP addresses
  if [client_ip] and [client_ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {
    geoip {
      source => "client_ip"
      target => "geoip"
      database => "/usr/share/logstash/vendor/bundle/jruby/2.5.0/gems/logstash-filter-geoip-7.2.12-java/vendor/GeoLite2-City.mmdb"
      add_field => ["[geoip][coordinates]", "%{[geoip][longitude]}"]
      add_field => ["[geoip][coordinates]", "%{[geoip][latitude]}"]
    }
    mutate {
      convert => ["[geoip][coordinates]", "float"]
    }
  }

  # Parse user agent strings
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "user_agent_parsed"
    }
  }

  # Add KIRO2-specific fields
  mutate {
    add_field => {
      "platform" => "KIRO2"
      "environment" => "${ENVIRONMENT:production}"
    }
  }

  # Extract exam-related fields
  if [event] =~ /exam/ or [logger_name] =~ /exam/ {
    mutate {
      add_tag => ["exam_event"]
      add_field => { "event_category" => "exam" }
    }
  }

  # Extract learning path fields
  if [event] =~ /learning|path|recommendation/ {
    mutate {
      add_tag => ["learning_event"]
      add_field => { "event_category" => "learning" }
    }
  }

  # Extract authentication events
  if [event] =~ /auth|login|logout|token/ {
    mutate {
      add_tag => ["auth_event"]
      add_field => { "event_category" => "authentication" }
    }
  }

  # Extract API performance metrics
  if [response_time_ms] {
    mutate {
      convert => { "response_time_ms" => "float" }
    }

    # Classify response time
    if [response_time_ms] < 100 {
      mutate { add_field => { "performance_class" => "fast" } }
    } else if [response_time_ms] < 500 {
      mutate { add_field => { "performance_class" => "normal" } }
    } else if [response_time_ms] < 2000 {
      mutate { add_field => { "performance_class" => "slow" } }
    } else {
      mutate { add_field => { "performance_class" => "very_slow" } }
    }
  }

  # Remove sensitive fields (defense in depth - structlog already masks)
  mutate {
    remove_field => [
      "password", "passwd", "pwd", "sifre", "parola",
      "token", "access_token", "refresh_token",
      "api_key", "secret", "credential",
      "credit_card", "ssn", "tc_kimlik"
    ]
  }

  # Add processing timestamp
  ruby {
    code => "event.set('processed_at', Time.now.utc.iso8601(3))"
  }

  # Drop health check logs to reduce noise
  if [path] =~ /health|ready|alive/ or [event] =~ /health_check/ {
    drop { }
  }
}

output {
  # Primary output: Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
    index => "kiro2-logs-%{+YYYY.MM.dd}"
    template_name => "kiro2-logs"
    template_overwrite => true
    ilm_enabled => true
    ilm_rollover_alias => "kiro2-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "kiro2-logs-policy"

    # Performance tuning
    retry_on_conflict => 3

    # Document ID for deduplication
    document_id => "%{[@metadata][fingerprint]}"
  }

  # Error logs to separate index for alerting
  if [log_level_normalized] == "ERROR" or [log_level_normalized] == "FATAL" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "kiro2-errors-%{+YYYY.MM.dd}"
    }
  }

  # Exam events to dedicated index
  if "exam_event" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "kiro2-exams-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (disable in production)
  # stdout {
  #   codec => rubydebug
  # }
}
