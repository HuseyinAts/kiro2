name: E2E Tests - Learning Path Video Loading

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/src/**'
      - 'frontend/src/test/e2e/**'
      - 'backend/api/youtube_routes.py'
      - 'backend/services/video_recommendation_service.py'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/src/**'
      - 'frontend/src/test/e2e/**'
      - 'backend/api/youtube_routes.py'
      - 'backend/services/video_recommendation_service.py'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Start Backend Server
        working-directory: backend
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > backend.pid
          sleep 10
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379
      
      - name: Wait for Backend
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8001/health; do sleep 2; done'
      
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8001
      
      - name: Run E2E Tests
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          VITE_API_URL: http://localhost:8001
          VITE_APP_URL: http://localhost:3002
          CI: true
      
      - name: Stop Backend Server
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 30
      
      - name: Upload Test Videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-videos-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 7
      
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.browser }}
          path: frontend/test-results/screenshots/
          retention-days: 7
      
      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'frontend/test-results/e2e-results.json';
            
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = results.stats.expected;
              const failed = results.stats.unexpected;
              const total = passed + failed;
              
              const comment = `## E2E Test Results (${{ matrix.browser }})
              
              - ✅ Passed: ${passed}
              - ❌ Failed: ${failed}
              - 📊 Total: ${total}
              - 🎯 Success Rate: ${((passed / total) * 100).toFixed(2)}%
              
              ${failed > 0 ? '⚠️ Some tests failed. Check the artifacts for details.' : '✨ All tests passed!'}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  e2e-tests-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    
    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "❌ E2E tests failed"
            exit 1
          else
            echo "✅ E2E tests passed"
          fi
