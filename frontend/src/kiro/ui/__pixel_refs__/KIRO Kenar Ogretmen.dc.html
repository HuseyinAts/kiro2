<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  /* ==== KIRO2 geçiş + micro-interaction ==== */
  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: kv-out 0.22s ease both; }
    ::view-transition-new(root) { animation: kv-in 0.30s cubic-bezier(0.33,0,0.2,1) both; }
    a, button, [role="button"] { transition: transform 0.12s ease, filter 0.15s ease; }
  }
  @keyframes kv-out { to { opacity: 0; transform: translateY(-6px); } }
  @keyframes kv-in { from { opacity: 0; transform: translateY(12px); } }
  :focus-visible { outline: 2px solid rgba(255,111,92,0.7); outline-offset: 2px; }
  @container (max-width: 150px) {
    .nl { display: none !important; }
    .ni { justify-content: center !important; gap: 0 !important; padding-left: 0 !important; padding-right: 0 !important; min-height: 44px !important; }
    .nlogo { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
    .nprofile { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
  }
</style>
</helmet>

<aside style="width:100%; container-type:inline-size; flex-shrink:0; background:#FFFFFF; border-right:1px solid #ECE6DD; display:flex; flex-direction:column; padding:18px 14px; height:100vh; position:sticky; top:0; overflow:hidden; font-family:'Hanken Grotesk',-apple-system,sans-serif; font-size:14px; color:#2A2433;">

  <a href="KIRO2 Tasarim Sistemi.dc.html" class="nlogo" aria-label="Tüm ekranlar · ana sayfa" style="display:flex; align-items:center; gap:10px; padding:6px 8px 16px; text-decoration:none; color:inherit;" title="Tüm ekranlar">
    <div style="width:34px; height:34px; flex-shrink:0; border-radius:10px; background:{{ accent }}; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px -3px {{ accent }}66;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 16l9 5 9-5"/><path d="M3 12l9 5 9-5"/></svg>
    </div>
    <div class="nl" style="display:flex; flex-direction:column; line-height:1.1;">
      <span style="font-family:'Hanken Grotesk',sans-serif; font-weight:800; font-size:17px; letter-spacing:-0.02em;">KIRO<span style="color:{{ accent }};">2</span></span>
      <span style="font-size:10.5px; font-weight:700; color:#0D9488; letter-spacing:0.04em;">ÖĞRETMEN</span>
    </div>
  </a>

  <div class="nl" style="font-size:10.5px; font-weight:700; letter-spacing:0.07em; color:#6B6478; text-transform:uppercase; padding:0 10px; margin:8px 0 6px;">Genel</div>

  <a href="KIRO2 Ogretmen Paneli.dc.html" class="ni" aria-label="Panel" style="{{ sPanel }} color:{{ cPanel }}; text-decoration:none;" style-hover="background:#F2EEE7;">
    <svg width="18" height="18" style="flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/></svg>
    <span class="nl">Panel</span>
  </a>

  <div class="nl" style="font-size:10.5px; font-weight:700; letter-spacing:0.07em; color:#6B6478; text-transform:uppercase; padding:0 10px; margin:16px 0 6px;">Sınıf</div>

  <a href="KIRO2 Ogretmen Paneli.dc.html" class="ni" aria-label="Sınıflarım" style="{{ sClasses }} color:{{ cClasses }}; text-decoration:none;" style-hover="background:#F2EEE7;">
    <svg width="18" height="18" style="flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>

    <span class="nl" style="margin-left:auto; font-size:10px; font-weight:700; color:#6B6478; background:#F0EAE1; padding:1px 7px; border-radius:99px;">3</span>
  </a>

  <a href="KIRO2 Ogrenci Paneli.dc.html" class="ni" aria-label="Öğrenciler" style="{{ sStudents }} color:{{ cStudents }}; text-decoration:none;" style-hover="background:#F2EEE7;">

  <div class="nl" style="font-size:10.5px; font-weight:700; letter-spacing:0.07em; color:#6B6478; text-transform:uppercase; padding:0 10px; margin:16px 0 6px;">Öğretim</div>

  <a href="KIRO2 Soru Cozme.dc.html" class="ni" aria-label="Ödevler" style="{{ sAssignments }} color:{{ cAssignments }}; text-decoration:none;" style-hover="background:#F2EEE7;">
    <svg width="18" height="18" style="flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1Z"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
    <span class="nl">Ödevler</span>
    <span class="nl" style="margin-left:auto; font-size:10px; font-weight:700; color:#fff; background:#E0593F; padding:1px 7px; border-radius:99px;">6</span>
  </a>

  <a href="KIRO2 Interaktif Cozum.dc.html" class="ni" aria-label="İçerik ve Sorular" style="{{ sContent }} color:{{ cContent }}; text-decoration:none;" style-hover="background:#F2EEE7;">
    <svg width="18" height="18" style="flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>

  <a href="KIRO2 Sinav Sonuc.dc.html" class="ni" aria-label="Raporlar" style="{{ sReports }} color:{{ cReports }}; text-decoration:none;" style-hover="background:#F2EEE7;">

  <div style="flex:1;"></div>

  <a href="KIRO2 Ogretmen Paneli.dc.html" class="ni" aria-label="Ayarlar" style="{{ sSettings }} color:{{ cSettings }}; text-decoration:none;" style-hover="background:#F2EEE7;">

    <span class="nl">Ayarlar</span>
  </a>

  <div class="nprofile" style="display:flex; align-items:center; gap:10px; padding:9px 8px; border-top:1px solid #ECE6DD; margin-top:8px;">
    <div style="width:34px; height:34px; flex-shrink:0; border-radius:10px; background:linear-gradient(135deg,#0F766E,#14B8A6); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;">MÖ</div>
    <div class="nl" style="line-height:1.2; min-width:0;">
      <div style="font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Mehmet Öztürk</div>
      <div style="font-size:11px; color:#6B6478;">Matematik · Öğretmen</div>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 250, &quot;height&quot;: 900 },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FF6F5C&quot;, &quot;options&quot;: [&quot;#FF6F5C&quot;, &quot;#0D9488&quot;, &quot;#FF6F5C&quot;], &quot;tsType&quot;: &quot;string&quot; },
  &quot;active&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;panel&quot;, &quot;options&quot;: [&quot;panel&quot;, &quot;classes&quot;, &quot;students&quot;, &quot;assignments&quot;, &quot;content&quot;, &quot;reports&quot;, &quot;settings&quot;], &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent || '#FF6F5C';
    const active = this.props.active || 'panel';
    const base = 'display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; cursor:pointer;';
    const sty = (id) => active === id ? base + ' background:#FFF3EE; font-weight:700;' : base + ' font-weight:600;';
    const col = (id) => active === id ? accent : '#6B6478';
    const ids = ['panel','classes','students','assignments','content','reports','settings'];
    const out = { accent };
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    ids.forEach((id) => { out['s' + cap(id)] = sty(id); out['c' + cap(id)] = col(id); });
    return out;
  }
}
</script>
</body>
</html>
