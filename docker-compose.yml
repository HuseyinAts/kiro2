# KIRO2 Production Stack - Docker Compose
# Uses host PostgreSQL (port 5434) and host Redis (port 6379)
#
# Setup:
#   1. cp .env.mvp.example .env.mvp
#   2. Edit .env.mvp: set REDIS_URL=redis://host.docker.internal:6379/0
#   3. docker compose up --build
#
# NOTE: Redis runs natively on host (port 6379). Docker Redis disabled to avoid port conflict.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.mvp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
      - ./d-dataset/output/crops:/app/static/crops:ro
    environment:
      - CROP_IMAGE_DIR=/app/static/crops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-celery-worker
    command: celery -A celery_worker worker -l info -Q default,emails,reports,features,videos,bulk,claude_md --concurrency=2
    env_file:
      - .env.mvp
    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_worker", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-celery-beat
    command: celery -A celery_worker beat -l info
    env_file:
      - .env.mvp
    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEMO: "${VITE_SHOW_DEMO:-false}"
    container_name: kiro2-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-logs:

networks:
  default:
    driver: bridge
