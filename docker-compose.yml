# KIRO2 Production Stack - Docker Compose
# Uses host PostgreSQL (port 5434); Redis runs in kiro2-redis container (external volume)
#
# Setup:
#   1. cp docs/setup/env.mvp.example .env.mvp
#   2. Edit .env.mvp: fill all CHANGE_ME secrets, ensure REDIS_URL=redis://kiro2-redis:6379/0
#   3. docker network create kiro2_turkiye_sinav_network || true
#   4. docker volume create kiro2_redis-data || true
#   5. docker compose up --build
#
# NOTE: Redis runs in kiro2-redis container, using external volume kiro2_redis-data.
# NOTE: Elasticsearch runs in turkiye_sinav_elasticsearch container (external network).
# Chroma (optional): set in shell or .env.mvp e.g. CHROMADB_HOST=chroma CHROMADB_PORT=8000
# for HttpClient; leave CHROMADB_HOST empty for embedded persist (CHROMADB_PERSIST_DIR=/app/vector_db).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-backend
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
        "--limit-concurrency",
        "10000",
        "--backlog",
        "10000",
      ]
    ports:
      - "8000:8000"
    env_file:
      - .env.mvp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
      - kiro2-vector-db:/app/vector_db
      - ./d-dataset/output/crops:/app/static/crops:ro
    environment:
      - CROP_IMAGE_DIR=/app/static/crops
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_PERSIST_DIR=${CHROMADB_PERSIST_DIR:-/app/vector_db}
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-Kiro2Elastic2026!}
    restart: unless-stopped
    networks:
      - default
      - turkiye_sinav_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: kiro2-redis
    # Host'a 6379 yayınla — native script/araçların localhost:6379 erişimi için.
    # (Eski kiro2_redis orphan'ı kaldırıldı; tek kanonik redis bu.)
    # 127.0.0.1'e BAĞLI: 30 Tem 2026'da ölçüldü — "6379:6379" Docker'da
    # 0.0.0.0 demek ve LAN'dan kimliksiz "PING" -> "+PONG" alınıyordu.
    # Konteynerler birbirine docker ağı üzerinden konuşuyor
    # (REDIS_URL=redis://kiro2-redis:6379/0), yayınlanan host portundan
    # DEĞİL — bu yüzden kısıtlama uygulamayı etkilemez, yalnız LAN'ı keser.
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --appendonly yes
      --save "60 1000"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - default
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 30 Tem 2026'da compose'a GERİ KONDU. Konteyner 2025-10-18'de yaratılmış ve
  # o günden beri hiçbir compose dosyası tarafından yönetilmiyordu — ama kendi
  # etiketleri hâlâ project=kiro2 / service=elasticsearch diyordu, yani compose
  # onu kendi servisi sayıyor, sadece dosyadan silinmişti. Geri koymak ikisini
  # birleştirir ve port bağlaması artık test edilebilir hâle gelir
  # (backend/tests/unit/test_compose_port_binding.py).
  #
  # Aşağıdaki değerlerin TAMAMI çalışan konteynerden okundu, tahmin DEĞİL:
  #   docker inspect turkiye_sinav_elasticsearch
  # `bootstrap.memory_lock=true` + `ulimits.memlock=-1` birlikte zorunlu —
  # ulimit olmadan ES açılmaz. İki ağ alias'ı da korunuyor: backend
  # ELASTICSEARCH_URL=http://turkiye_sinav_elasticsearch:9200 kullanıyor.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: turkiye_sinav_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # NOT: kimlik doğrulama AÇIK.
      # xpack.security.enabled=true ile ağ üzerinden gelen isteklere şifre sorulur.
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-Kiro2Elastic2026!}
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # 127.0.0.1: 30 Tem 2026 ölçümü — 0.0.0.0'dayken LAN'dan (192.168.8.2:9200)
    # kimliksiz olarak cevap anahtarı çekilebiliyordu (64.270/64.270 doküman
    # correct_answer taşıyor). Konteynerler birbirine docker ağı üzerinden
    # konuştuğu için bu kısıtlama uygulamayı etkilemez.
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      turkiye_sinav_network:
        aliases:
          - turkiye_sinav_elasticsearch
          - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD:-Kiro2Elastic2026!} -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-celery-worker
    command: celery -A celery_worker worker -l info -Q default,emails,reports,features,videos,bulk,claude_md --concurrency=8
    env_file:
      - .env.mvp
    environment:
      - PYTHONPATH=/app
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_PERSIST_DIR=${CHROMADB_PERSIST_DIR:-/app/vector_db}
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-Kiro2Elastic2026!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
      - kiro2-vector-db:/app/vector_db
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - turkiye_sinav_network
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "celery_worker",
          "inspect",
          "ping",
          "--timeout",
          "5",
        ]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-celery-beat
    command: celery -A celery_worker beat -l info
    env_file:
      - .env.mvp
    environment:
      - PYTHONPATH=/app
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_PERSIST_DIR=${CHROMADB_PERSIST_DIR:-/app/vector_db}
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-Kiro2Elastic2026!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - turkiye_sinav_network
    healthcheck:
      # Pings celery-beat scheduler liveness. Beat lacks built-in ping, so we
      # check that the heartbeat file (touched on each schedule tick) was
      # written within the last 5 minutes. See celery_worker.py beat schedule.
      test:
        [
          "CMD-SHELL",
          "celery -A celery_worker inspect ping --timeout 5 || exit 1",
        ]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEMO: "${VITE_SHOW_DEMO:-true}"
        VITE_DEMO_PASSWORD: "${VITE_DEMO_PASSWORD:-Kiro2Beta2026@x}"
    container_name: kiro2-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-logs:
  kiro2-vector-db:

  redis-data:
    external: true
    name: kiro2_redis-data

  # external + açık ad: bu volume 2025-10-18'de yaratıldı ve 64.270 dokümanlık
  # arama index'ini tutuyor. `external: true` compose'un onu YENİDEN YARATMASINI
  # veya `down -v` ile SİLMESİNİ engeller. Ad birebir mevcut volume'ün adı
  # (etiketleri doğruladı: project=kiro2, volume=elasticsearch_data).
  elasticsearch_data:
    external: true
    name: kiro2_elasticsearch_data
networks:
  default:
    driver: bridge
  turkiye_sinav_network:
    external: true
    name: kiro2_turkiye_sinav_network
