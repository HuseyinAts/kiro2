# KIRO2 Production Stack - Docker Compose
# Uses host PostgreSQL (port 5434); Redis runs in kiro2-redis container (external volume)
#
# Setup:
#   1. cp docs/setup/env.mvp.example .env.mvp
#   2. Edit .env.mvp: fill all CHANGE_ME secrets, ensure REDIS_URL=redis://kiro2-redis:6379/0
#   3. docker network create kiro2_turkiye_sinav_network || true
#   4. docker volume create kiro2_redis-data || true
#   5. docker compose up --build
#
# NOTE: Redis runs in kiro2-redis container, using external volume kiro2_redis-data.
# NOTE: Elasticsearch runs in turkiye_sinav_elasticsearch container (external network).
# Chroma (optional): set in shell or .env.mvp e.g. CHROMADB_HOST=chroma CHROMADB_PORT=8000
# for HttpClient; leave CHROMADB_HOST empty for embedded persist (CHROMADB_PERSIST_DIR=/app/vector_db).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.mvp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
      - kiro2-vector-db:/app/vector_db
      - ./d-dataset/output/crops:/app/static/crops:ro
    environment:
      - CROP_IMAGE_DIR=/app/static/crops
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_PERSIST_DIR=${CHROMADB_PERSIST_DIR:-/app/vector_db}
    restart: unless-stopped
    networks:
      - default
      - turkiye_sinav_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: kiro2-redis
    command: >
      redis-server
      --appendonly yes
      --save "60 1000"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - default
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-celery-worker
    command: celery -A celery_worker worker -l info -Q default,emails,reports,features,videos,bulk,claude_md --concurrency=8
    env_file:
      - .env.mvp
    environment:
      - PYTHONPATH=/app
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_PERSIST_DIR=${CHROMADB_PERSIST_DIR:-/app/vector_db}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-logs:/app/logs
      - kiro2-vector-db:/app/vector_db
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - turkiye_sinav_network
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_worker", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-celery-beat
    command: celery -A celery_worker beat -l info
    env_file:
      - .env.mvp
    environment:
      - PYTHONPATH=/app
      - CHROMADB_HOST=${CHROMADB_HOST:-}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_PERSIST_DIR=${CHROMADB_PERSIST_DIR:-/app/vector_db}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - turkiye_sinav_network
    healthcheck:
      # Pings celery-beat scheduler liveness. Beat lacks built-in ping, so we
      # check that the heartbeat file (touched on each schedule tick) was
      # written within the last 5 minutes. See celery_worker.py beat schedule.
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping --timeout 5 || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEMO: "${VITE_SHOW_DEMO:-true}"
        VITE_DEMO_PASSWORD: "${VITE_DEMO_PASSWORD:-Kiro2Beta2026@x}"
    container_name: kiro2-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-logs:
  kiro2-vector-db:

  redis-data:
    external: true
    name: kiro2_redis-data
networks:
  default:
    driver: bridge
  turkiye_sinav_network:
    external: true
    name: kiro2_turkiye_sinav_network
