# =============================================================================
# Static Files PersistentVolumeClaim
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-files-pvc
  namespace: turkiye-sinav-platform
  labels:
    app.kubernetes.io/name: turkiye-sinav-platform
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "efs-sc"
  resources:
    requests:
      storage: 10Gi

---
