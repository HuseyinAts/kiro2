apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiro2-backend
  labels:
    app: kiro2
    component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kiro2-backend-role
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kiro2-backend-rolebinding
subjects:
  - kind: ServiceAccount
    name: kiro2-backend
roleRef:
  kind: Role
  name: kiro2-backend-role
  apiGroup: rbac.authorization.k8s.io
