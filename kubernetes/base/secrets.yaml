# IMPORTANT: Replace placeholder values with actual secrets
# In production, use external-secrets or sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: kiro2-secrets
  labels:
    app: kiro2
type: Opaque
stringData:
  # Database connection (replace with actual values)
  database-url: "postgresql+asyncpg://user:password@postgres:5432/kiro2"
  # Redis connection
  redis-url: "redis://redis:6379/0"
  # JWT Secret (generate with: openssl rand -hex 32)
  jwt-secret: "REPLACE_WITH_SECURE_SECRET"
  # API Keys
  openai-api-key: ""
  hf-api-key: ""
