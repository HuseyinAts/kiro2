# Network Policy for KIRO2
# Task #25: Service Mesh Prep
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiro2-backend-network-policy
  labels:
    app: kiro2
spec:
  podSelector:
    matchLabels:
      app: kiro2
      component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow from frontend
    - from:
        - podSelector:
            matchLabels:
              app: kiro2
              component: frontend
      ports:
        - protocol: TCP
          port: 8000
    # Allow from other backend pods (internal communication)
    - from:
        - podSelector:
            matchLabels:
              app: kiro2
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow to external APIs (DNS)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS egress
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
