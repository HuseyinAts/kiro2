# KIRO2 MVP Beta Launch - Docker Compose
# Uses host PostgreSQL (port 5434) and Redis (port 6379)
# Ollama (GPU) serves Qwen3:8B for AI learning paths + chat
#
# Setup:
#   1. cp .env.mvp.example .env.mvp
#   2. Edit .env.mvp with real values (secrets, DB password)
#   3. docker compose -f docker-compose.mvp.yml up --build
#
# GPU Note: Requires NVIDIA Container Toolkit for GPU acceleration
#   Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kiro2-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  ollama-pull:
    image: ollama/ollama:latest
    container_name: kiro2-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama pull qwen3:8b && ollama pull nomic-embed-text"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: kiro2-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.mvp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs
      - ./d-dataset/output/crops:/app/static/crops:ro
    environment:
      - CROP_IMAGE_DIR=/app/static/crops
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOW_DEMO: "true"
    container_name: kiro2-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  backend-logs:
  ollama-models:

networks:
  default:
    driver: bridge
