# PostgreSQL Replica (Standby) Server Configuration (Task 52.2)
# High Availability Streaming Replication Setup
# Author: Claude
# Date: 2025-10-27

# =============================================================================
# REPLICATION CONFIGURATION
# =============================================================================

# Enable hot standby (allow read queries on replica)
hot_standby = on
hot_standby_feedback = on  # Prevent query conflicts

# Maximum standby delay before query cancellation
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s

# WAL receiver settings
wal_receiver_status_interval = 10s
wal_retrieve_retry_interval = 5s

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

# Listen on all interfaces
listen_addresses = '*'
port = 5432

# Maximum number of connections (should match primary)
max_connections = 200

# =============================================================================
# PERFORMANCE TUNING (Same as Primary)
# =============================================================================

# Memory settings (adjust based on available RAM)
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB

# Query planner
random_page_cost = 1.1
effective_io_concurrency = 200

# =============================================================================
# LOGGING
# =============================================================================

log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

log_min_duration_statement = 1000
log_connections = on
log_disconnections = on

# =============================================================================
# MONITORING
# =============================================================================

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

track_io_timing = on
track_functions = all

# =============================================================================
# SECURITY
# =============================================================================

ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file = '/var/lib/postgresql/server.key'
password_encryption = scram-sha-256

# =============================================================================
# AUTOVACUUM
# =============================================================================

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# =============================================================================
# RECOVERY CONFIGURATION (PostgreSQL 12+)
# =============================================================================

# Note: For PostgreSQL 12+, recovery configuration is in postgresql.auto.conf
# Create standby.signal file to enable standby mode:
# touch /var/lib/postgresql/data/standby.signal

# Primary connection info (add to postgresql.auto.conf):
# primary_conninfo = 'host=primary_host port=5432 user=replicator password=your_password application_name=replica1'
# primary_slot_name = 'replica1_slot'
# restore_command = 'cp /var/lib/postgresql/wal_archive/%f %p'

# =============================================================================
# SETUP INSTRUCTIONS
# =============================================================================

# 1. Stop PostgreSQL on replica:
#    sudo systemctl stop postgresql
#
# 2. Remove existing data directory:
#    sudo rm -rf /var/lib/postgresql/data/*
#
# 3. Create base backup from primary:
#    sudo -u postgres pg_basebackup -h primary_host -D /var/lib/postgresql/data -U replicator -P -v -R -X stream -C -S replica1_slot
#
# 4. The -R flag automatically creates standby.signal and recovery configuration
#
# 5. Start PostgreSQL on replica:
#    sudo systemctl start postgresql
#
# 6. Verify replication status on primary:
#    SELECT * FROM pg_stat_replication;
#
# 7. Check replication lag on replica:
#    SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())) AS lag_seconds;
#
# 8. Test read queries on replica (should work):
#    SELECT count(*) FROM users;
#
# 9. Test write queries on replica (should fail):
#    INSERT INTO users ... (should return error: cannot execute INSERT in a read-only transaction)
