# PostgreSQL Primary Server Configuration (Task 52.2)
# High Availability Streaming Replication Setup
# Author: Claude
# Date: 2025-10-27

# =============================================================================
# REPLICATION CONFIGURATION
# =============================================================================

# Enable streaming replication
wal_level = replica

# Maximum number of concurrent connections from standby servers
max_wal_senders = 10

# Maximum number of replication slots
max_replication_slots = 10

# Allow read queries on standby servers
hot_standby = on

# Write Ahead Log (WAL) configuration
wal_keep_size = 1GB  # Keep at least 1GB of WAL files
max_wal_size = 2GB
min_wal_size = 80MB

# Archive WAL files for point-in-time recovery (PITR)
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 60  # Force WAL switch every 60 seconds

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

# Listen on all interfaces (adjust for security)
listen_addresses = '*'
port = 5432

# Maximum number of connections
max_connections = 200

# Connection pooling (use with PgBouncer)
superuser_reserved_connections = 3

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Memory settings (adjust based on available RAM)
shared_buffers = 2GB              # 25% of RAM
effective_cache_size = 6GB        # 75% of RAM
maintenance_work_mem = 512MB
work_mem = 16MB

# Checkpoint settings
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# Query planner
random_page_cost = 1.1  # For SSD storage
effective_io_concurrency = 200

# =============================================================================
# LOGGING
# =============================================================================

log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Log slow queries
log_min_duration_statement = 1000  # Log queries taking > 1 second

# Log connections and disconnections
log_connections = on
log_disconnections = on

# Log replication info
log_replication_commands = on

# =============================================================================
# MONITORING
# =============================================================================

# Track activities for pg_stat_statements
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# Track I/O timing
track_io_timing = on
track_functions = all

# =============================================================================
# SECURITY
# =============================================================================

# SSL configuration (recommended for production)
ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file = '/var/lib/postgresql/server.key'

# Password encryption
password_encryption = scram-sha-256

# Statement timeout (prevent long-running queries)
statement_timeout = 60000  # 60 seconds

# =============================================================================
# AUTOVACUUM
# =============================================================================

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# NOTES
# =============================================================================

# 1. After changing this file, reload PostgreSQL:
#    sudo systemctl reload postgresql
#
# 2. For replication user, run:
#    CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD 'your_secure_password';
#
# 3. Configure pg_hba.conf to allow replication connections:
#    host replication replicator replica_ip/32 scram-sha-256
#
# 4. Create WAL archive directory:
#    sudo mkdir -p /var/lib/postgresql/wal_archive
#    sudo chown postgres:postgres /var/lib/postgresql/wal_archive
#
# 5. Monitor replication status:
#    SELECT * FROM pg_stat_replication;
