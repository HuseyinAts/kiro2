# Redis Configuration for Türkiye Üniversite Sınavları Hazırlık Platformu
# PRODUCTION-READY PERSISTENCE CONFIGURATION

# ==================== NETWORK ====================
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ==================== PERSISTENCE - HYBRID (AOF + RDB) ====================

# RDB Snapshots (point-in-time backups)
# Syntax: save <seconds> <changes>
save 900 1      # Save if at least 1 key changed in 900 seconds (15 min)
save 300 10     # Save if at least 10 keys changed in 300 seconds (5 min)
save 60 10000   # Save if at least 10000 keys changed in 60 seconds (1 min)

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) - More durable
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy (durability vs performance)
# Options: always (slow, most durable), everysec (good balance), no (fast, least durable)
appendfsync everysec

# AOF rewrite configuration
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF corruption recovery
aof-load-truncated yes
aof-use-rdb-preamble yes

# ==================== MEMORY MANAGEMENT ====================

# Max memory (adjust based on available RAM)
maxmemory 512mb

# Eviction policy when maxmemory is reached
# Options: volatile-lru, allkeys-lru, volatile-lfu, allkeys-lfu, volatile-random, allkeys-random, volatile-ttl, noeviction
maxmemory-policy allkeys-lru

# Samples for LRU/LFU algorithms
maxmemory-samples 5

# ==================== LAZY FREEING ====================
# Delete keys in background to avoid blocking
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ==================== SECURITY ====================
# Require password (set via environment variable in docker-compose)
# requirepass YOUR_STRONG_PASSWORD_HERE

# Rename dangerous commands (optional)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ==================== LOGGING ====================
loglevel notice
logfile ""

# ==================== PERFORMANCE ====================

# Max number of clients
maxclients 10000

# Disable slow log for production (or set threshold)
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# ==================== ADVANCED CONFIG ====================

# Database count
databases 16

# Lua script time limit (ms)
lua-time-limit 5000

# Latency monitoring
latency-monitor-threshold 100  # 100ms

# ==================== REPLICATION (for future HA setup) ====================
# replicaof <master-ip> <master-port>
# masterauth <master-password>

replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# ==================== CLUSTER (for future scaling) ====================
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000

# ==================== MONITORING ====================
# Slow queries
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency tracking
latency-monitor-threshold 100

# Client output buffer limits
# client-output-buffer-limit normal 0 0 0
# client-output-buffer-limit replica 256mb 64mb 60
# client-output-buffer-limit pubsub 32mb 8mb 60

# ==================== BACKUP NOTES ====================
# Backup strategy:
# 1. RDB snapshots: /data/dump.rdb (every 15min/5min/1min based on activity)
# 2. AOF log: /data/appendonly.aof (every second)
# 3. External backups: Copy /data directory to backup location daily
#
# Recovery priority:
# 1. AOF file (most recent data)
# 2. RDB snapshot (point-in-time backup)
#
# Data loss scenarios:
# - AOF everysec: Max 1 second of data loss
# - RDB only: Max 15 minutes of data loss (based on save intervals)
# - Hybrid (AOF + RDB): Best of both worlds

# ==================== PRODUCTION RECOMMENDATIONS ====================
# 1. Set maxmemory based on available RAM (leave 25% for OS)
# 2. Use appendfsync everysec for balance of durability and performance
# 3. Enable both RDB and AOF for hybrid persistence
# 4. Monitor memory usage and adjust eviction policy
# 5. Set up automated backups of /data directory
# 6. Test disaster recovery procedures regularly
# 7. Consider Redis Sentinel or Cluster for HA in production
