name: Quality Gates

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  coverage-gate:
    name: Coverage Quality Gate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Run coverage analysis
      run: |
        cd backend
        python -m pytest --cov=. --cov-report=json:coverage.json --cov-fail-under=20

    - name: Coverage Quality Gate
      run: |
        cd backend
        python3 << 'EOF'
        import json
        import sys
        
        # Load coverage data
        with open('coverage.json', 'r') as f:
            coverage_data = json.load(f)
        
        # Extract coverage percentage
        total_coverage = coverage_data['totals']['percent_covered']
        
        print(f"📊 Current Coverage: {total_coverage:.2f}%")
        
        # Define quality gates
        gates = {
            'minimum': 20.0,    # Minimum acceptable coverage
            'good': 50.0,       # Good coverage level
            'excellent': 80.0   # Excellent coverage level
        }
        
        # Check quality gates
        if total_coverage >= gates['excellent']:
            print("🎉 EXCELLENT: Coverage is excellent!")
            status = "excellent"
        elif total_coverage >= gates['good']:
            print("✅ GOOD: Coverage is good")
            status = "good"
        elif total_coverage >= gates['minimum']:
            print("⚠️  ACCEPTABLE: Coverage meets minimum requirements")
            status = "acceptable"
        else:
            print("❌ FAILED: Coverage is below minimum threshold")
            status = "failed"
            sys.exit(1)
        
        # Set output for next steps
        print(f"::set-output name=coverage::{total_coverage}")
        print(f"::set-output name=status::{status}")
        EOF

  complexity-gate:
    name: Code Complexity Gate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install radon xenon

    - name: Analyze code complexity
      run: |
        cd backend
        echo "📈 Analyzing code complexity..."
        
        # Cyclomatic complexity
        echo "## Cyclomatic Complexity"
        radon cc . --average --show-complexity
        
        # Maintainability index
        echo "## Maintainability Index"
        radon mi . --show --sort
        
        # Halstead metrics
        echo "## Halstead Metrics"
        radon hal . --functions
        
        # Raw metrics
        echo "## Raw Metrics"
        radon raw . --summary

    - name: Complexity Quality Gate
      run: |
        cd backend
        # Check for high complexity functions (> 10)
        echo "🔍 Checking complexity gates..."
        
        HIGH_COMPLEXITY=$(radon cc . --min=C --json | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        count = sum(len(funcs) for funcs in data.values())
        print(count)
        ")
        
        echo "High complexity functions: $HIGH_COMPLEXITY"
        
        if [ "$HIGH_COMPLEXITY" -gt 20 ]; then
          echo "❌ FAILED: Too many high complexity functions ($HIGH_COMPLEXITY > 20)"
          exit 1
        elif [ "$HIGH_COMPLEXITY" -gt 10 ]; then
          echo "⚠️  WARNING: Several high complexity functions ($HIGH_COMPLEXITY > 10)"
        else
          echo "✅ PASSED: Code complexity is acceptable"
        fi

  security-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety semgrep

    - name: Security analysis with Bandit
      run: |
        cd backend
        echo "🛡️  Running security analysis..."
        bandit -r . -f json -o bandit-results.json
        bandit -r . -f txt

    - name: Dependency security check
      run: |
        cd backend
        echo "🔒 Checking dependency security..."
        safety check --json --output safety-results.json
        safety check

    - name: Advanced security scan with Semgrep
      run: |
        cd backend
        echo "🔍 Running advanced security patterns..."
        semgrep --config=auto --json --output=semgrep-results.json . || true
        semgrep --config=auto . || true

    - name: Security Quality Gate
      run: |
        cd backend
        python3 << 'EOF'
        import json
        import sys
        import os
        
        print("🛡️  Security Quality Gate Analysis")
        
        # Check Bandit results
        if os.path.exists('bandit-results.json'):
            with open('bandit-results.json', 'r') as f:
                bandit_data = json.load(f)
            
            high_issues = len([i for i in bandit_data.get('results', []) 
                             if i.get('issue_severity') == 'HIGH'])
            medium_issues = len([i for i in bandit_data.get('results', []) 
                               if i.get('issue_severity') == 'MEDIUM'])
            
            print(f"🔍 Bandit: {high_issues} high, {medium_issues} medium issues")
            
            if high_issues > 0:
                print("❌ FAILED: High severity security issues found")
                sys.exit(1)
            elif medium_issues > 5:
                print("⚠️  WARNING: Many medium severity issues")
            else:
                print("✅ PASSED: No critical security issues")
        
        # Check Safety results
        if os.path.exists('safety-results.json'):
            with open('safety-results.json', 'r') as f:
                safety_data = json.load(f)
            
            if safety_data:
                print(f"🔒 Safety: {len(safety_data)} vulnerable dependencies")
                if len(safety_data) > 0:
                    print("❌ FAILED: Vulnerable dependencies found")
                    sys.exit(1)
            else:
                print("✅ PASSED: No vulnerable dependencies")
        
        print("✅ Security quality gate passed!")
        EOF

  final-gate:
    name: Final Quality Gate
    runs-on: ubuntu-latest
    needs: [coverage-gate, complexity-gate, security-gate]
    if: always()
    
    steps:
    - name: Quality Gate Summary
      run: |
        echo "📋 Quality Gate Summary"
        echo "======================"
        
        if [ "${{ needs.coverage-gate.result }}" = "success" ]; then
          echo "✅ Coverage Gate: PASSED"
        else
          echo "❌ Coverage Gate: FAILED"
        fi
        
        if [ "${{ needs.complexity-gate.result }}" = "success" ]; then
          echo "✅ Complexity Gate: PASSED"
        else
          echo "❌ Complexity Gate: FAILED"
        fi
        
        if [ "${{ needs.security-gate.result }}" = "success" ]; then
          echo "✅ Security Gate: PASSED"
        else
          echo "❌ Security Gate: FAILED"
        fi
        
        # Check if all gates passed
        if [ "${{ needs.coverage-gate.result }}" = "success" ] && \
           [ "${{ needs.complexity-gate.result }}" = "success" ] && \
           [ "${{ needs.security-gate.result }}" = "success" ]; then
          echo ""
          echo "🎉 ALL QUALITY GATES PASSED!"
          echo "Code is ready for deployment 🚀"
        else
          echo ""
          echo "❌ QUALITY GATE FAILURE"
          echo "Please fix the issues before merging"
          exit 1
        fi