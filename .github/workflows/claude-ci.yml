name: Claude Code CI

on:
  # Actions-minute reduction: ci.yml backend/frontend testleri zaten koşuyor;
  # bu workflow onları tekrarlıyordu + ANTHROPIC_API_KEY eksik. Yalnız manuel.
  workflow_dispatch:
    inputs:
      task:
        description: 'Custom task for Claude'
        required: false
        default: 'Review changes and run tests'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Setup and Cache
  setup:
    runs-on: ubuntu-latest
    outputs:
      backend-cache-key: ${{ steps.cache-keys.outputs.backend }}
      frontend-cache-key: ${{ steps.cache-keys.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "backend=${{ hashFiles('backend/requirements.txt') }}" >> $GITHUB_OUTPUT
          echo "frontend=${{ hashFiles('frontend/package-lock.json') }}" >> $GITHUB_OUTPUT

  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kiro2
          POSTGRES_PASSWORD: kiro2_test
          POSTGRES_DB: kiro2_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ needs.setup.outputs.backend-cache-key }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          cd backend
          # DISK: requirements.txt `torch>=2.1.0` diyor; PyPI'nin Linux
          # varsayilani CUDA yapisi (yaninda nvidia-* + triton). Olculdu:
          # 3.677 MB wheel yigininin 2.987 MB'i yalniz CUDA. Runner'da GPU
          # YOK; kurulum [Errno 28] No space left on device ile dusuyordu.
          # CPU yapisi ONCE kurulunca kisit karsilanir, nvidia-* cekilmez.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run linting
        run: |
          cd backend
          # .pre-commit-config.yaml ile ayni pin -- docs/guvenlik-borcu.md SS10.42
          pip install ruff==0.7.1 mypy==1.11.2
          ruff check . --select=E,F,W --ignore=E501
          mypy --ignore-missing-imports main.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql://kiro2:kiro2_test@localhost:5434/kiro2_test
          REDIS_URL: redis://localhost:6379
          TESTING: "true"
        run: |
          cd backend
          pytest -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ needs.setup.outputs.frontend-cache-key }}
          restore-keys: npm-

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linting
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd frontend
          npm test -- --watchAll=false --coverage

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # Security Scan
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit
        run: |
          cd backend
          bandit -r . -f json -o bandit-report.json
        continue-on-error: true

      - name: Run Safety
        run: |
          cd backend
          safety check --json > safety-report.json
        continue-on-error: true

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  # KALDIRILDI (8 Eyl 2026): buradaki `claude-review` isi calisamaz
  # durumdaydi ve claude-review.yml'deki `auto-review` isinin kopyasiydi.
  #   * `claude-code-action@v2` diye bir ref YOK (tag 404, branch []),
  #   * girdilerin besi upstream action.yml'de tanimli degil
  #     (task/headless/timeout/max_turns/output_format),
  #   * "Post review comment" adimi hic uretilmeyen bir review.json okuyor.
  # Patlamamis olmasinin tek sebebi `needs: [backend-tests, frontend-tests]`
  # zincirinin her PR'da kirmizi olmasiydi; testler yesile donunce aniden
  # kirmizi verecekti. Inceleme claude-review.yml'de surdurulyor.

  # Quality Gate
  quality-gate:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security]
    steps:
      - name: Check quality gate
        run: |
          echo "All checks passed! ✅"
          echo "Backend tests: ✅"
          echo "Frontend tests: ✅"
          echo "Security scan: ✅"

  # Notify
  notify:
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: always()
    steps:
      - name: Notify on success
        if: needs.quality-gate.result == 'success'
        run: |
          echo "✅ CI passed successfully"

      - name: Notify on failure
        if: needs.quality-gate.result == 'failure'
        run: |
          echo "❌ CI failed"
          exit 1
