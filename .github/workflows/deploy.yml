name: Production Deployment Pipeline

on:
  # Actions-minute reduction: deploy yalnız version tag'inde veya manuel.
  # Eskiden her push/PR'da 10 deploy job'u koşuyordu (KUBE_CONFIG yokken
  # zaten fail). push-branches + pull_request kaldırıldı.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
          - hotfix
      skip_tests:
        description: 'Skip Tests (EMERGENCY ONLY - requires approval)'
        required: false
        type: boolean
        default: false
      rollback:
        description: 'Rollback to Previous Version'
        required: false
        type: boolean
        default: false

env:
  # Container Registry Settings
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  DOCKER_BUILDKIT: 1
  
  # Python Settings
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip
  
  # Node Settings  
  NODE_VERSION: '20'
  
  # Kubernetes Settings
  KUBE_NAMESPACE: kiro2
  HELM_VERSION: 'v3.13.0'
  
  # Cloud Providers
  AWS_DEFAULT_REGION: eu-west-1
  GCP_REGION: europe-west1
  AZURE_REGION: westeurope
  
  # Testing
  PYTEST_TIMEOUT: 600
  COVERAGE_THRESHOLD: 80

concurrency:
  group: deploy-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. Pre-deployment Validation
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine.outputs.environment }}
      version: ${{ steps.version.outputs.version }}
      should_deploy: ${{ steps.checks.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Environment
        id: determine
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=development" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=preview" >> $GITHUB_OUTPUT
          fi

      - name: Generate Version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always --dirty)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Pre-deployment Checks
        id: checks
        run: |
          # Check if deployment should proceed
          SHOULD_DEPLOY=true
          
          # Check for deployment freeze
          if [ -f .deployment-freeze ]; then
            echo "Deployment freeze detected"
            SHOULD_DEPLOY=false
          fi
          
          # Check commit message for skip indicators
          if git log -1 --pretty=%B | grep -q "\[skip deploy\]"; then
            echo "Skip deploy flag detected"
            SHOULD_DEPLOY=false
          fi
          
          echo "should_deploy=${SHOULD_DEPLOY}" >> $GITHUB_OUTPUT

  # 2. Security Scanning
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Dependency Check
        run: |
          python -m pip install safety bandit
          safety check --json
          bandit -r backend/ -f json -o bandit-report.json

      - name: SAST Analysis
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Build & Test
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event.inputs.skip_tests != 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiro2_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        test-suite: [unit, integration, e2e, performance]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.local
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements*.txt', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run ${{ matrix.test-suite }} Tests
        run: |
          if [[ "${{ matrix.test-suite }}" == "unit" ]]; then
            pytest tests/ -m "not integration and not e2e" \
              --cov=backend --cov-report=xml --cov-report=html \
              -n auto --timeout=${{ env.PYTEST_TIMEOUT }}
          elif [[ "${{ matrix.test-suite }}" == "integration" ]]; then
            pytest tests/ -m integration \
              --timeout=${{ env.PYTEST_TIMEOUT }}
          elif [[ "${{ matrix.test-suite }}" == "e2e" ]]; then
            pytest tests/test_e2e_production.py \
              --timeout=1200
          elif [[ "${{ matrix.test-suite }}" == "performance" ]]; then
            echo "Running performance tests"
            # Add performance test commands
          fi

      - name: Check Coverage
        if: matrix.test-suite == 'unit'
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}
          path: |
            coverage.xml
            htmlcov/
            test-results/

  # 4. Build Container Images
  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [validate, build-test]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.17.3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ needs.validate.outputs.environment }}-
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.validate.outputs.version }}
          secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"

      - name: Sign Container Image
        run: |
          echo "Signing container image"
          # cosign sign ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Scan Container Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'container-scan.sarif'

  # 5. Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [validate, build-images]
    if: needs.validate.outputs.environment == 'development'
    environment:
      name: development
      url: https://dev.kiro2.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Development
        run: |
          echo "Deploying to development environment"
          # Add deployment commands

      - name: Smoke Tests
        run: |
          ./scripts/smoke-test.sh development

  # 6. Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, build-images]
    if: needs.validate.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.kiro2.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy with Helm
        run: |
          helm upgrade --install kiro2-staging ./k8s/helm \
            --namespace ${{ env.KUBE_NAMESPACE }}-staging \
            --create-namespace \
            --set image.tag=${{ needs.validate.outputs.version }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set environment=staging \
            --wait \
            --timeout 10m

      - name: Run Staging Tests
        run: |
          API_URL="http://kiro2-api.${{ env.KUBE_NAMESPACE }}-staging:8000"

          # 1. Health Check
          echo "1. Testing health endpoint..."
          kubectl run staging-health --image=curlimages/curl:latest \
            --rm -i --restart=Never \
            -- curl -f "$API_URL/health" || exit 1

          # 2. Database Connection Test
          echo "2. Testing database connection..."
          kubectl run staging-db --image=curlimages/curl:latest \
            --rm -i --restart=Never \
            -- curl -f "$API_URL/health/db" || exit 1

          # 3. Auth Flow Test (Login)
          echo "3. Testing authentication flow..."
          kubectl run staging-auth --image=curlimages/curl:latest \
            --rm -i --restart=Never -- /bin/sh -c '
              TOKEN=$(curl -s -X POST "$API_URL/api/v1/auth/login" \
                -H "Content-Type: application/json" \
                -d "{\"email\":\"test@staging.kiro2.com\",\"password\":\"${{ secrets.STAGING_TEST_PASSWORD }}\"}" \
                | jq -r ".access_token")

              if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
                echo "Auth failed: No token received"
                exit 1
              fi

              # 4. Protected Endpoint Test
              RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/response.json \
                -H "Authorization: Bearer $TOKEN" \
                "$API_URL/api/v1/me")

              if [ "$RESPONSE" != "200" ]; then
                echo "Protected endpoint failed: HTTP $RESPONSE"
                exit 1
              fi

              echo "All staging tests passed!"
            '

          echo "✅ Staging tests completed successfully"

  # 7. Deploy to Production (Blue-Green)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, build-images, deploy-staging]
    if: needs.validate.outputs.environment == 'production' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://kiro2.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.PROD_KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Backup Current Deployment
        run: |
          kubectl get deploy -n ${{ env.KUBE_NAMESPACE }} -o yaml > deployment-backup.yaml
          kubectl get svc -n ${{ env.KUBE_NAMESPACE }} -o yaml > service-backup.yaml

      - name: Blue-Green Deployment
        run: |
          # Deploy Green version
          kubectl set image deployment/kiro2-api-green \
            kiro2-api=${{ env.DOCKER_IMAGE }}:${{ needs.validate.outputs.version }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --record

          # Wait for rollout
          kubectl rollout status deployment/kiro2-api-green \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=600s

          # Run health checks
          ./scripts/health-check.sh production-green

          # Switch traffic
          kubectl patch service kiro2-api \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"deployment":"green"}}}'

          # Monitor for 5 minutes
          sleep 300

          # If successful, scale down blue
          kubectl scale deployment kiro2-api-blue --replicas=0 \
            -n ${{ env.KUBE_NAMESPACE }}

      - name: Production Validation
        run: |
          # Run comprehensive tests
          pytest tests/test_production_integration.py -v

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "🔄 Rolling back production deployment..."

          # Verify backup files exist
          if [ ! -f deployment-backup.yaml ] || [ ! -f service-backup.yaml ]; then
            echo "❌ Backup files not found, attempting rollback via kubectl"
            kubectl rollout undo deployment/kiro2-api-green -n ${{ env.KUBE_NAMESPACE }} || true
            exit 1
          fi

          # Switch traffic back to blue immediately
          kubectl patch service kiro2-api \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"deployment":"blue"}}}' || true

          # Restore from backup
          kubectl apply -f deployment-backup.yaml || true
          kubectl apply -f service-backup.yaml || true

          # Wait for rollback completion
          kubectl rollout status deployment/kiro2-api-blue \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=300s || true

          # Verify rollback health
          if ! curl -sf https://kiro2.example.com/health; then
            echo "❌ Rollback health check failed!"
            exit 1
          fi

          echo "✅ Rollback completed successfully"

  # 8. Post-deployment Tasks
  post-deploy:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Update Documentation
        run: |
          echo "Updating deployment documentation"

      - name: Clean Old Images
        run: |
          echo "Cleaning old container images"

      - name: Update Metrics
        run: |
          echo "Updating deployment metrics"

      - name: Send Notifications
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment Status: ${{ job.status }}
            Environment: ${{ needs.validate.outputs.environment }}
            Version: ${{ needs.validate.outputs.version }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

  # 9. Rollback Job
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.rollback == 'true'
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to Previous Version
        run: |
          echo "Rolling back ${{ github.event.inputs.environment }} environment"

          # Get current deployment
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$CURRENT_TAG" ]; then
            echo "❌ No tags found for rollback"
            exit 1
          fi

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 $CURRENT_TAG^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "❌ No previous version found for rollback"
            exit 1
          fi

          echo "📦 Rolling back from $CURRENT_TAG to $PREV_TAG"

          # Checkout previous version
          git checkout $PREV_TAG

          # Trigger redeploy with previous version
          echo "✅ Rollback to $PREV_TAG prepared"
          echo "ROLLBACK_VERSION=$PREV_TAG" >> $GITHUB_ENV

  # 10. Performance Monitoring
  monitor:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: needs.validate.outputs.environment == 'production'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust

      - name: Run Performance Tests
        run: |
          echo "Running performance benchmarks against production..."

          # Create locustfile if not exists
          if [ ! -f tests/load/locustfile.py ]; then
            mkdir -p tests/load
            cat > tests/load/locustfile.py << 'EOF'
          from locust import HttpUser, task, between

          class APIUser(HttpUser):
              wait_time = between(1, 3)

              @task(3)
              def health_check(self):
                  self.client.get("/health")

              @task(2)
              def get_questions(self):
                  self.client.get("/api/v1/questions?limit=10")

              @task(1)
              def search_questions(self):
                  self.client.get("/api/v1/questions/search?q=matematik")
          EOF
          fi

          # Run load test (100 users, 10 spawn rate, 60 seconds)
          locust -f tests/load/locustfile.py \
            --headless \
            --users 100 \
            --spawn-rate 10 \
            --run-time 60s \
            --host https://api.kiro2.example.com \
            --csv=results/perf \
            --html=results/perf_report.html || true

      - name: Check SLA Metrics
        run: |
          echo "Checking SLA compliance..."

          if [ -f results/perf_stats.csv ]; then
            # Extract P95 latency from results
            P95=$(awk -F',' 'NR==2 {print $7}' results/perf_stats.csv)

            echo "P95 Latency: ${P95}ms"

            # SLA: P95 < 500ms
            if [ ! -z "$P95" ] && [ $(echo "$P95 > 500" | bc -l) -eq 1 ]; then
              echo "❌ SLA VIOLATION: P95 latency (${P95}ms) exceeds 500ms threshold"
              # Don't exit 1 - just warn
            else
              echo "✅ SLA OK: P95 latency within threshold"
            fi

            # Extract error rate
            FAILURES=$(awk -F',' 'NR==2 {print $4}' results/perf_stats.csv)
            TOTAL=$(awk -F',' 'NR==2 {print $3}' results/perf_stats.csv)

            if [ ! -z "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              ERROR_RATE=$(echo "scale=2; $FAILURES / $TOTAL * 100" | bc)
              echo "Error Rate: ${ERROR_RATE}%"

              if [ $(echo "$ERROR_RATE > 5" | bc -l) -eq 1 ]; then
                echo "❌ SLA VIOLATION: Error rate (${ERROR_RATE}%) exceeds 5% threshold"
              else
                echo "✅ SLA OK: Error rate within threshold"
              fi
            fi
          else
            echo "⚠️ No performance results found"
          fi

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: results/
          retention-days: 30

      - name: Generate Report
        run: |
          echo "## Performance Report" > results/REPORT.md
          echo "" >> results/REPORT.md
          echo "Date: $(date)" >> results/REPORT.md
          echo "Environment: Production" >> results/REPORT.md
          echo "" >> results/REPORT.md

          if [ -f results/perf_stats.csv ]; then
            echo "### Summary" >> results/REPORT.md
            head -2 results/perf_stats.csv >> results/REPORT.md
          fi

          echo "✅ Performance report generated"