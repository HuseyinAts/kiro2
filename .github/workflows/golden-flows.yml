# Golden Flow Merge Gate
#
# Runs the 8 critical end-to-end user journeys against a live backend stack.
# These are NOT unit tests — they exist to catch silent regressions that unit
# tests miss (wrong tables, broken routers, case convention drift, missing
# seed data, middleware wiring bugs).
#
# Rule: Any PR that breaks a Golden Flow MUST NOT be merged. New top-level
# user features MUST add a new Golden Flow test before shipping.
#
# See:
#   - backend/tests/e2e/test_golden_flows.py
#   - .claude/rules/case-convention.md (Endpoint Gate)
#   - .claude/rules/path-naming.md    (TR/EN drift)

name: Golden Flows

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: golden-flows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-flows:
    name: 8 Golden Flow E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiro2
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/kiro2
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-jwt-secret-for-golden-flows-ci-not-for-production-use-only
      BACKEND_URL: http://localhost:8000
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest pytest-asyncio

      - name: AST lint — Pattern A/B dependency traps (HIGH only)
        working-directory: backend
        run: |
          # Session 137 Aşama 4 CI gate:
          # Block any PR that introduces a new Pattern A (sync get_db +
          # `await db.*` -> MissingGreenlet 500) or Pattern B
          # (`current_user.id` on a Pydantic TokenPayload -> AttributeError
          # 500) regression. MEDIUM type-lies are tracked as tech debt
          # and will be worked down incrementally.
          # See docs/audits/2026-04-10_db-dependency-baseline.md
          python scripts/audit_db_dependency.py --fail-on-high

      - name: AST lint — Missing-auth on write/compute endpoints
        working-directory: backend
        run: |
          # Session 138/139 CI gate:
          # Block any PR that introduces a new write/admin/compute endpoint
          # without an authentication dependency. Catches three classes of
          # silent regression:
          #   - Category A: write/admin endpoints exposed anonymously (IDOR,
          #     unauthorized DB mutations).
          #   - Category B1: LLM/TTS/YouTube cost-abuse vectors (Gemini,
          #     OpenAI, Claude, Qwen, gTTS, YouTube quota burn).
          #   - Category B2: compute/search endpoints that touch the 77K
          #     question bank or expensive NLP services anonymously.
          # Legitimately public endpoints are allow-listed in
          # PUBLIC_PATH_SUBSTRINGS at the top of the linter.
          python scripts/audit_missing_auth.py --fail-on-high

      - name: AST lint — Question dual-table trap
        working-directory: backend
        run: |
          # Session 139 CI gate:
          # Block any PR that imports the legacy `Question` symbol from
          # `models.content_db` / `models.database` into production code
          # paths (api/, services/, core/). The legacy `questions` table
          # holds ~36K partial rows; the production `question_bank` table
          # holds 77K. Querying the wrong one silently returns ~47% of
          # the catalog and causes the multi-session bug class documented
          # in testing.md lessons #23, #24, #26.
          # Re-export hubs (models/__init__.py, models/database.py) and
          # tests/scripts/alembic are allow-listed.
          python scripts/audit_dual_table_trap.py --fail-on-high

      - name: AST lint — Missing `is_active` filter on question read paths
        working-directory: backend
        run: |
          # Session 139 CI gate:
          # Block any PR that adds a public read-path handler querying
          # `QuestionBankItem` / `Question` without an `is_active` filter.
          # 13K+ inactive rows are soft-deleted in `question_bank` (Session
          # 78 cleanup, intentionally reversible) — leaking them back to
          # students breaks the production catalog invariant. testing.md
          # lesson #24. Admin/CRUD handlers (update/delete/history/version/
          # restore/audit/admin/bulk) are allow-listed by name and path.
          python scripts/audit_missing_is_active.py --fail-on-high

      - name: Run migrations
        working-directory: backend
        run: |
          alembic upgrade head || echo "::warning::alembic upgrade failed — continuing with raw schema"

      - name: Seed MVP users
        working-directory: backend
        run: |
          python scripts/seed_mvp_data.py || echo "::warning::seed script failed — GF tests will skip unauthenticated flows"

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not come up within 30s"
          tail -100 backend/backend.log || true
          exit 1

      - name: Run Golden Flow tests
        working-directory: backend
        run: |
          pytest tests/e2e/test_golden_flows.py -m golden_flow -v --tb=short -x

      - name: Backend log on failure
        if: failure()
        working-directory: backend
        run: tail -200 backend.log || true

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
