# Golden Flow Merge Gate
#
# Runs the 8 critical end-to-end user journeys against a live backend stack.
# These are NOT unit tests — they exist to catch silent regressions that unit
# tests miss (wrong tables, broken routers, case convention drift, missing
# seed data, middleware wiring bugs).
#
# Rule: Any PR that breaks a Golden Flow MUST NOT be merged. New top-level
# user features MUST add a new Golden Flow test before shipping.
#
# See:
#   - backend/tests/e2e/test_golden_flows.py
#   - .claude/rules/case-convention.md (Endpoint Gate)
#   - .claude/rules/path-naming.md    (TR/EN drift)

name: Golden Flows

on:
  push:
    branches: [main, master, develop, feature/self-evolution-optimization]
  pull_request:
    branches: [main, master, develop, feature/self-evolution-optimization]
  workflow_dispatch:

concurrency:
  group: golden-flows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-flows:
    name: 8 Golden Flow E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15  # pgvector gerekli (baseline CREATE EXTENSION vector)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: kiro2
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5434/kiro2  # pragma: allowlist secret
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: test-jwt-secret-for-golden-flows-ci-not-for-production-use-only  # pragma: allowlist secret
      BACKEND_URL: http://127.0.0.1:8000
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # NOT (6 Eyl 2026): `pytest-asyncio` burada PINSIZ kuruluyordu ve
          # requirements.txt'teki pini SESSIZCE eziyordu -- workflow'lar
          # farkli surumlerle kosuyordu. Pin tek kaynaktan gelsin diye
          # buradan cikarildi (requirements.txt zaten kuruluyor).
          pip install httpx

      - name: AST lint — Pattern A/B dependency traps (HIGH only)
        working-directory: backend
        run: |
          # Session 137 Aşama 4 CI gate:
          # Block any PR that introduces a new Pattern A (sync get_db +
          # `await db.*` -> MissingGreenlet 500) or Pattern B
          # (`current_user.id` on a Pydantic TokenPayload -> AttributeError
          # 500) regression. MEDIUM type-lies are tracked as tech debt
          # and will be worked down incrementally.
          # See docs/audits/2026-04-10_db-dependency-baseline.md
          python scripts/audit_db_dependency.py --fail-on-high

      - name: AST lint — Missing-auth on write/compute endpoints
        working-directory: backend
        run: |
          # Session 138/139 CI gate:
          # Block any PR that introduces a new write/admin/compute endpoint
          # without an authentication dependency. Catches three classes of
          # silent regression:
          #   - Category A: write/admin endpoints exposed anonymously (IDOR,
          #     unauthorized DB mutations).
          #   - Category B1: LLM/TTS/YouTube cost-abuse vectors (Gemini,
          #     OpenAI, Claude, Qwen, gTTS, YouTube quota burn).
          #   - Category B2: compute/search endpoints that touch the 77K
          #     question bank or expensive NLP services anonymously.
          # Legitimately public endpoints are allow-listed in
          # PUBLIC_PATH_SUBSTRINGS at the top of the linter.
          python scripts/audit_missing_auth.py --fail-on-high

      - name: AST lint — Question dual-table trap
        working-directory: backend
        run: |
          # Session 139 CI gate:
          # Block any PR that imports the legacy `Question` symbol from
          # `models.content_db` / `models.database` into production code
          # paths (api/, services/, core/). The legacy `questions` table
          # holds ~36K partial rows; the production `question_bank` table
          # holds 77K. Querying the wrong one silently returns ~47% of
          # the catalog and causes the multi-session bug class documented
          # in testing.md lessons #23, #24, #26.
          # Re-export hubs (models/__init__.py, models/database.py) and
          # tests/scripts/alembic are allow-listed.
          python scripts/audit_dual_table_trap.py --fail-on-high

      - name: AST lint — Missing `is_active` filter on question read paths
        working-directory: backend
        run: |
          # Session 139 CI gate:
          # Block any PR that adds a public read-path handler querying
          # `QuestionBankItem` / `Question` without an `is_active` filter.
          # 13K+ inactive rows are soft-deleted in `question_bank` (Session
          # 78 cleanup, intentionally reversible) — leaking them back to
          # students breaks the production catalog invariant. testing.md
          # lesson #24. Admin/CRUD handlers (update/delete/history/version/
          # restore/audit/admin/bulk) are allow-listed by name and path.
          python scripts/audit_missing_is_active.py --fail-on-high

      - name: AST lint — Missing rate-limit on LLM/TTS/vision/search endpoints
        working-directory: backend
        run: |
          # Session 139 CI gate (fifth linter in the family):
          # Block any PR that adds a write/compute handler talking to an LLM,
          # TTS, embedding, or vision sentinel module (core.llm_*, services.llm.*,
          # openai, anthropic, google.generativeai, gtts, dashscope, litellm)
          # without a @rate_limit / @limiter.limit decorator. Auth alone
          # (Session 138/B1 gate) is not sufficient — an authenticated user
          # can still issue 1000 req/min and burn the Gemini/OpenAI/Claude/
          # gTTS quota. Status paths (/health, /info, /voices, /sessions,
          # /metrics, /llm-pool, /vector-store, /cache, /rag-pipeline, /stats)
          # are allow-listed.
          # Baseline: 0 HIGH after commit af74580 (sweep of 15 endpoints).
          python scripts/audit_missing_rate_limit.py --fail-on-high

      - name: AST lint — HTTPException propagation guards (rule-of-eight)
        working-directory: backend
        run: |
          # Session 146 CI gate (sixth linter in the family):
          # Block any PR that adds a bare `except Exception` handler that re-
          # wraps as HTTPException(500) without a preceding
          # `except HTTPException: raise` guard. This anti-pattern silently
          # promotes upstream 4xx/503 errors (from verify_student_access,
          # optional-dep guards, service-layer helpers) to generic 500
          # crashes. Confirmed 8+ times in Waves 1-10 (GF22/GF56/GF57/GF77/
          # GF81/GF82/GF85/GF88) before being eradicated by the Session 146
          # proactive sweep (446 guards inserted across 87 files).
          # Baseline: 0 risky blocks across backend/api/**/*.py.
          python scripts/audit_httpexception_guard.py --fail

      - name: "AST lint — Pydantic `user_id: int` type lie (rule-of-five)"
        working-directory: backend
        run: |
          # Session 148 CI gate (seventh linter in the family):
          # Block any PR that adds a Pydantic BaseModel under backend/api/
          # declaring `user_id: int`. KIRO2 auth returns AuthenticatedUser.id
          # as a UUID string, so `Model(user_id=current_user.id, ...)` inside
          # a handler raises pydantic.ValidationError — which bare `except
          # Exception` handlers re-wrap as HTTPException(500), hiding the
          # real cause. Confirmed 5 times across Waves 4/9/12 (GF20 x3 =
          # AdhdPomodoroSessionResponse + InactivityAlert + FocusExerciseProgress,
          # GF71 TaskResponse, GF107 VirtualBlockProgress + GeoGebraActivity +
          # GeometryToolUsage + TangramPuzzle).
          # Baseline: 0 risky Pydantic models under backend/api/**/*.py.
          python scripts/audit_pydantic_user_id.py --fail

      - name: Run migrations
        working-directory: backend
        run: |
          set +e
          alembic upgrade head > /tmp/alembic.log 2>&1
          rc=$?
          cat /tmp/alembic.log
          if [ "$rc" -ne 0 ]; then
            tail_msg=$(tail -12 /tmp/alembic.log | tr '\n\r\t' '   ' | sed 's/  */ /g')
            echo "::error title=alembic-hata::rc=$rc :: ${tail_msg: -700}"
            echo "::warning::alembic upgrade failed — continuing with raw schema"
          fi
          exit 0

      - name: Seed MVP users
        working-directory: backend
        run: |
          # `|| echo` KALDIRILDI (#462/B4-x). Seed cokerse HER test login'de
          # skip'e duser ve is YESIL biter — adim metni bunu aciklikla yaziyordu
          # ama sonuc yine geciyordu. Seed bu kapinin on kosulu, opsiyonu degil.
          python scripts/seed_mvp_data.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          # OLCUM (6 Eyl 2026): son 60 kosumun 19'u FAIL, 19/19'unun sebebi
          # tam olarak bu adim. Basarili kosumlarda backend 27-30s'de
          # kalkiyor (n=12, ort 28.4s, 12/12'si >=25s, ikisi tam 30s) --
          # yani eski 30s butcesi 0-3 saniyelik payla geciyordu. Backend
          # acilista HuggingFace BERT modelleri yukluyor, HF Hub gecikmesi
          # oynadikca pay eksiye dusuyor. Butce 120s'e cikarildi: dongu
          # saglikli kosumda yine ~28s'de exit 0 ile cikiyor, yani yesil
          # kosuma HIC ek maliyet yok; sadece yavas acilisa tahammul var.
          for i in {1..120}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not come up within 120s"
          tail -100 backend/backend.log || true
          exit 1

      - name: Router yukleme teshisi (annotation)
        run: |
          # Anonim teshis (28 Agu): yuklenemeyen router'lar backend.log'a
          # WARNING dusuyor ama log goruntulemek giris istiyor. Annotation'a
          # cikar ki '404 Not Found' sinifi hatalarin kaynagi (import cokmesi)
          # oturum acmadan gorulsun. Salt rapor — kapi karari degil.
          grep -E "Failed to import|Unexpected error loading" backend/backend.log \
            | head -15 \
            | while IFS= read -r satir; do
                temiz=$(printf '%s' "$satir" | tr -d '\r' | cut -c1-350)
                echo "::warning title=router-yuk::${temiz}"
              done || true
          if curl -sf http://127.0.0.1:8000/openapi.json | grep -q "veli-onay/verify"; then
            echo "::notice title=rota-veli-onay::verify rotasi openapi'de VAR"
          else
            echo "::warning title=rota-veli-onay::verify rotasi openapi'de YOK"
          fi

      - name: Run Golden Flow tests
        continue-on-error: true
        working-directory: backend
        run: |
          # `-x` KALDIRILDI (A.2): kapi artik `hata == 0` sartini KENDI olcuyor
          # (scripts/gf_esik_kapisi.py), dolayisiyla ilk hatada durmaya gerek yok.
          # `-x` ile rapor tek hatada kesiliyordu ve gercek tablo gorulmuyordu —
          # 1 Agu 2026 canli kosumu 12 ayri kirik akis oldugunu gosterdi (94 sn).
          # Adim `continue-on-error`: karar tek yerde, asagidaki kapida verilir.
          pytest tests/e2e/test_golden_flows.py -m golden_flow -v --tb=short \
            --junitxml=gf-results.xml

      - name: Enforce Golden Flow gate
        if: always()
        working-directory: backend
        run: |
          # Mantik ARTIK BURADA DEGIL — inline heredoc'un testi yoktu (A.2).
          # Sozlesme: tests/unit/test_gf_esik_kapisi.py (11 test, mutasyonla civili)
          # Kural: toplam >= 170 · hata == 0 · atlanan <= 5
          #
          # Anonim teshis (28 Agu 2026): adim log'lari GitHub'da giris istiyor;
          # annotation'lar istemiyor. Dusen/erroren testlerin ADI ve ilk mesaj
          # satiri annotation olarak yazilir ki kirik akis oturum acmadan da
          # gorulebilsin (alembic-hata deseninin devami). Kapi karari ASLA
          # burada verilmez — bu blok yalnizca raporlar, son soz asagidaki
          # gf_esik_kapisi.py'dedir.
          python - <<'PY'
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("gf-results.xml").getroot()
          except Exception as exc:  # noqa: BLE001 - rapor katmani, kapi degil
              print(f"::warning title=gf-annot::gf-results.xml okunamadi: {exc}")
              raise SystemExit(0)

          dusen = 0
          for tc in root.iter("testcase"):
              for kayit in list(tc.findall("failure")) + list(tc.findall("error")):
                  dusen += 1
                  mesaj = (kayit.get("message") or kayit.text or "").strip()
                  mesaj = " ".join(mesaj.split())[:220]
                  print(f"::error title=gf-dusen::{tc.get('name')} :: {mesaj}")
          print(f"::notice title=gf-dusen-ozet::dusen_test_sayisi={dusen}")
          PY
          python scripts/gf_esik_kapisi.py gf-results.xml

      - name: Backend log on failure
        if: failure()
        working-directory: backend
        run: tail -200 backend.log || true

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
