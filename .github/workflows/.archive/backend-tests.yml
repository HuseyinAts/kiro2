name: Backend Tests & Coverage
# Sprint 7: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual triggers

jobs:
  test:
    name: Test & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      # PostgreSQL for integration tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kiro2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for rate limiting and caching tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pytest-xdist

      - name: Create test environment file
        working-directory: backend
        run: |
          cat > .env.test << EOF
          TESTING=true
          DATABASE_URL=postgresql+asyncpg://postgres:test_password@localhost:5432/kiro2_test
          SYNC_DATABASE_URL=postgresql://postgres:test_password@localhost:5432/kiro2_test
          TEST_DATABASE_URL=postgresql+asyncpg://postgres:test_password@localhost:5432/kiro2_test
          SYNC_TEST_DATABASE_URL=postgresql://postgres:test_password@localhost:5432/kiro2_test
          REDIS_URL=redis://localhost:6379/0
          TEST_REDIS_URL=redis://localhost:6379/1
          JWT_SECRET_KEY=test-secret-key-for-ci-testing-only-32-chars
          SECRET_KEY=test-secret-key-for-ci-testing-only-32-chars
          ALLOWED_ORIGINS=["http://localhost:3000"]
          ANTHROPIC_API_KEY=test-key
          OPENAI_API_KEY=test-key
          EOF

      - name: Run unit tests
        working-directory: backend
        env:
          TESTING: true
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --maxfail=5 \
            --cov=core \
            --cov=api \
            --cov=services \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --junit-xml=junit-unit.xml \
            -n auto

      - name: Run integration tests
        working-directory: backend
        env:
          TESTING: true
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --maxfail=3 \
            --cov=core \
            --cov=api \
            --cov=services \
            --cov-append \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junit-xml=junit-integration.xml \
            -n auto

      - name: Generate combined coverage report
        working-directory: backend
        run: |
          coverage combine --append || true
          coverage report --precision=2
          coverage xml -o coverage-combined.xml
          coverage html -d htmlcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage-combined.xml,./backend/coverage-unit.xml,./backend/coverage-integration.xml
          flags: backend
          name: backend-coverage-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            backend/junit-*.xml
            backend/coverage*.xml
            backend/htmlcov/
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 60
          MINIMUM_ORANGE: 40

      - name: Check coverage threshold
        working-directory: backend
        run: |
          coverage report --fail-under=40 || (echo "Coverage is below 40%!" && exit 1)

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install black flake8 isort mypy

      - name: Check code formatting with Black
        working-directory: backend
        run: |
          black --check --diff .

      - name: Check import sorting with isort
        working-directory: backend
        run: |
          isort --check-only --diff .

      - name: Lint with flake8
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        working-directory: backend
        run: |
          bandit -r . -x ./tests,./venv -f json -o bandit-report.json || true
          bandit -r . -x ./tests,./venv

      - name: Check dependencies for vulnerabilities
        working-directory: backend
        run: |
          safety check --json || true
          safety check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: backend/bandit-report.json
          retention-days: 30
