name: Enhanced CI/CD Pipeline with Advanced Testing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean
      skip_fast_tests:
        description: 'Skip fast tests (for emergency deployments)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  CACHE_VERSION: v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-flight checks and setup
  setup:
    name: Setup and Pre-flight
    runs-on: ubuntu-latest
    outputs:
      python-cache-key: ${{ steps.cache-keys.outputs.python }}
      should-run-integration: ${{ steps.check.outputs.integration }}
      should-run-performance: ${{ steps.check.outputs.performance }}
      matrix-python: ${{ steps.matrix.outputs.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "python=${{ env.CACHE_VERSION }}-${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements*.txt', 'backend/pyproject.toml') }}" >> $GITHUB_OUTPUT

      - name: Determine test strategy
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "integration=true" >> $GITHUB_OUTPUT
            echo "performance=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "integration=true" >> $GITHUB_OUTPUT
            echo "performance=true" >> $GITHUB_OUTPUT
          else
            echo "integration=true" >> $GITHUB_OUTPUT
            echo "performance=${{ github.event.inputs.run_performance_tests || 'false' }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup test matrix
        id: matrix
        run: |
          echo 'python=["3.11", "3.12"]' >> $GITHUB_OUTPUT

  # Fast tests with our new comprehensive test suite
  fast-tests:
    name: Fast Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: setup
    if: github.event.inputs.skip_fast_tests != 'true'
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.matrix-python) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ needs.setup.outputs.python-cache-key }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-python-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio pytest-mock

      - name: Run fast tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: false
          TESTING: true
        run: |
          cd backend
          python -m pytest tests/fast/ \
            --cov=core \
            --cov-report=xml:coverage-fast-${{ matrix.python-version }}.xml \
            --cov-report=json:coverage-fast-${{ matrix.python-version }}.json \
            --cov-report=html:htmlcov-fast-${{ matrix.python-version }} \
            --cov-report=term-missing \
            --junitxml=pytest-fast-${{ matrix.python-version }}.xml \
            --tb=short \
            -v \
            -n auto \
            --timeout=120

      - name: Upload fast test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-results-${{ matrix.python-version }}
          path: |
            backend/coverage-fast-${{ matrix.python-version }}.xml
            backend/coverage-fast-${{ matrix.python-version }}.json
            backend/htmlcov-fast-${{ matrix.python-version }}/
            backend/pytest-fast-${{ matrix.python-version }}.xml

  # Enhanced code quality pipeline
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ needs.setup.outputs.python-cache-key }}

      - name: Install quality tools
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort mypy bandit safety pre-commit

      - name: Run pre-commit hooks
        run: |
          cd backend
          pre-commit install
          pre-commit run --all-files --show-diff-on-failure

      - name: Run Ruff linting
        run: |
          cd backend
          ruff check . --output-format=github --statistics

      - name: Check Black formatting
        run: |
          cd backend
          black --check --diff .

      - name: Check import sorting
        run: |
          cd backend
          isort --check-only --diff .

      - name: Type checking with MyPy
        run: |
          cd backend
          mypy . --ignore-missing-imports --explicit-package-bases || true

      - name: Security scan with Bandit
        run: |
          cd backend
          bandit -r . -f json -o bandit-report.json --exit-zero

      - name: Dependency vulnerability scan
        run: |
          cd backend
          safety check --json --output safety-report.json || true

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  # Integration tests with services
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [setup, fast-tests]
    if: needs.setup.outputs.should-run-integration == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.python-cache-key }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: false
          TESTING: true
        run: |
          cd backend
          python -m pytest tests/integration/ \
            --cov=. \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:htmlcov-integration \
            --junitxml=pytest-integration.xml \
            --tb=short \
            -v \
            --timeout=600

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            backend/coverage-integration.xml
            backend/htmlcov-integration/
            backend/pytest-integration.xml

  # Performance testing (optional)
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [setup, integration-tests]
    if: needs.setup.outputs.should-run-performance == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 30

      - name: Run performance tests
        run: |
          cd backend/tests/performance
          locust -f locustfile.py \
            --headless \
            --users 50 \
            --spawn-rate 5 \
            --run-time 300s \
            --host http://localhost:8000 \
            --html performance-report.html

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: backend/tests/performance/performance-report.html

      - name: Stop services
        if: always()
        run: docker-compose down

  # Comprehensive coverage reporting
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [fast-tests, integration-tests]
    if: always() && (needs.fast-tests.result == 'success' || needs.integration-tests.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*test-results*"
          merge-multiple: true
          path: ./test-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage tools
        run: |
          pip install coverage[toml] codecov

      - name: Combine coverage reports
        run: |
          # Combine all coverage files if multiple exist
          cd test-results
          if ls coverage-*.xml 1> /dev/null 2>&1; then
            # Upload the primary coverage file
            ls -la coverage-*.xml
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./test-results/coverage-fast-3.11.xml
          flags: comprehensive
          name: comprehensive-coverage
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './test-results';
            
            // Look for coverage JSON files
            const files = fs.readdirSync(path).filter(f => f.includes('coverage') && f.endsWith('.json'));
            
            let coverageInfo = '';
            if (files.length > 0) {
              try {
                const coverageData = JSON.parse(fs.readFileSync(`${path}/${files[0]}`, 'utf8'));
                const totalCoverage = coverageData.totals ? coverageData.totals.percent_covered : 'N/A';
                coverageInfo = `📊 **Test Coverage**: ${totalCoverage}%`;
              } catch (e) {
                coverageInfo = '📊 **Test Coverage**: Report generated (see artifacts)';
              }
            }
            
            const body = `## 🧪 Test Results Summary
            
            ### ✅ Fast Tests
            - All fast tests completed successfully
            - Core modules tested comprehensively
            
            ### 🔗 Integration Tests  
            - Database integration verified
            - Redis integration verified
            - API endpoints tested
            
            ${coverageInfo}
            
            ### 📈 Quality Metrics
            - ✅ Code formatting (Black + Ruff)
            - ✅ Import sorting (isort)  
            - ✅ Security scan (Bandit)
            - ✅ Dependency check (Safety)
            
            ### 📁 Artifacts Available
            - Coverage reports (HTML + XML)
            - Test result summaries
            - Quality analysis reports
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # Quality gate decision
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [fast-tests, code-quality, integration-tests]
    if: always()
    steps:
      - name: Check all results
        run: |
          echo "Fast tests: ${{ needs.fast-tests.result }}"
          echo "Code quality: ${{ needs.code-quality.result }}" 
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          
          # Quality gate logic
          if [[ "${{ needs.fast-tests.result }}" != "success" ]]; then
            echo "❌ Fast tests failed - blocking merge"
            exit 1
          fi
          
          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality checks failed - blocking merge"
            exit 1
          fi
          
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Integration tests failed - blocking merge"
            exit 1
          fi
          
          echo "✅ All quality gates passed!"

      - name: Update status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const description = status === 'success' 
              ? '✅ All quality gates passed' 
              : '❌ Quality gates failed';
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'Enhanced CI/CD Pipeline'
            });

  # Deployment readiness check
  deployment-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [quality-gate, coverage-report]
    if: needs.quality-gate.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deployment readiness
        run: |
          echo "🚀 All checks passed - ready for deployment!"
          echo "📋 Deployment checklist:"
          echo "✅ Fast tests passed"
          echo "✅ Integration tests passed"  
          echo "✅ Code quality verified"
          echo "✅ Security scans completed"
          echo "✅ Coverage reports generated"
          
      - name: Trigger deployment workflow
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'comprehensive-ci-cd.yml',
              ref: context.ref,
              inputs: {
                environment: 'staging',
                skip_tests: 'true'  // Tests already passed
              }
            });