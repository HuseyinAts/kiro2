name: Code Quality Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.6.1'

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install pytest-cov coverage[toml] codecov coveralls bandit safety pylint flake8 mypy

    - name: Lint with flake8
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --output-file=flake8-report.txt
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --append-output --output-file=flake8-report.txt

    - name: Security scan with bandit
      run: |
        cd backend
        bandit -r . -f json -o bandit-report.json --exit-zero
      continue-on-error: true

    - name: Code quality with pylint
      run: |
        cd backend
        pylint --output-format=text $(find . -name "*.py" | head -20) > pylint-report.txt || true
      continue-on-error: true

    - name: Type checking with mypy
      run: |
        cd backend
        mypy --ignore-missing-imports --follow-imports=skip . || true
      continue-on-error: true

    - name: Safety check
      run: |
        cd backend
        safety check --json --output safety-report.json || true
      continue-on-error: true

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: false
        TESTING: true
      run: |
        cd backend
        python -m pytest \
          --cov=. \
          --cov-report=xml:coverage.xml \
          --cov-report=json:coverage.json \
          --cov-report=html:htmlcov \
          --cov-report=term-missing \
          --junitxml=pytest-report.xml \
          --tb=short \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: backend/coverage.xml
        flags: backend
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: backend/coverage.xml
        flag-name: backend-python
        parallel: true
      continue-on-error: true

    - name: Coveralls finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true
      if: always()
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          backend/pytest-report.xml
          backend/coverage.xml
          backend/coverage.json
          backend/htmlcov/
          backend/flake8-report.txt
          backend/bandit-report.json
          backend/pylint-report.txt
          backend/safety-report.json

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download test artifacts
      uses: actions/download-artifact@v3
      with:
        name: test-results
        path: backend/
      continue-on-error: true

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.python.coverage.reportPaths=backend/coverage.xml
          -Dsonar.python.xunit.reportPath=backend/pytest-report.xml
          -Dsonar.python.flake8.reportPaths=backend/flake8-report.txt
          -Dsonar.python.bandit.reportPaths=backend/bandit-report.json
          -Dsonar.python.pylint.reportPaths=backend/pylint-report.txt

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [test, sonarcloud]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Tests failed!"
          exit 1
        fi
        echo "All quality checks passed!"

    - name: Post quality summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          
          const body = `## 🔍 Code Quality Analysis
          
          ### Test Results
          - ✅ Unit Tests: Passed
          - ✅ Coverage Check: Completed
          - ✅ Security Scan: Completed
          - ✅ Code Quality: Analyzed
          
          ### Coverage Reports
          - 📊 [Codecov Report](https://codecov.io/gh/${{ github.repository }})
          - 📈 [Coveralls Report](https://coveralls.io/github/${{ github.repository }})
          - 🔍 [SonarCloud Analysis](https://sonarcloud.io/project/overview?id=${{ secrets.SONAR_PROJECT_KEY }})
          
          ### Next Steps
          Review the detailed reports above for any recommendations.
          `;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });