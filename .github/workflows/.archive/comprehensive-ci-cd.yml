name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [development, staging, production]
      skip_tests:
        description: 'Skip tests (emergency deployment)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  KUBE_NAMESPACE: teknofest-egitim

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-flight checks
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      environment: ${{ steps.check.outputs.environment }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment strategy
        id: check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "environment=none" >> $GITHUB_OUTPUT
          fi
          
          # Generate version
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
          fi  # Code Q
uality and Security
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements*.txt', '.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8 mypy pylint bandit safety
          cd backend && pip install -r requirements.txt

      - name: Run pre-commit hooks
        run: |
          pre-commit install
          pre-commit run --all-files || true

      - name: Code formatting check
        run: |
          cd backend
          black --check --diff .
          isort --check-only --diff .

      - name: Linting
        run: |
          cd backend
          flake8 . --max-line-length=120 --ignore=E203,W503
          pylint **/*.py --fail-under=7.0 || true

      - name: Type checking
        run: |
          cd backend
          mypy . --ignore-missing-imports || true

      - name: Security scan
        run: |
          cd backend
          bandit -r . -ll -f json -o bandit-report.json || true
          safety check --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json  # Back
end Testing
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [preflight, quality-gate]
    if: github.event.inputs.skip_tests != 'true'
    strategy:
      matrix:
        test-type: [unit, integration, revolutionary]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-asyncio

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          USE_MOCK_RESPONSES: true
        run: |
          cd backend
          pytest tests/ -k "not integration and not revolutionary" \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            -n auto \
            --timeout=300 \
            -v

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          pytest tests/test_*integration*.py \
            --cov=. \
            --cov-report=xml \
            --timeout=600 \
            -v

      - name: Run revolutionary features tests
        if: matrix.test-type == 'revolutionary'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          pytest tests/test_revolutionary*.py \
            --cov=algorithms \
            --cov-report=xml \
            --timeout=900 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend-${{ matrix.test-type }}
          name: backend-${{ matrix.test-type }}-coverage
          token: ${{ secrets.CODECOV_TOKEN }}  # Fronte
nd Testing
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [preflight, quality-gate]
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Prettier check
        working-directory: ./frontend
        run: npm run format:check

      - name: Run TypeScript check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run unit tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false --testTimeout=30000

      - name: Run accessibility tests
        working-directory: ./frontend
        run: npm run test:a11y

      - name: Run revolutionary features tests
        working-directory: ./frontend
        run: npm test -- revolutionary-features.test.tsx --coverage --watchAll=false

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/  
# E2E Testing
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 30

      - name: Install Playwright
        run: |
          npm install -g @playwright/test
          playwright install --with-deps

      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            frontend/playwright-report/

      - name: Stop services
        if: always()
        run: docker-compose down

  # Performance Testing
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 30

      - name: Run performance tests
        run: |
          cd backend/tests/performance
          locust -f locustfile.py \
            --headless \
            --users 50 \
            --spawn-rate 5 \
            --run-time 300s \
            --host http://localhost:8000 \
            --html performance-report.html

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: backend/tests/performance/performance-report.html

      - name: Stop services
        if: always()
        run: docker-compose down  # 
Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Build Docker Images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [preflight, quality-gate]
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_PREFIX }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}  # De
ploy to Development
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [preflight, build-images]
    if: needs.preflight.outputs.should_deploy == 'true' && needs.preflight.outputs.environment == 'development'
    environment:
      name: development
      url: https://dev.teknofest-egitim.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: teknofest-dev
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          usedocker: true
          docker_heroku_process_type: web

      - name: Run smoke tests
        run: |
          sleep 60
          curl -f https://teknofest-dev.herokuapp.com/health || exit 1

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [preflight, build-images, backend-test, frontend-test]
    if: needs.preflight.outputs.should_deploy == 'true' && needs.preflight.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.teknofest-egitim.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name teknofest-cluster --region eu-west-1

      - name: Deploy to Kubernetes
        run: |
          # Update backend deployment
          kubectl set image deployment/teknofest-backend \
            teknofest-backend=${{ needs.build-images.outputs.backend-image }} \
            -n ${{ env.KUBE_NAMESPACE }}-staging
          
          # Update frontend deployment
          kubectl set image deployment/teknofest-frontend \
            teknofest-frontend=${{ needs.build-images.outputs.frontend-image }} \
            -n ${{ env.KUBE_NAMESPACE }}-staging
          
          # Wait for rollout
          kubectl rollout status deployment/teknofest-backend \
            -n ${{ env.KUBE_NAMESPACE }}-staging --timeout=600s
          kubectl rollout status deployment/teknofest-frontend \
            -n ${{ env.KUBE_NAMESPACE }}-staging --timeout=600s

      - name: Run database migrations
        run: |
          kubectl exec -it deployment/teknofest-backend \
            -n ${{ env.KUBE_NAMESPACE }}-staging \
            -- python -m alembic upgrade head

      - name: Run smoke tests
        run: |
          curl -f https://staging.teknofest-egitim.com/health || exit 1
          curl -f https://staging.teknofest-egitim.com/api/v1/health || exit 1  # D
eploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [preflight, build-images, e2e-test, security-scan]
    if: needs.preflight.outputs.should_deploy == 'true' && needs.preflight.outputs.environment == 'production'
    environment:
      name: production
      url: https://teknofest-egitim.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name teknofest-cluster --region eu-west-1

      - name: Blue-Green Deployment
        run: |
          # Create green deployment
          kubectl create deployment teknofest-backend-green \
            --image=${{ needs.build-images.outputs.backend-image }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create deployment teknofest-frontend-green \
            --image=${{ needs.build-images.outputs.frontend-image }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Wait for green deployments
          kubectl rollout status deployment/teknofest-backend-green \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=600s
          kubectl rollout status deployment/teknofest-frontend-green \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=600s
          
          # Run health checks on green
          kubectl exec deployment/teknofest-backend-green \
            -n ${{ env.KUBE_NAMESPACE }} \
            -- curl -f http://localhost:8000/health
          
          # Switch traffic to green
          kubectl patch service teknofest-backend \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"version":"green"}}}'
          
          kubectl patch service teknofest-frontend \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"version":"green"}}}'

      - name: Run production tests
        run: |
          sleep 60
          curl -f https://teknofest-egitim.com/health || exit 1
          curl -f https://teknofest-egitim.com/api/v1/health || exit 1

      - name: Cleanup old blue deployment
        if: success()
        run: |
          kubectl delete deployment teknofest-backend-blue \
            -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found=true
          kubectl delete deployment teknofest-frontend-blue \
            -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found=true
          
          # Rename green to blue for next deployment
          kubectl patch deployment teknofest-backend-green \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"metadata":{"name":"teknofest-backend-blue"}}'
          kubectl patch deployment teknofest-frontend-green \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"metadata":{"name":"teknofest-frontend-blue"}}'

      - name: Rollback on failure
        if: failure()
        run: |
          # Switch back to blue
          kubectl patch service teknofest-backend \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"version":"blue"}}}'
          kubectl patch service teknofest-frontend \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"version":"blue"}}}'
          
          # Delete failed green deployment
          kubectl delete deployment teknofest-backend-green \
            -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found=true
          kubectl delete deployment teknofest-frontend-green \
            -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found=true 
 # Post-deployment tasks
  post-deployment:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging, deploy-development]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-development.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Update deployment status
        run: |
          echo "Deployment completed successfully"
          echo "Environment: ${{ needs.preflight.outputs.environment }}"
          echo "Version: ${{ needs.preflight.outputs.version }}"

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 Deployment to ${{ needs.preflight.outputs.environment }} completed!
            Version: ${{ needs.preflight.outputs.version }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

      - name: Create GitHub Release
        if: needs.preflight.outputs.environment == 'production'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          release_name: Release v${{ needs.preflight.outputs.version }}
          body: |
            ## 🚀 Production Release v${{ needs.preflight.outputs.version }}
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Docker Images
            - Backend: `${{ needs.build-images.outputs.backend-image }}`
            - Frontend: `${{ needs.build-images.outputs.frontend-image }}`
            
            ### Deployment
            - Environment: Production
            - Deployed at: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Update monitoring dashboards
        run: |
          echo "Updating Grafana dashboards with new version"
          # Add monitoring update logic here

  # Cleanup
  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: [post-deployment]
    if: always()
    steps:
      - name: Clean old Docker images
        run: |
          echo "Cleaning old Docker images from registry"
          # Keep only last 10 versions
          # Add cleanup logic here

      - name: Clean old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            
            // Keep artifacts for 30 days
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            
            for (const artifact of artifacts.data.artifacts) {
              if (new Date(artifact.created_at) < thirtyDaysAgo) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }