name: CI/CD with Modern Tools

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  UV_SYSTEM_PYTHON: 1

jobs:
  # ==================== Python Linting & Formatting ====================
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip sync pyproject.toml
          uv pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          source .venv/bin/activate
          ruff check backend/ --output-format=github

      - name: Run Ruff Formatter Check
        run: |
          source .venv/bin/activate
          ruff format backend/ --check

      - name: Run MyPy Type Checking
        run: |
          source .venv/bin/activate
          mypy backend/ --config-file pyproject.toml --junit-xml mypy-report.xml
        continue-on-error: true

      - name: Upload MyPy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-results
          path: mypy-report.xml

  # ==================== Python Testing ====================
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-quality
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiro2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip sync pyproject.toml
          uv pip install -e ".[dev]"

      - name: Create test .env file
        run: |
          cat > backend/.env << EOF
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5434/kiro2_test
          DATABASE_URL_SYNC=postgresql://postgres:postgres@localhost:5434/kiro2_test
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET_KEY=test-secret-key
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
          ENVIRONMENT=test
          DEBUG=false
          EOF

      - name: Run database migrations
        run: |
          source .venv/bin/activate
          cd backend
          alembic upgrade head

      - name: Run Tests with Coverage
        run: |
          source .venv/bin/activate
          cd backend
          pytest \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junit-xml=pytest-report.xml \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            backend/pytest-report.xml
            backend/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ==================== Security Scanning ====================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: python-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install security tools
        run: |
          source .venv/bin/activate
          uv pip install bandit[toml] safety pip-audit

      - name: Run Bandit Security Scan
        run: |
          source .venv/bin/activate
          bandit -r backend/ -ll -x tests,alembic,migrations -f json -o bandit-report.json
        continue-on-error: true

      - name: Run Safety Check
        run: |
          source .venv/bin/activate
          safety check --json > safety-report.json
        continue-on-error: true

      - name: Run pip-audit
        run: |
          source .venv/bin/activate
          pip-audit --desc > pip-audit-report.txt
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.txt

  # ==================== Frontend Quality & Tests ====================
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier Check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,scss,json}"
        continue-on-error: true

      - name: TypeScript Type Check
        working-directory: frontend
        run: npm run type-check
        continue-on-error: true

      - name: Run Tests
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false
        continue-on-error: true

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  # ==================== Pre-commit Hooks ====================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

  # ==================== Build Docker Images ====================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [python-test, frontend-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: kiro2-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: kiro2-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Summary Report ====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-quality, python-test, security-scan, frontend-quality, pre-commit]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "## CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Quality | ${{ needs.python-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Quality | ${{ needs.frontend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-commit | ${{ needs.pre-commit.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.python-quality.result }}" != "success" ] || \
             [ "${{ needs.python-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Some checks failed. Please review the job logs.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All critical checks passed!**" >> $GITHUB_STEP_SUMMARY
          fi