name: Dependabot Auto-Merge

# S179 fix (B-P1-16): pre-fix Dependabot was configured but PRs piled
# up (171 Python + 54 npm outdated). This workflow auto-merges
# patch + minor PRs from Dependabot ONLY when tests pass, leaving
# major bumps for human review.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # continue-on-error: repo'nun "Allow GitHub Actions to create and
      # approve pull requests" ayari kapali (can_approve_pull_request_reviews:
      # false, `gh api repos/.../actions/permissions/workflow` ile dogrulandi,
      # 29 Agu 2026) -- bu, GITHUB_TOKEN'in PR onaylamasini SISTEM DUZEYINDE
      # engelleyen, workflow'un kendi `permissions:` bloğundan BAĞIMSIZ bir
      # repo guvenlik ayari, kod tarafindan degistirilemez/asilamaz. Bu adim
      # HER ZAMAN basarisiz olacak. master branch'inde branch protection YOK
      # (`gh api repos/.../branches/master/protection` -> 404), yani onaylanmis
      # bir review zaten MERGE icin sart degil -- sadece bu adimin kendi
      # basarisizligi, varsayilan step-bagimliligi yuzunden asagidaki gercek
      # merge adimini atlatiyordu. continue-on-error bu zinciri kirar; adim
      # gorunur sekilde kirmizi kalir (sorun gizlenmiyor), ama merge adimi
      # calismaya devam eder.
      - name: Auto-approve patch + minor PRs
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        continue-on-error: true
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor PRs
        if: |
          always() &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Major version bump — requires human review per .github/workflows/dependabot-auto-merge.yml."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
