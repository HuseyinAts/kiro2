name: Dependabot Auto-Merge

# S179 fix (B-P1-16): pre-fix Dependabot was configured but PRs piled
# up (171 Python + 54 npm outdated). This workflow auto-merges
# patch + minor PRs from Dependabot ONLY when tests pass, leaving
# major bumps for human review.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # continue-on-error: repo'nun "Allow GitHub Actions to create and
      # approve pull requests" ayari kapali (can_approve_pull_request_reviews:
      # false, `gh api repos/.../actions/permissions/workflow` ile dogrulandi,
      # 29 Agu 2026) -- bu, GITHUB_TOKEN'in PR onaylamasini SISTEM DUZEYINDE
      # engelleyen, workflow'un kendi `permissions:` bloğundan BAĞIMSIZ bir
      # repo guvenlik ayari, kod tarafindan degistirilemez/asilamaz. Bu adim
      # HER ZAMAN basarisiz olacak. master branch'inde branch protection YOK
      # (`gh api repos/.../branches/master/protection` -> 404), yani onaylanmis
      # bir review zaten MERGE icin sart degil -- sadece bu adimin kendi
      # basarisizligi, varsayilan step-bagimliligi yuzunden asagidaki gercek
      # merge adimini atlatiyordu. continue-on-error bu zinciri kirar; adim
      # gorunur sekilde kirmizi kalir (sorun gizlenmiyor), ama merge adimi
      # calismaya devam eder.
      - name: Auto-approve patch + minor PRs
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        continue-on-error: true
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor PRs
        if: |
          always() &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # S179 takip (2 Eylul 2026): steps.meta.outputs.update-type her zaman
      # 'semver-patch' | 'semver-minor' | 'semver-major' degil -- bazi
      # Dependabot GRUP guncellemelerinde, ozellikle guvenlik-tetiklemeli
      # gruplarda (kanit: PR #39 "python-security" grubu, bandit+safety,
      # calisan run log'unda outputs.update-type: null gorunuyor), bu deger
      # BOS/null donuyor. Eski kosul (yalnizca == 'semver-major') bu durumda
      # hic calismiyordu: PR ne auto-merge deneniyor ne de "inceleme gerekli"
      # yorumu aliyordu -- bu workflow'dan (dependabot-auto-merge.yml) hicbir
      # iz birakmadan sessizce acik kaliyordu (PR #39, 15 Haziran 2026'dan
      # beri bu workflow'dan tek bir yorum/aksiyon almadan boyle bekliyordu;
      # PR'da baska botlardan -- CI review, security scan -- yorumlar var,
      # ama dependabot-auto-merge.yml hicbir zaman devreye girmedi). Kosul
      # artik "patch/minor DEGILSE" (major + null +
      # beklenmeyen deger dahil) -- boylece her PR ya auto-merge deniyor ya
      # da bir yorum aliyor, hicbiri sessizce atlanmiyor.
      - name: Comment on major or unclassified bumps
        if: |
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor'
        run: |
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            BODY="Major version bump — requires human review per .github/workflows/dependabot-auto-merge.yml."
          else
            BODY="Auto-merge policy could not classify this update (fetch-metadata update-type: \`${UPDATE_TYPE:-<empty>}\`) — likely a Dependabot security/group update without a single semver bump. Requires human review per .github/workflows/dependabot-auto-merge.yml."
          fi
          gh pr comment "$PR_URL" --body "$BODY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
