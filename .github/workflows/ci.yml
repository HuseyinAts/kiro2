# KIRO2 CI Pipeline - Consolidated
# Spec: .kiro/specs/github-actions-cicd
# REQ-1: CI Workflow Setup, REQ-2: Test Automation, REQ-3: Code Quality, REQ-4: Build/Package

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  UV_SYSTEM_PYTHON: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== REQ-3: Code Quality ====================
  quality:
    name: Code Quality (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, mypy, bandit, safety, semgrep]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff-based lint: legacy debt grandfathered; only CHANGED backend/*.py
      # must pass. New code stays clean without blocking on 10K+ pre-existing.
      - name: Compute changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo "")
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No valid diff base — nothing to lint (grandfathered)."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- backend/ \
              | grep '\.py$' | tr '\n' ' ' || true)
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            echo "Changed backend Python files: ${FILES:-<none>}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          cd backend && uv pip install -r requirements.txt
          uv pip install ruff black mypy bandit safety types-redis types-passlib

      - name: Run Ruff Linter (changed files only)
        if: matrix.check == 'ruff'
        run: |
          source .venv/bin/activate
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No changed backend Python files — ruff skipped (grandfathered)."
            exit 0
          fi
          echo "Linting: $FILES"
          ruff check $FILES --output-format=github

      - name: Run MyPy Type Checking (changed files only)
        if: matrix.check == 'mypy'
        run: |
          source .venv/bin/activate
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No changed backend Python files — mypy skipped (grandfathered)."
            exit 0
          fi
          echo "Type-checking: $FILES"
          mypy $FILES --ignore-missing-imports --no-error-summary --no-strict-optional

      - name: Run Bandit Security Scan (changed files only)
        if: matrix.check == 'bandit'
        run: |
          source .venv/bin/activate
          FILES="${{ steps.changed.outputs.files }}"
          # Exclude tests/alembic from the changed set
          SCAN=$(echo "$FILES" | tr ' ' '\n' \
            | grep -vE '^backend/(tests|alembic)/' | tr '\n' ' ' || true)
          if [ -z "$SCAN" ]; then
            echo "No changed backend Python files to scan — bandit skipped."
            echo '{}' > bandit-report.json
            exit 0
          fi
          echo "Scanning: $SCAN"
          bandit -ll $SCAN -f json -o bandit-report.json

      - name: Run Safety Check
        if: matrix.check == 'safety'
        run: |
          source .venv/bin/activate
          cd backend && safety check -r requirements.txt --output json > ../safety-report.json || echo "::warning::Safety check found vulnerabilities"

      - name: Run Semgrep Security Scan
        if: matrix.check == 'semgrep'
        continue-on-error: true  # full-repo scan; pre-existing findings non-blocking
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/javascript
            p/typescript
            p/react
            p/owasp-top-ten
            p/sql-injection
            p/xss
          generateSarif: true
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/python
            p/owasp-top-ten

      - name: Upload Semgrep SARIF
        if: matrix.check == 'semgrep'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: Upload Security Reports
        if: matrix.check == 'bandit' || matrix.check == 'safety' || matrix.check == 'semgrep'
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.check }}-report
          path: |
            bandit-report.json
            safety-report.json
            semgrep.sarif
          if-no-files-found: ignore

  # ==================== REQ-2: Test Automation ====================
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiro2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
            .venv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          cd backend && uv pip install -r requirements.txt
          uv pip install pytest pytest-cov pytest-asyncio pytest-xdist httpx
          uv pip install pyyaml pillow tqdm numpy

      - name: Create test .env file
        run: |
          cat > backend/.env << EOF
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5434/kiro2_test
          DATABASE_URL_SYNC=postgresql://postgres:postgres@localhost:5434/kiro2_test
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET_KEY=test-secret-key-for-ci
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
          ENVIRONMENT=test
          DEBUG=false
          BILLING_WEBHOOK_SECRET=ci-test-billing-webhook-secret
          EOF

      - name: Run database migrations
        run: |
          source .venv/bin/activate
          cd backend && alembic upgrade head

      - name: Seed MVP users (P0 golden prerequisite)
        run: |
          source .venv/bin/activate
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5434/kiro2_test
          cd backend && python scripts/seed_mvp_data.py

      - name: Run Tests with Coverage
        run: |
          source .venv/bin/activate
          cd backend
          pytest tests/ \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=60 \
            --junit-xml=pytest-report.xml \
            -v \
            -x

      - name: P0 Golden Flow smoke (httpx, live backend)
        run: |
          source .venv/bin/activate
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn_p0_golden.log 2>&1 &
          echo $! > /tmp/uvicorn_p0_golden.pid
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:8000/health" > /dev/null; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "uvicorn failed to become healthy. Log:" >&2
              cat /tmp/uvicorn_p0_golden.log >&2
              exit 1
            fi
            sleep 1
          done
          export BACKEND_URL=http://127.0.0.1:8000
          python -m pytest \
            tests/e2e/test_golden_flows.py::test_gf1_login_and_me \
            tests/e2e/test_golden_flows.py::test_gf3_exam_configs_list \
            tests/e2e/test_golden_flows.py::test_gf3b_osym_subjects_reachable \
            tests/e2e/test_golden_flows.py::test_gf3c_exam_session_save_answer_smoke \
            tests/e2e/test_golden_flows.py::test_gf1x_logout_invalidates_bearer_token \
            tests/e2e/test_golden_flows.py::test_gf1y_profile_put_smoke \
            tests/e2e/test_golden_flows.py::test_gf1z_refresh_token_json_returns_usable_access \
            tests/e2e/test_golden_flows.py::test_gf3d_exam_session_complete_smoke \
            tests/e2e/test_golden_flows.py::test_gf6w_admin_question_create_returns_success \
            tests/e2e/test_golden_flows.py::test_gf1w_save_answer_updates_mastery \
            tests/e2e/test_golden_flows.py::test_gf3w_save_answer_rejects_empty_question_id \
            -v --tb=short
          kill $(cat /tmp/uvicorn_p0_golden.pid) 2>/dev/null || true
          wait $(cat /tmp/uvicorn_p0_golden.pid) 2>/dev/null || true

      - name: Run D-Dataset Unit Tests
        run: |
          source .venv/bin/activate
          cd d-dataset/scripts
          python -m unittest test_preprocess_and_normalization.py test_priority_loader.py -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            backend/pytest-report.xml
            backend/coverage.xml
            backend/htmlcov/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ==================== Frontend Tests ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: frontend
        run: npm run type-check

      - name: Run Tests with Coverage
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false --coverage.lines=70 --coverage.functions=70 --coverage.branches=70

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload Bundle Stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: frontend/dist/stats.html
          if-no-files-found: ignore

  # ==================== E2E Tests ====================
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiro2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create test .env file
        run: |
          cat > backend/.env << EOF
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5434/kiro2_test
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET_KEY=test-secret-key-for-ci
          ENVIRONMENT=test
          EOF

      - name: Start Backend server
        run: |
          cd backend
          alembic upgrade head
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          # Wait for backend
          for i in {1..30}; do
            curl -s http://localhost:8000/health && break
            sleep 2
          done

      - name: Build and serve Frontend
        working-directory: frontend
        run: |
          npm run build
          npx serve -s dist -l 3000 &
          sleep 5

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=html
        env:
          VITE_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

  # ==================== REQ-4: Build and Package ====================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python Wheel
        run: |
          pip install build
          cd backend && python -m build --wheel

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: backend/dist/*.whl

  # ==================== Summary Report ====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, backend-test, frontend-test]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for failures
          if [ "${{ needs.quality.result }}" == "failure" ] || \
             [ "${{ needs.backend-test.result }}" == "failure" ] || \
             [ "${{ needs.frontend-test.result }}" == "failure" ]; then
            echo "### Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the job logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### Status: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "All critical checks passed!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Track Duration
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
