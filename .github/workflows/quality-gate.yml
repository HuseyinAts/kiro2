name: Quality Gate (New-Endpoint Checklist)

# KIRO2 Task 8 — quality hardening CI gate.
# Runs on every PR and push to master/main. Catches the regression
# classes that previously slipped through (Session 84 IDOR, Session 112
# unregistered router, Session 148 middleware HTTPException, drift).
#
# Distinct from `quality-gates.yml` (the broader 5-gate score pipeline) —
# this workflow targets the *new-endpoint checklist* and four static-audit
# guards that already exist in `backend/scripts/`.

on:
  # Actions-minute reduction: PR yeterli (push'ta tekrar koşmaya gerek yok).
  # Tek hafif job (new-endpoint checklist) — değerli, PR'da kalır.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    # Postgres service for Step 4 below (ORM schema drift). Same image/
    # port/health-check as ci.yml's backend-test job: pgvector/pgvector:pg15,
    # NOT plain postgres:15 -- the baseline migration does
    # `CREATE EXTENSION vector` for embedding columns (models/*.py). Scoped
    # to this job only; Steps 1/2/3/5/6 below don't use it and are
    # unaffected. See docs/guvenlik-borcu.md SS10.41.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: kiro2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          # check_new_endpoints.py needs origin/master to diff against
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend requirements
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest pytest-asyncio httpx fastapi pydantic sqlalchemy

      - name: Install lint/type tools
        # .pre-commit-config.yaml ile ayni pin (ruff v0.7.1, mypy v1.11.2) --
        # docs/guvenlik-borcu.md SS10.42: pin'siz kurulum, CI'nin PyPI'daki
        # en yeni surumu cekmesine yol aciyordu (PR #166'da olculdu: 0.7.1
        # yerine 0.16.6), bu da yerelde gecen kodun CI'da yeni kural/isort
        # farkiyla kirmizi cikmasina neden oluyordu.
        run: pip install ruff==0.7.1 mypy==1.11.2

      # ---- Step 1: Router registration check -----------------------------
      # Catches Session 112 class bug (router file exists, not in
      # loader.py ROUTER_MAPPING → silent 404 for weeks).
      - name: Router registration check
        run: |
          cd backend
          pytest tests/test_router_registration.py -v --tb=short

      # ---- Step 2: Golden Flows smoke ------------------------------------
      # GF1-GF8 read-path + write-path GFs auto-skip when backend is
      # unreachable (built-in to the test module), so we don't need to
      # spin up docker-compose in CI. This catches the classes that the
      # 16-wave probe sweep eradicated (rule-of-eight, IDOR, schema drift).
      - name: Golden Flows smoke
        run: |
          cd backend
          pytest tests/e2e/test_golden_flows.py -m golden_flow -v --tb=short

      # ---- Step 3: Path drift audit --------------------------------------
      # .claude/rules/path-naming.md — TR/EN duplicate ban, frontend 404
      # risk. Report-only (no --fail): as of 2026-09-03 there are 30
      # pre-existing frontend-404-risk findings and 31 TR-only paths, none
      # introduced by any single PR -- gating on them would block unrelated
      # work the same way the old (always-red, see SS10.38) version did.
      # Read the printed report; fix drift incrementally.
      - name: Path drift audit
        run: python backend/scripts/audit_path_drift.py

      # ---- Step 3.5: migrate the Step-4 Postgres service ------------------
      # Only this step and Step 4 set DATABASE_URL*/talk to the service
      # above -- deliberately step-scoped, not job-level env, so Steps
      # 1/2/3/5/6 (which already run today with no DB configured at all)
      # stay exactly as they were. See docs/guvenlik-borcu.md SS10.41.
      - name: Run database migrations (schema-drift baseline)
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@localhost:5434/kiro2_test  # pragma: allowlist secret
        run: |
          cd backend
          alembic upgrade head

      # ---- Step 4: ORM schema drift --------------------------------------
      # 2026-09-04 (docs/guvenlik-borcu.md SS10.41): now backed by a real
      # Postgres service + migration (Step 3.5 above), and the script was
      # ported from psycopg2 to psycopg (v3) -- requirements.txt pins
      # psycopg[binary], not psycopg2, so a plain
      # `pip install -r requirements.txt` (this job's "Install backend
      # requirements" step) never provided psycopg2, meaning this step
      # always hit the driver-missing skip path regardless of whether a DB
      # was reachable. First real measurement against a freshly-migrated
      # DB: HIGH=8, MEDIUM=516, LOW=44 (see SS10.41 for the HIGH detail --
      # all 8 are pre-existing `sessions`/`study_sessions` schema drift,
      # not introduced by this change).
      #
      # Deliberately NOT run with --fail yet, same rationale as Step 3's
      # report-only precedent above: this is the first time the comparison
      # has ever actually executed against a real DB, the baseline is
      # unmeasured until now, and gating on it immediately would block
      # unrelated PRs over debt they didn't introduce. --json persists the
      # full findings as a build artifact so the baseline isn't lost to
      # log scrollback; --skip-if-unreachable stays as a defensive
      # fallback for the service failing to come up, not for a missing
      # driver anymore.
      - name: ORM schema drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/kiro2_test  # pragma: allowlist secret
        run: python backend/scripts/audit_orm_schema_drift.py --skip-if-unreachable --severity LOW --json backend/schema_drift_findings.json

      - name: Upload schema drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-findings
          path: backend/schema_drift_findings.json
          if-no-files-found: ignore

      # ---- Step 5: New-endpoint checklist --------------------------------
      # Custom checklist for PR-added @router.{get,post,...} decorators.
      # HARD violations (auth, IDOR, /api/v1 prefix) → exit 1.
      # SOFT violations (response_model, loader, tests) → warning only.
      - name: New-endpoint checklist
        run: python .github/scripts/check_new_endpoints.py
        env:
          # check script diffs against this ref; override for forks
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}

      # ---- Step 6: Ruff + mypy (backend) ---------------------------------
      # 2026-09-03: whole-tree `ruff check .` never actually ran in CI --
      # steps 3/4 above always hard-failed first (SS10.38), so this was
      # never reached. Measured directly: 2051 pre-existing errors across
      # backend/ (clean-room venv, same ruff version). That's legacy debt,
      # not something one PR introduced -- scope to files the PR actually
      # changed (same origin/BASE_REF diff step 5 already uses) so new code
      # is held to the standard without gating on the existing backlog.
      - name: Ruff lint (changed files)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          cd backend
          CHANGED=$(git diff "origin/${BASE_REF}...HEAD" --name-only --diff-filter=AM -- '*.py' | sed -n 's|^backend/||p')
          if [ -z "$CHANGED" ]; then
            echo "No changed backend/*.py files vs origin/${BASE_REF}. Skipping ruff."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs ruff check --select=E,F,W --ignore=E501

      - name: Mypy type check
        run: |
          cd backend
          mypy . --ignore-missing-imports --no-strict-optional || true
          # mypy soft-fail until strict-mode rollout (CLAUDE.md target)
