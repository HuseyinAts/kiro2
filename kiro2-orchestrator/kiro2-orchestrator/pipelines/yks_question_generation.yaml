# ============================================================================
# YKS QUESTION GENERATION PIPELINE
# ============================================================================
pipeline:
  name: "yks_question_generation"
  description: "YKS/TYT/AYT soru üretim pipeline'ı"
  version: "1.0.0"

trigger:
  keywords:
    - "soru üret"
    - "question generate"
    - "yks soru"
    - "tyt soru"
    - "ayt soru"

steps:
  - name: "curriculum_analysis"
    agent: "content_agent"
    model: "claude-opus-4"
    description: "Müfredat analizi ve konu belirleme"
    timeout_seconds: 60
    
  - name: "question_generation"
    agent: "content_agent"
    model: "claude-opus-4"
    description: "Soru üretimi"
    timeout_seconds: 120
    depends_on: ["curriculum_analysis"]
    
  - name: "quality_check"
    agent: "quality_agent"
    model: "claude-opus-4"
    description: "Kalite kontrolü"
    timeout_seconds: 60
    depends_on: ["question_generation"]
    
  - name: "database_save"
    agent: "data_agent"
    model: "codex"
    description: "Veritabanına kayıt"
    timeout_seconds: 30
    depends_on: ["quality_check"]
    
  - name: "cache_update"
    agent: "data_agent"
    model: "codex"
    description: "Redis cache güncelleme"
    timeout_seconds: 15
    depends_on: ["database_save"]

error_handling:
  retry_count: 2
  on_failure: "rollback"
