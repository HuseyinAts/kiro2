# ============================================================================
# FEATURE DEVELOPMENT PIPELINE
# ============================================================================
pipeline:
  name: "feature_development"
  description: "Yeni özellik geliştirme pipeline'ı"

trigger:
  keywords:
    - "yeni özellik"
    - "feature ekle"
    - "yeni modül"

steps:
  - name: "requirements_analysis"
    agent: "content_agent"
    model: "claude-opus-4"
    timeout_seconds: 60
    
  - name: "api_development"
    agent: "api_agent"
    model: "codex"
    depends_on: ["requirements_analysis"]
    timeout_seconds: 180
    
  - name: "database_schema"
    agent: "data_agent"
    model: "claude-opus-4"
    depends_on: ["requirements_analysis"]
    timeout_seconds: 90
    
  - name: "ui_components"
    agent: "ui_agent"
    model: "codex"
    depends_on: ["api_development"]
    timeout_seconds: 180
    
  - name: "testing"
    agent: "quality_agent"
    model: "codex"
    depends_on: ["api_development", "ui_components"]
    timeout_seconds: 120

error_handling:
  retry_count: 1
  on_failure: "continue_with_warning"
