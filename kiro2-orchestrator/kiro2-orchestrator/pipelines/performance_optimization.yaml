# ============================================================================
# PERFORMANCE OPTIMIZATION PIPELINE
# ============================================================================
pipeline:
  name: "performance_optimization"
  description: "Performans optimizasyonu pipeline'ı"

trigger:
  keywords:
    - "performance"
    - "optimize"
    - "yavaş"
    - "bottleneck"

steps:
  - name: "profiling"
    agent: "quality_agent"
    model: "claude-sonnet-4"
    timeout_seconds: 90
    
  - name: "database_optimization"
    agent: "data_agent"
    model: "claude-opus-4"
    depends_on: ["profiling"]
    timeout_seconds: 120
    
  - name: "api_optimization"
    agent: "api_agent"
    model: "claude-sonnet-4"
    depends_on: ["profiling"]
    timeout_seconds: 120
    
  - name: "cache_strategy"
    agent: "data_agent"
    model: "codex"
    depends_on: ["database_optimization"]
    timeout_seconds: 60
    
  - name: "benchmark"
    agent: "quality_agent"
    model: "codex"
    depends_on: ["api_optimization", "cache_strategy"]
    timeout_seconds: 60

error_handling:
  retry_count: 1
  on_failure: "continue_with_warning"
