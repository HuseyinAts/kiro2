# ============================================================================
# KIRO2 CLAUDE FLOW ORCHESTRATOR - ANA KONFİGÜRASYON
# ============================================================================
# Versiyon: 1.0.0
# Tarih: Ocak 2026
# Proje: KIRO2 EdTech Platform (YKS/TYT/AYT Sınav Hazırlık)
# ============================================================================

system:
  name: "KIRO2 Orchestrator"
  version: "1.0.0"
  description: "Multi-agent orchestration for KIRO2 EdTech platform"
  project_root: "/mnt/c/Users/husey/kiro2"
  log_level: "INFO"
  log_dir: "~/.kiro2-orchestrator/logs"
  history_file: "~/.kiro2-orchestrator/history.json"

# ============================================================================
# MODEL KONFİGÜRASYONU
# ============================================================================
models:
  claude_opus:
    provider: "anthropic"
    model_id: "claude-opus-4"
    max_tokens: 8192
    temperature: 0.7
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    use_cases:
      - "turkish_nlp"
      - "complex_reasoning"
      - "security_audit"
      - "schema_design"
  
  claude_sonnet:
    provider: "anthropic"
    model_id: "claude-sonnet-4"
    max_tokens: 8192
    temperature: 0.7
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    use_cases:
      - "code_review"
      - "complex_api"
      - "migration_execution"
  
  codex:
    provider: "openai"
    model_id: "gpt-5.1-codex-max"
    max_tokens: 16384
    temperature: 0.3
    cost_per_1k_input: 0.001
    cost_per_1k_output: 0.002
    use_cases:
      - "fast_generation"
      - "ui_components"
      - "test_generation"
      - "boilerplate"

# ============================================================================
# AGENT TANIMI - REFERANSLAR
# ============================================================================
agents:
  - name: "content_agent"
    config_file: "../agents/content_agent.yaml"
    enabled: true
    priority: 1  # En yüksek öncelik - Core feature
  
  - name: "api_agent"
    config_file: "../agents/api_agent.yaml"
    enabled: true
    priority: 2
  
  - name: "data_agent"
    config_file: "../agents/data_agent.yaml"
    enabled: true
    priority: 3
  
  - name: "ui_agent"
    config_file: "../agents/ui_agent.yaml"
    enabled: true
    priority: 4
  
  - name: "quality_agent"
    config_file: "../agents/quality_agent.yaml"
    enabled: true
    priority: 5

# ============================================================================
# PIPELINE TANIMI - REFERANSLAR
# ============================================================================
pipelines:
  - name: "yks_question_generation"
    config_file: "../pipelines/yks_question_generation.yaml"
    enabled: true
    trigger_keywords:
      - "soru üret"
      - "question generate"
      - "yks soru"
      - "tyt soru"
      - "ayt soru"
  
  - name: "feature_development"
    config_file: "../pipelines/feature_development.yaml"
    enabled: true
    trigger_keywords:
      - "yeni özellik"
      - "feature ekle"
      - "yeni modül"
      - "implement feature"
  
  - name: "bug_fix"
    config_file: "../pipelines/bug_fix.yaml"
    enabled: true
    trigger_keywords:
      - "bug fix"
      - "hata düzelt"
      - "fix error"
      - "debug"
  
  - name: "performance_optimization"
    config_file: "../pipelines/performance_optimization.yaml"
    enabled: true
    trigger_keywords:
      - "performance"
      - "optimize"
      - "hızlandır"
      - "yavaş"
      - "bottleneck"

# ============================================================================
# SMART ROUTER KONFİGÜRASYONU
# ============================================================================
router:
  # Önce pipeline trigger kontrolü, sonra keyword-based agent routing
  strategy: "pipeline_first"
  
  # Keyword-based routing kuralları (pipeline match yoksa)
  keyword_routing:
    content_agent:
      keywords:
        - "soru"
        - "türkçe"
        - "turkish"
        - "nlp"
        - "qwen"
        - "sentiment"
        - "embedding"
        - "duygu"
        - "metin"
        - "yks"
        - "tyt"
        - "ayt"
        - "müfredat"
        - "konu anlatımı"
        - "zorluk"
        - "difficulty"
      weight: 1.0  # Highest priority for Turkish NLP
    
    api_agent:
      keywords:
        - "endpoint"
        - "api"
        - "route"
        - "fastapi"
        - "request"
        - "response"
        - "authentication"
        - "auth"
        - "jwt"
        - "swagger"
        - "openapi"
        - "middleware"
        - "rate limit"
      weight: 0.9
    
    data_agent:
      keywords:
        - "database"
        - "postgresql"
        - "postgres"
        - "sql"
        - "query"
        - "migration"
        - "schema"
        - "table"
        - "index"
        - "redis"
        - "cache"
        - "connection pool"
        - "memory leak"
      weight: 0.9
    
    ui_agent:
      keywords:
        - "react"
        - "component"
        - "jsx"
        - "tsx"
        - "frontend"
        - "ui"
        - "css"
        - "tailwind"
        - "styled"
        - "dashboard"
        - "form"
        - "button"
        - "responsive"
        - "mobile"
      weight: 0.8
    
    quality_agent:
      keywords:
        - "test"
        - "coverage"
        - "pytest"
        - "jest"
        - "security"
        - "vulnerability"
        - "audit"
        - "idor"
        - "xss"
        - "injection"
        - "review"
        - "quality"
        - "kvkk"
        - "gdpr"
        - "compliance"
      weight: 0.7
  
  # Complexity scoring thresholds
  complexity:
    simple:
      max_files: 1
      max_lines: 100
      model_preference: "codex"
    medium:
      max_files: 3
      max_lines: 300
      model_preference: "claude_sonnet"
    complex:
      max_files: 999
      max_lines: 999
      model_preference: "claude_opus"
  
  # Fallback chain
  fallback_chain:
    - "codex"
    - "claude_sonnet"
    - "claude_opus"

# ============================================================================
# CONTEXT MANAGER KONFİGÜRASYONU
# ============================================================================
context_manager:
  # Shared memory için RAG ayarları
  rag:
    enabled: true
    embedding_model: "text-embedding-3-small"
    vector_store: "local"  # local, pinecone, weaviate
    chunk_size: 1000
    chunk_overlap: 200
  
  # CLAUDE.md injection
  project_context:
    enabled: true
    file: "/mnt/c/Users/husey/kiro2/CLAUDE.md"
    inject_on_every_task: true
  
  # Execution history
  history:
    enabled: true
    max_entries: 1000
    persist: true
  
  # Inter-agent communication
  message_bus:
    enabled: true
    type: "in_memory"  # in_memory, redis, rabbitmq

# ============================================================================
# MCP ENTEGRASYONU
# ============================================================================
mcp:
  config_file: "~/.claude/claude_desktop_config.json"
  
  # Agent-specific MCP distribution
  distribution:
    content_agent:
      - "memory"
      - "filesystem"
    
    api_agent:
      - "filesystem"
    
    data_agent:
      - "postgresql"
      - "memory"
      - "filesystem"
    
    ui_agent:
      - "filesystem"
    
    quality_agent:
      - "filesystem"
      - "postgresql"
      - "memory"

# ============================================================================
# EXECUTION INFRASTRUCTURE
# ============================================================================
execution:
  # Claude Code ayarları
  claude_code:
    command: "claude"
    default_args:
      - "-p"
    timeout_seconds: 300
    max_retries: 2
  
  # Codex CLI ayarları
  codex_cli:
    command: "codex"
    wrapper_script: "../wrappers/codex-wrapper.sh"
    default_args:
      - "exec"
    timeout_seconds: 300
    max_retries: 2
    sandbox_mode: "workspace-write"
    reasoning_effort: "medium"

# ============================================================================
# MALİYET TAKİBİ
# ============================================================================
cost_tracking:
  enabled: true
  currency: "USD"
  monthly_budget: 100.0  # Alert threshold
  alert_at_percentage: 80
  
  # Task-level cost estimation
  estimates:
    content_agent_task: 0.40
    api_agent_task: 0.08
    data_agent_task: 0.25
    ui_agent_task: 0.06
    quality_agent_task: 0.15

# ============================================================================
# LOGGING VE MONITORING
# ============================================================================
logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: "file"
      path: "~/.kiro2-orchestrator/logs/orchestrator.log"
      max_size_mb: 10
      backup_count: 5
    - type: "console"
      level: "INFO"
  
  # Task-level logging
  task_logging:
    enabled: true
    include_prompts: false  # Privacy
    include_responses: false
    include_metrics: true

monitoring:
  enabled: true
  metrics:
    - "task_count"
    - "task_duration"
    - "agent_usage"
    - "model_usage"
    - "cost_per_task"
    - "success_rate"
    - "error_rate"
