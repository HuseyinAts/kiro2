# ============================================================================
# CONTENT AGENT - KIRO2 İÇERİK UZMANI
# ============================================================================
# Bu agent KIRO2'nin kalbidir. YKS/TYT/AYT soru üretimi ve Turkish NLP
# işlemlerinden sorumludur. Her zaman Claude Opus kullanır - compromise yok.
# ============================================================================

agent:
  name: "content_agent"
  display_name: "KIRO2 Content Specialist"
  description: |
    YKS/TYT/AYT sınav soruları üretimi, Türkçe metin işleme ve NLP görevleri
    için uzmanlaşmış agent. Qwen3-8B entegrasyonu ile çalışır.
  
  # Avatar/Icon (UI için)
  icon: "📚"
  color: "#8B5CF6"  # Purple

# ============================================================================
# MODEL KONFİGÜRASYONU
# ============================================================================
model:
  primary: "claude-opus-4"
  fallback: "claude-sonnet-4"  # Sadece Opus unavailable ise
  
  # BU AGENT İÇİN CODEX ASLA KULLANILMAZ
  # Turkish NLP için Claude'un dil anlama yeteneği kritik
  never_use:
    - "codex"
    - "gpt-4"
    - "gpt-3.5"
  
  # Model parameters
  parameters:
    temperature: 0.7
    max_tokens: 8192
    top_p: 0.95

# ============================================================================
# SORUMLULUK ALANLARI
# ============================================================================
responsibilities:
  primary:
    - name: "yks_question_generation"
      description: "YKS/TYT/AYT formatında soru üretimi"
      model_override: "claude-opus-4"
      priority: "critical"
    
    - name: "tyt_ayt_content_creation"
      description: "TYT ve AYT müfredatına uygun içerik oluşturma"
      model_override: "claude-opus-4"
      priority: "critical"
    
    - name: "turkish_text_processing"
      description: "Türkçe metin analizi, düzeltme, sadeleştirme"
      model_override: "claude-opus-4"
      priority: "high"
    
    - name: "qwen3_integration"
      description: "Qwen3-8B modeli ile koordineli çalışma"
      model_override: "claude-opus-4"
      priority: "high"
  
  secondary:
    - name: "difficulty_calibration"
      description: "Soru zorluk seviyesi belirleme ve kalibrasyon"
      model_override: "claude-opus-4"
      priority: "medium"
    
    - name: "curriculum_alignment"
      description: "MEB müfredatı ile içerik uyumu kontrolü"
      model_override: "claude-opus-4"
      priority: "medium"
    
    - name: "sentiment_analysis"
      description: "Türkçe duygu analizi"
      model_override: "claude-opus-4"
      priority: "low"
    
    - name: "text_embedding"
      description: "Türkçe metin vektörleme"
      model_override: "claude-opus-4"
      priority: "low"

# ============================================================================
# ROUTING KURALLARI
# ============================================================================
routing:
  # Bu keyword'ler görüldüğünde bu agent aktif olur
  trigger_keywords:
    high_confidence:
      - "soru üret"
      - "question generate"
      - "yks soru"
      - "tyt soru"
      - "ayt soru"
      - "türkçe nlp"
      - "turkish nlp"
      - "qwen"
      - "konu anlatımı"
    
    medium_confidence:
      - "türkçe"
      - "turkish"
      - "metin"
      - "text"
      - "sentiment"
      - "duygu"
      - "embedding"
      - "müfredat"
      - "curriculum"
    
    low_confidence:
      - "içerik"
      - "content"
      - "zorluk"
      - "difficulty"
  
  # Diğer agent'lara devretme kuralları
  handoff_rules:
    - condition: "task contains 'database' or 'save to db'"
      handoff_to: "data_agent"
      handoff_type: "after_completion"  # İş bittikten sonra
    
    - condition: "task contains 'frontend' or 'preview'"
      handoff_to: "ui_agent"
      handoff_type: "after_completion"

# ============================================================================
# ARAÇLAR VE ENTEGRASYONLAR
# ============================================================================
tools:
  internal:
    - name: "qwen3_8b_api"
      description: "Qwen3-8B fine-tuned model API"
      endpoint: "http://localhost:8001/v1/generate"
      enabled: true
    
    - name: "turkish_embedding_service"
      description: "Türkçe metin embedding servisi"
      endpoint: "http://localhost:8002/embed"
      enabled: true
  
  external:
    - name: "zemberek_morphology"
      description: "Zemberek Türkçe morfoloji analizi"
      type: "library"
      enabled: true
    
    - name: "hunspell_turkish"
      description: "Türkçe yazım denetimi"
      type: "library"
      enabled: true

  mcp:
    - "memory"      # Önceki sorular ve context
    - "filesystem"  # Müfredat dosyaları

# ============================================================================
# SORU ÜRETİMİ ŞABLONLARI
# ============================================================================
question_templates:
  tyt:
    turkce:
      types: ["paragraf", "anlam", "dil_bilgisi", "sözcük"]
      difficulty_levels: [1, 2, 3, 4, 5]
      time_per_question: 90  # saniye
    
    matematik:
      types: ["temel_kavram", "problem", "grafik", "tablo"]
      difficulty_levels: [1, 2, 3, 4, 5]
      time_per_question: 120
    
    fen:
      types: ["fizik", "kimya", "biyoloji"]
      difficulty_levels: [1, 2, 3, 4, 5]
      time_per_question: 90
    
    sosyal:
      types: ["tarih", "coğrafya", "felsefe", "din"]
      difficulty_levels: [1, 2, 3, 4, 5]
      time_per_question: 75
  
  ayt:
    matematik:
      types: ["limit", "türev", "integral", "analitik", "sayılar"]
      difficulty_levels: [3, 4, 5, 6, 7]  # Daha zor
      time_per_question: 180
    
    fizik:
      types: ["mekanik", "elektrik", "optik", "modern"]
      difficulty_levels: [3, 4, 5, 6, 7]
      time_per_question: 180
    
    kimya:
      types: ["organik", "anorganik", "fiziksel", "analitik"]
      difficulty_levels: [3, 4, 5, 6, 7]
      time_per_question: 150
    
    biyoloji:
      types: ["hücre", "genetik", "ekoloji", "fizyoloji"]
      difficulty_levels: [3, 4, 5, 6, 7]
      time_per_question: 120

# ============================================================================
# KALİTE KONTROL KURALLARI
# ============================================================================
quality_rules:
  question_validation:
    - rule: "Soru metni en az 20 karakter olmalı"
      severity: "error"
    
    - rule: "Şık sayısı 5 olmalı (A, B, C, D, E)"
      severity: "error"
    
    - rule: "Doğru cevap işaretli olmalı"
      severity: "error"
    
    - rule: "Şıklar birbirinden farklı olmalı"
      severity: "error"
    
    - rule: "Türkçe karakter encoding UTF-8 olmalı"
      severity: "error"
    
    - rule: "Soru MEB müfredatına uygun olmalı"
      severity: "warning"
    
    - rule: "Zorluk seviyesi belirtilmeli"
      severity: "warning"
  
  content_validation:
    - rule: "Hakaret veya uygunsuz içerik olmamalı"
      severity: "error"
    
    - rule: "Siyasi veya dini propaganda olmamalı"
      severity: "error"
    
    - rule: "Telif hakkı ihlali olmamalı"
      severity: "error"

# ============================================================================
# PROMPT TEMPLATES
# ============================================================================
prompts:
  question_generation: |
    Sen KIRO2 platformu için YKS/TYT/AYT sınav soruları üreten bir uzmansın.
    
    GÖREV: {task_description}
    
    KONU: {topic}
    SINAV TÜRÜ: {exam_type}
    ZORLUK SEVİYESİ: {difficulty} (1-7 arası, 1 en kolay)
    SORU SAYISI: {count}
    
    KURALLAR:
    1. Her soru Türkçe ve MEB müfredatına uygun olmalı
    2. 5 şık olmalı (A, B, C, D, E)
    3. Doğru cevap açıkça belirtilmeli
    4. Her sorunun çözüm açıklaması olmalı
    5. Sorular özgün olmalı, kopyala-yapıştır yasak
    
    FORMAT:
    ```json
    {
      "questions": [
        {
          "id": "unique_id",
          "text": "Soru metni",
          "options": {
            "A": "Şık A",
            "B": "Şık B",
            "C": "Şık C",
            "D": "Şık D",
            "E": "Şık E"
          },
          "correct_answer": "A",
          "explanation": "Çözüm açıklaması",
          "difficulty": 3,
          "topic": "Konu adı",
          "subtopic": "Alt konu",
          "exam_type": "TYT/AYT"
        }
      ]
    }
    ```
  
  content_review: |
    Aşağıdaki YKS/TYT/AYT sorusunu incele ve kalite kontrolü yap.
    
    SORU:
    {question_text}
    
    KONTROL KRİTERLERİ:
    1. Türkçe dil bilgisi doğru mu?
    2. Soru mantıklı ve anlaşılır mı?
    3. Şıklar makul ve ayırt edici mi?
    4. Zorluk seviyesi uygun mu?
    5. MEB müfredatına uygun mu?
    
    ÇIKTI FORMAT:
    ```json
    {
      "approved": true/false,
      "score": 0-100,
      "issues": ["varsa sorunlar"],
      "suggestions": ["iyileştirme önerileri"]
    }
    ```

# ============================================================================
# PERFORMANS METRİKLERİ
# ============================================================================
metrics:
  track:
    - "questions_generated"
    - "questions_approved"
    - "questions_rejected"
    - "average_quality_score"
    - "generation_time"
    - "cost_per_question"
  
  targets:
    approval_rate: 0.85  # %85
    average_quality_score: 80
    generation_time_seconds: 30
    cost_per_question: 0.05
