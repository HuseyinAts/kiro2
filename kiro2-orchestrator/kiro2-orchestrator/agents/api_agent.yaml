# ============================================================================
# API AGENT - KIRO2 BACKEND UZMANI
# ============================================================================
agent:
  name: "api_agent"
  display_name: "KIRO2 API Specialist"
  description: "FastAPI backend, REST endpoints, authentication"
  icon: "🔌"
  color: "#10B981"

model:
  primary: "codex"
  escalate_to: "claude-sonnet-4"
  escalation_triggers:
    - "complex auth flow"
    - "security critical"
    - "rate limiting design"

responsibilities:
  primary:
    - name: "fastapi_endpoints"
      description: "REST API endpoint geliştirme"
      model_override: "codex"
    - name: "authentication"
      description: "JWT, OAuth2 implementasyonu"
      model_override: "claude-sonnet-4"
    - name: "middleware"
      description: "Request/response middleware"
      model_override: "codex"
    - name: "openapi_docs"
      description: "Swagger/OpenAPI dokümantasyonu"
      model_override: "codex"

routing:
  trigger_keywords:
    high_confidence:
      - "endpoint"
      - "api"
      - "fastapi"
      - "route"
      - "jwt"
      - "auth"
    medium_confidence:
      - "request"
      - "response"
      - "middleware"
      - "swagger"

tools:
  mcp:
    - "filesystem"

prompts:
  endpoint_creation: |
    FastAPI endpoint oluştur.
    PROJE: KIRO2 EdTech Platform
    GÖREV: {task_description}
    
    KURALLAR:
    - Pydantic model kullan
    - Proper HTTP status codes
    - Error handling
    - Type hints zorunlu
