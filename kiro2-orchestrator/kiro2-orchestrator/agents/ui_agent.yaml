agent:
  name: "ui_agent"
  display_name: "KIRO2 UI Specialist"
  description: "React components, Tailwind CSS, responsive design"
  icon: "🎨"
  color: "#F59E0B"

model:
  primary: "codex"
  never_escalate: true  # UI için Codex yeterli

responsibilities:
  primary:
    - name: "react_components"
      model_override: "codex"
    - name: "tailwind_styling"
      model_override: "codex"
    - name: "responsive_design"
      model_override: "codex"
    - name: "state_management"
      model_override: "codex"

routing:
  trigger_keywords:
    high_confidence:
      - "react"
      - "component"
      - "frontend"
      - "tailwind"
      - "ui"
      - "dashboard"

tools:
  mcp:
    - "filesystem"
