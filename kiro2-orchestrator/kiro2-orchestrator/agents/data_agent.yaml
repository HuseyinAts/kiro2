agent:
  name: "data_agent"
  display_name: "KIRO2 Data Specialist"
  description: "PostgreSQL, Redis, migrations, query optimization"
  icon: "🗄️"
  color: "#3B82F6"

model:
  primary: "claude-opus-4"
  simple_tasks: "codex"
  simple_task_keywords:
    - "simple query"
    - "basic crud"
    - "select from"

responsibilities:
  primary:
    - name: "schema_design"
      model_override: "claude-opus-4"
    - name: "query_optimization"
      model_override: "claude-opus-4"
    - name: "migrations"
      model_override: "claude-sonnet-4"
    - name: "redis_caching"
      model_override: "codex"
    - name: "connection_pooling"
      model_override: "claude-sonnet-4"

routing:
  trigger_keywords:
    high_confidence:
      - "postgresql"
      - "database"
      - "migration"
      - "redis"
      - "cache"
      - "query"
      - "sql"

tools:
  mcp:
    - "postgresql"
    - "memory"
    - "filesystem"
