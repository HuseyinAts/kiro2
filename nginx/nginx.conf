# KIRO2 API Gateway - Nginx Configuration
# Mikroservisler için reverse proxy ve load balancing

# Worker settings
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"service":"$upstream_addr"'
    '}';

    access_log /var/log/nginx/access.log json;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream definitions - Microservices

    # API Gateway (Monolith - geçiş döneminde)
    upstream gateway {
        least_conn;
        server backend:8000 weight=5 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Exam Service (Port 8001)
    upstream exam_service {
        least_conn;
        server exam-service:8001 weight=5 max_fails=3 fail_timeout=30s;
        # Fallback to monolith during transition
        server backend:8000 backup;
        keepalive 16;
    }

    # Question Generation Service (Port 8002)
    upstream question_service {
        least_conn;
        server question-service:8002 weight=5 max_fails=3 fail_timeout=30s;
        server backend:8000 backup;
        keepalive 16;
    }

    # IRT/CAT Service (Port 8003)
    upstream irt_service {
        least_conn;
        server irt-service:8003 weight=5 max_fails=3 fail_timeout=30s;
        server backend:8000 backup;
        keepalive 16;
    }

    # AI Service (Port 8004)
    upstream ai_service {
        least_conn;
        server ai-service:8004 weight=5 max_fails=3 fail_timeout=30s;
        server backend:8000 backup;
        keepalive 16;
    }

    # Learning Path Service (Port 8005)
    upstream learning_path_service {
        least_conn;
        server learning-path-service:8005 weight=5 max_fails=3 fail_timeout=30s;
        server backend:8000 backup;
        keepalive 16;
    }

    # Frontend
    upstream frontend {
        server frontend:3000;
        keepalive 8;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost kiro2.local;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Request size limits
        client_max_body_size 50M;
        client_body_buffer_size 128k;

        # Connection limits
        limit_conn conn_limit 50;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ===========================================
        # EXAM SERVICE ROUTES (/api/v1/exam/*)
        # ===========================================
        location /api/v1/exam/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://exam_service/api/v1/exam/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location /api/v1/sinav/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://exam_service/api/v1/sinav/;
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # QUESTION SERVICE ROUTES (/api/v1/question/*)
        # ===========================================
        location /api/v1/questions/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://question_service/api/v1/questions/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/soru-bankasi/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://question_service/api/v1/soru-bankasi/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/question-generation/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://question_service/api/v1/question-generation/;
            proxy_read_timeout 120s;  # LLM generation takes longer
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # IRT/CAT SERVICE ROUTES (/api/v1/irt/*)
        # ===========================================
        location /api/v1/irt/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://irt_service/api/v1/irt/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/adaptive-test/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://irt_service/api/v1/adaptive-test/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/cat/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://irt_service/api/v1/cat/;
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # AI SERVICE ROUTES (/api/v1/ai/*)
        # ===========================================
        location /api/v1/ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ai_service/api/v1/ai/;
            proxy_read_timeout 120s;  # AI responses take longer
            include /etc/nginx/proxy_params;
        }

        location /api/v1/chat/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ai_service/api/v1/chat/;
            proxy_read_timeout 120s;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/agents/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://ai_service/api/v1/agents/;
            proxy_read_timeout 180s;  # Agent workflows can be long
            include /etc/nginx/proxy_params;
        }

        location /api/v1/nlp/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ai_service/api/v1/nlp/;
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # LEARNING PATH SERVICE ROUTES (/api/v1/learning/*)
        # ===========================================
        location /api/v1/learning-path/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://learning_path_service/api/v1/learning-path/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/learning-style/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://learning_path_service/api/v1/learning-style/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/zpd/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://learning_path_service/api/v1/zpd/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/fsrs/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://learning_path_service/api/v1/fsrs/;
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # AUTH ROUTES (stricter rate limiting)
        # ===========================================
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://gateway/api/v1/auth/;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/login {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://gateway/api/v1/login;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/register {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://gateway/api/v1/register;
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # MONOLITH FALLBACK (remaining routes)
        # ===========================================
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://gateway/api/;
            include /etc/nginx/proxy_params;
        }

        # ===========================================
        # WEBSOCKET SUPPORT
        # ===========================================
        location /ws/ {
            proxy_pass http://gateway/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ===========================================
        # FRONTEND (React SPA)
        # ===========================================
        location / {
            proxy_pass http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA fallback
            try_files $uri $uri/ @frontend;
        }

        location @frontend {
            proxy_pass http://frontend/;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # HTTPS server (for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name kiro2.example.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Include same location blocks as above
    # }
}
