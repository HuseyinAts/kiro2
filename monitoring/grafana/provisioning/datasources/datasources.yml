apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "teknofest-logs-*"
    interval: Daily
    timeField: timestamp
    version: 8
    editable: true
    jsonData:
      esVersion: "8.11.0"
      timeInterval: "10s"
      maxConcurrentShardRequests: 5