# Prometheus Configuration for Teknofest 2025 Production

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'teknofest-monitor'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Backend instances monitoring
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: 
          - 'backend1:8000'
          - 'backend2:8000'
          - 'backend3:8000'
        labels:
          service: 'backend'
          environment: 'production'

  # Nginx monitoring (requires nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'

  # PostgreSQL monitoring (requires postgres-exporter)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'teknofest_db'

  # Redis monitoring (requires redis-exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # ChromaDB monitoring
  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']
        labels:
          service: 'chromadb'

  # Celery monitoring (if celery-exporter is deployed)
  - job_name: 'celery'
    static_configs:
      - targets: ['celery-exporter:9540']
        labels:
          service: 'celery'

  # Docker containers monitoring (requires cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Node exporter for host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'