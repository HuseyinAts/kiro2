# SonarQube Configuration for Teknofest 2025 - Eğitim Eylemci Projesi
# This configuration defines code quality analysis settings

# Project information
sonar.projectKey=teknofest-2025-egitim-eylemci
sonar.projectName=Teknofest 2025 - Eğitim Eylemci Projesi
sonar.projectVersion=1.0.0
sonar.projectDescription=AI-powered educational platform for Turkish university entrance exam preparation

# Source code settings
sonar.sources=backend
sonar.sourceEncoding=UTF-8
sonar.language=py

# Exclusions - Files/directories to exclude from analysis
sonar.exclusions=**/node_modules/**,**/venv/**,**/env/**,**/__pycache__/**,**/migrations/**,**/static/**,**/media/**,**/uploads/**,**/htmlcov/**,**/.pytest_cache/**,**/dist/**,**/build/**,**/*.pyc,**/*.pyo,**/*.pyd,**/.DS_Store,**/Thumbs.db

# Test settings
sonar.tests=backend/tests
sonar.test.inclusions=**/test_*.py,**/*_test.py
sonar.test.exclusions=**/conftest.py

# Coverage settings
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.coverage.exclusions=**/test_*.py,**/*_test.py,**/conftest.py,**/setup.py,**/manage.py,**/wsgi.py,**/asgi.py,**/settings/**

# Code analysis settings
sonar.python.pylint.reportPaths=backend/pylint-report.txt
sonar.python.bandit.reportPaths=backend/bandit-report.json
sonar.python.flake8.reportPaths=backend/flake8-report.txt

# Quality gate settings
sonar.qualitygate.wait=true

# Duplication settings
sonar.cpd.exclusions=**/migrations/**,**/tests/**

# Security settings
sonar.security.hotspots.inheritFromParent=true

# Turkish language support
sonar.core.serverBaseURL=http://localhost:9000
sonar.scm.provider=git

# Additional settings for Python
sonar.python.version=3.11
sonar.python.xunit.reportPath=backend/pytest-report.xml

# Performance optimization
sonar.scm.disabled=false
sonar.scm.exclusions.disabled=false

# Code complexity thresholds
sonar.python.coverage.overall_line_coverage.threshold=80
sonar.python.coverage.line_coverage.threshold=75
sonar.python.coverage.branch_coverage.threshold=70

# Maintainability settings
sonar.maintainability_rating.threshold=A
sonar.reliability_rating.threshold=A
sonar.security_rating.threshold=A

# Technical debt settings
sonar.debt.ratingGrid=0.05,0.1,0.2,0.5
sonar.technical_debt.threshold=5d