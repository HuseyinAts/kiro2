<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Soru Tespit Sistemi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #667eea;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .preview-area {
            margin: 20px 0;
            text-align: center;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-area {
            margin-top: 20px;
        }

        .result-item {
            background: #f8f9ff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .badge-soru { background: #667eea; }
        .badge-cevaplar { background: #10b981; }
        .badge-zorluk { background: #f59e0b; }
        .badge-kitap { background: #06b6d4; }
        .badge-test { background: #8b5cf6; }
        .badge-sayfa { background: #6b7280; }

        .confidence {
            background: #e8ebff;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .success {
            background: #d1fae5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YOLO Soru Tespit Sistemi</h1>

        <div class="main-grid">
            <!-- Upload Section -->
            <div class="card">
                <h2>📤 Görsel Yükle</h2>

                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p>Görseli buraya sürükle veya tıkla</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                </div>

                <div class="preview-area" id="previewArea" style="display: none;">
                    <img id="preview" alt="Preview">
                    <p id="fileName" style="margin-top: 10px; color: #6b7280;"></p>
                </div>

                <button class="btn" id="detectBtn" disabled>🔍 Soruları Tespit Et</button>
            </div>

            <!-- Results Section -->
            <div class="card">
                <h2>📊 Tespit Sonuçları</h2>

                <div id="statsArea" style="display: none;">
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value" id="totalDetections">0</div>
                            <div class="stat-label">Toplam Tespit</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="processingTime">0.0s</div>
                            <div class="stat-label">İşlem Süresi</div>
                        </div>
                    </div>
                </div>

                <div id="resultsContainer">
                    <p style="text-align: center; color: #9ca3af; padding: 40px;">
                        Tespit sonuçları burada görünecek
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const preview = document.getElementById('preview');
        const fileName = document.getElementById('fileName');
        const detectBtn = document.getElementById('detectBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const statsArea = document.getElementById('statsArea');

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Lütfen bir görsel dosyası seçin!');
                return;
            }

            selectedFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                fileName.textContent = file.name;
                previewArea.style.display = 'block';
                detectBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Detect button
        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            detectBtn.disabled = true;
            detectBtn.textContent = '⏳ İşleniyor...';

            // Show loading
            resultsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>YOLO modeli soruları tespit ediyor...</p>
                </div>
            `;
            statsArea.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);

                const response = await fetch(`${API_BASE}/api/yolo/detect`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="error">
                        <strong>❌ Hata:</strong><br>
                        ${error.message}
                    </div>
                `;
            } finally {
                detectBtn.disabled = false;
                detectBtn.textContent = '🔍 Soruları Tespit Et';
            }
        });

        function displayResults(data) {
            // Update stats
            document.getElementById('totalDetections').textContent = data.num_detections;
            document.getElementById('processingTime').textContent = data.processing_time.toFixed(2) + 's';
            statsArea.style.display = 'block';

            if (data.num_detections === 0) {
                resultsContainer.innerHTML = `
                    <div class="error">
                        <strong>⚠️ Uyarı:</strong> Hiç tespit yapılamadı.
                    </div>
                `;
                return;
            }

            // Display detections
            let html = `<div class="success"><strong>✅ Başarılı!</strong> ${data.num_detections} nesne tespit edildi.</div>`;

            data.detections.forEach((det, index) => {
                const badgeClass = getBadgeClass(det.class);
                const label = getTurkishLabel(det.class);

                html += `
                    <div class="result-item">
                        <div class="result-header">
                            <span class="badge ${badgeClass}">${label}</span>
                            <span class="confidence">${(det.confidence * 100).toFixed(1)}%</span>
                        </div>
                        <div style="font-size: 12px; color: #6b7280;">
                            Konum: [${det.bbox.map(b => b.toFixed(0)).join(', ')}]
                        </div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        function getBadgeClass(className) {
            const map = {
                'soru': 'badge-soru',
                'cevaplar': 'badge-cevaplar',
                'zorluk_seviyesi': 'badge-zorluk',
                'kitap': 'badge-kitap',
                'test_no': 'badge-test',
                'sayfa': 'badge-sayfa'
            };
            return map[className] || 'badge-soru';
        }

        function getTurkishLabel(className) {
            const map = {
                'soru': 'Soru',
                'cevaplar': 'Cevaplar',
                'zorluk_seviyesi': 'Zorluk Seviyesi',
                'kitap': 'Kitap',
                'test_no': 'Test No',
                'sayfa': 'Sayfa'
            };
            return map[className] || className;
        }
    </script>
</body>
</html>
