  kanit: "S224 — bir pre-commit hook'u dosyayi degistirip 1 dondurunce `git commit --amend` CALISMAZ, ama `git log --oneline -1` AYNI HASH'i gosterir (eski commit hala orada). Ciktiya bakan 'amend oldu' sanir ve eski icerigi push etmeye calisir; bu oturumda 2 kez dusuldu, 3. denemede cikis kodu olculunce goruldu. Ikinci tuzak ayni yerde: hook basarisiz olunca pre-commit geri alma icin `git checkout -- .` kosuyor; 3399 kirli dosyali agacta bu ILGISIZ bir dosyada NTFS `Invalid argument` ile patliyor ve hata mesaji YANLIS dosyayi (_blindsolve/w22batches/g28.json) isaret ediyor -> teshis oradan baslarsa saatler kaybediliyor. Kural: amend/commit sonrasi `git log --oneline -1` hash'inin DEGISTIGINI dogrula. verification.md#GERI-ALIM-BIR-IDDIADIR'in commit tarafi"
