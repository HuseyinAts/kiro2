  zorlayici: null
  kanit: "S229 — bir duzenlemeden sonra `pytest tests/integration/test_question_bank_defaults.py` `collected 0 items` verdi; ilk okuma 'dosyayi bozdum' idi. Gercek sebep: onceki bir komutta `cd /c/Users/husey/kiro2` kosulmustu ve Bash oturumunun cwd'si KALICI, yol depo kokunun pytest.ini'sine cozuluyordu (cikti farkliydi: 'timeout func_only: True', xdist worker satiri yok). `backend/`'den kosunca 8/8 PASS. Bu dosyadaki 'olcum aletini dogrula' ailesinin en ucuz uyesi — kontrol kolu tek komut: `pwd`"
- id: L-s229-maskenin-altinda-maske
  baslik: "Bir fix'in degerini olcerken HANGI sayinin degismesi gerektigini ONCEDEN soyle"
  kaynak: docs/audits/2026-08-18_api_yuzeyi_kok_neden.md#y1--y5-uygulandi--813a8ac9b-18-agu-2026
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/fast/test_rate_limit_tutarliligi.py
  kanit: "S229 — Y1 (login hiz siniri 5->300) icin kabul kriteri 'GF'deki 15x429 dusmeli' diye konmustu ve TUTTU: cikti da 429/rate-limit gecen satir 15 -> 0. Ama tam tablo baska sey soyledi: passed 124 -> 124 (DEGISMEDI), failed 39 -> 28, skipped 15 -> 26. Yani 11 test duzelmedi, `failed`den `skipped`e gecti. Sebep test_golden_flows.py:137-145'te kodlu (429 -> pytest.fail, diger non-200 -> pytest.skip): o 11 test artik 401 aliyor cunku `users` tablosunda 3 satir var ve HEPSI STUDENT; admin@/ogretmen@/veli@kiro2.com HIC YOK. Yalniz `failed` dususune bakmak '11 test duzeldi' yanilsamasi verirdi. Kural: fix'in urune ne kazandirdigini olcen sayiyi (burada `passed`) fix'ten ONCE ilan et; maskeyi kaldirmak bulguyu cozmez, bir sonraki maskeyi gosterir. Yan bulgu bagimsiz bir acik is oldu (Y9): admin/ogretmen/veli akislari merge kapisinda SIFIR bilgi tasiyor"
- id: L-s229-esitlik-testi-tek-basina-yetmez
  baslik: "Iki kaynagi hizalayan test, ikisi BIRDEN yanlis olunca yesil kalir — ayrica ALT SINIR assert et"
  kaynak: docs/audits/2026-08-18_api_yuzeyi_kok_neden.md#civi-backendtestsfasttest_rate_limit_tutarliligipy-3-test
  sinif: test
  durum: aktif
  zorlayici: backend/tests/fast/test_rate_limit_tutarliligi.py
  kanit: "S229 — login hiz siniri iki yerde tanimliydi (api/auth.py=300, advanced_rate_limiter=5) ve middleware once kostugu icin KUCUK olan sessizce kazaniyordu. Ilk refleks 'ikisinin esit oldugunu assert eden bir bekci' yazmakti. O bekci tek basina YETERSIZ: `b3be80686` ikisini BIRDEN 5'e dusurmustu, yani esitlik testi o regresyonda GECERDI ve urun yine kirik olurdu (paylasimli NAT'ta 6. ogrenci giremiyor). Ikinci, kaynaktan BAGIMSIZ assert eklendi: `login >= 30` (olculmus vaka: 10 esszamanli ayni-WiFi ogrenci = 10/10 HTTP 429). Mutasyonla ayirt edildi: _LOGIN_RPM -> 5 => 2 test duser (esitlik + alt sinir); register testi dogru sekilde hayatta kalir. Genel kural: 'A == B' testi yalniz AYRISMAYI yakalar, ORTAK KAYMAYI yakalamaz"
- id: L-s229-toplu-commit-gerekce-tasimaz
  baslik: "Bir degeri geri almadan once o degisiklige GEREKCE var miydi diye olc — bos govdeli toplu commit karar degildir"
  kaynak: docs/audits/2026-08-18_api_yuzeyi_kok_neden.md#kok-neden-olcumle-daraltildi
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S229 — login limitini 5'ten 300'e cikarmak, yuzeyde 'bir guvenlik sertlestirmesini geri almak' gibi gorunuyordu; bu haliyle kullaniciya sorulmasi gereken bir karar olurdu. Olculdu: degeri dusuren `b3be80686` (7 Agu) toplu bir 'update core services, guardrails, algorithms...' commit'i ve GOVDESI BOS; `git log -p` ile o commit'ten ONCEKI hale bakilinca advanced_rate_limiter'daki deger de 300'du -- yani iki taraf hizaliydi ve supurme ikisini BIRDEN dusurdu. Test yok, yorum yok, gerekce yok. Karsi tarafta ise api/auth.py:90-93 OLCUME dayali bir yorum tasiyor. Boylece 'geri alma' degil 'kazayla dusurulen degeri iade' oldugu kanitlandi ve is onay beklemeden ilerledi. Kural: bir degeri degistirmeden once `git log -S '<deger>'` + commit govdesi oku; gerekcesiz toplu supurme bir tasarim karari DEGILDIR"
- id: L-s229-msys-yol-yeniden-yazimi
  baslik: "Git Bash `docker exec`'e verilen /app/... yolunu YENIDEN YAZAR — MSYS_NO_PATHCONV=1 sart"
  kaynak: .claude/rules/audit-methodology.md#olcum-aletini-dogrula-ayni-gun-4-gecersiz-olcum
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S229 — deploy dogrulamasi icin `docker exec kiro2-backend grep -n '/api/v1/auth/login' /app/core/advanced_rate_limiter.py` kosuldu. Cikti: `grep: C:/Program Files/Git/app/core/advanced_rate_limiter.py: No such file or directory`. Yani MSYS, / ile baslayan argumani WINDOWS yoluna cevirdi ve container'a hic ulasmayan bir yol gonderdi. Hata mesaji dosyanin YOK oldugunu soyluyor -- 'docker cp basarisiz oldu' diye okunabilirdi; gercekte cp basariliydi. Fix: `MSYS_NO_PATHCONV=1 docker exec ...` (ayni komut sonra 3 satiri dogru dondurdu). Bu, verification.md'deki 'bash /tmp = MSYS temp, Python /tmp = C:\tmp' dersinin kardesi: Git Bash'te MUTLAK YOL iceren her dis-arac cagrisinda (docker exec, docker run -v, psql -f, wsl) yol donusumu sorgulanmali. Genel kural: container/uzak sistem yolu iceren komutta 'dosya yok' hatasi bir BULGU degil, once yol-donusumu kontrolu ister"
- id: L-s229-kapi-borcu-karari-uc-olcum-ister
  baslik: "Pre-commit kapisi kirmiziysa SKIP mi FIX mi -- karar UC olcume dayanir, sezgiye degil"
  kaynak: .claude/rules/audit-methodology.md#ayni-aracin-uc-surumu-var-ve-kapiyi-en-eskisi-tutuyor-17-agu-2026-s224
  sinif: surec
  durum: aktif
  zorlayici: null
  kanit: "S229 — Y1 commit'inde ruff kancasi `PLW0603` ile kirmizi verdi. Ucu de olculdu, sonra karar verildi: (1) BENIM KODUM temiz mi? kapinin surumuyle (0.7.1) GERCEK YOLDA kosuldu -- test dosyasi 'All checks passed', limiter'da ihlali haric tutunca 'All checks passed' => yeni borc yok. (2) KONTROL KOLU: ayni ifade HEAD'de var mi? `git show HEAD:<dosya> | grep -n 'global _rate_limiter'` -> HEAD:369, dokunmadigim fonksiyon => onceden var olan borc. (3) YAYGINLIK: `ruff check --select PLW0603 backend/{core,api,services}` -> 132 kalem => sistemik, dosya-basina kapatmak yanlis katman. Karar: SKIP=ruff + gerekceyi commit mesajina yaz + AYRI acik is (Y8). Uc olcumden biri eksik olsaydi karar savunulamazdi: (1) yoksa kendi borcunu gizlemis olurdun, (2) yoksa 'ben mi getirdim' bilinemez, (3) yoksa tek dosyayi duzeltip sistemik borcu gormezden gelirdin. Kural: SKIP bir MUAFIYET degil, OLCULMUS bir ertelemedir"
- id: L-s229-yarim-commitin-artigi-sessiz-kalir
  baslik: "Yarim kalan commit'in artigi calisan agacta SESSIZCE bekler — oturum sonunda takipli-kirliyi supur"
  kaynak: .claude/sessions/latest.md
  sinif: surec
  durum: aktif
  zorlayici: null
  kanit: "S229 — [[L-s229-commit-yarim-gidebilir]] 'commit aninda `git show --stat` ile olc' diyor. Eksik kalan yarisi: o an KACIRILIRSA artik dosya kalici olarak calisan agacta kalir ve fark edilmez. Somut vaka: `1dd12579d` (A1, surum matrisi) yalniz `backend/requirements-minimal.txt`'i commit'ledi; `backend/requirements.txt` ayni pinlerle KIRLI kaldi ve gunler sonra, tamamen baska bir isin push'undan sonra `git status --short --branch` ciktisinda goruldu. Bu depoda ~3400 TAKIPSIZ dosya oldugu icin `git status` ciplak haliyle kullanilamaz -- artik gorunmez olur. Isleyen filtre: `git status --porcelain | grep -v '^??'` -- yani TAKIPSIZ olanlari DISLA, kalanini say. S229 sonunda bu sayi 1 idi ve o 1 dosya gercek bir eksikti. Kural: oturum kapanisinda takipsiz gurultuyu FILTRELEYEREK takipli-kirli sayisini olc; 0 degilse her birinin sahibini bul. DUZELTME (S231): bu dersin ilk yazimi filtreyi 'bas harfi M olanlari say' diye tarif ediyordu ve BU YANLISTIR -- bkz. [[L-s231-porcelain-bas-harfi-staged-sutunudur]]"
- id: L-s230-ast-sayaci-ham-sql-goremez
  baslik: "AST tabanli gocu sayacinda `SINIF=0` 'gocu bitti' DEGIL 'alet bakamadi' demek olabilir — ham SQL yapisal kor noktadir"
  kaynak: backend/scripts/scan_split_accesses.py
  sinif: alet
  durum: aktif
  zorlayici: backend/tests/integration/test_es_index_schema_split.py
  kanit: "S230 — `scan_split_accesses.py` S219'da regex'ten AST'ye tasindi ve o gun kor noktalari docstring'e yazildi; ama listenin BASINDAKI kalem eksikti. Alet `QuestionBankItem.<alan>` bicimindeki `Attribute` dugumunu arar; tasinmis alan bir SQL DIZESI icinde gectiginde AST'de hicbir dugum yoktur, yani alet 0 raporlar. Olculdu: Y2'nin iki P0'inin IKISI DE ham SQL kullaniyordu (`services/cat_session.py`, `services/placement_service.py`) ve sayac o dosyalari temiz gosterirken uretimde `asyncpg.UndefinedColumnError` -> `/api/v1/cat/next` ve `/placement/start` HTTP 500 donuyordu. Ayrica devrin `scan.txt` dosyasi BAYATTI (45 diyordu, taze olcum 63). Iki hata birlesince 'gocu neredeyse bitti' okumasi cikiyordu. Kor nokta artik docstring'de AYRI ve one cikan bir paragraf olarak yazili (listedeki digerleri 'bugun 0 kalem' diyor; bu kalem 0 DEGILDI, o yuzden onlarin arasina konulamazdi). Yedek kontrol: `grep -rn 'question_bank' backend/{services,api,core} --include='*.py' | grep -i 'select|update|insert|text('`. ZORLAYICI YOK: `backend/tests/fast/test_scan_split_accesses.py` (10 test, yesil) ham SQL korlugunu SINAMIYOR -- bu bosluk bilincli olarak gorunur birakildi. Kural: bir ilerleme sayacinin cikitisi ALT SINIRDIR; yanlis-sifir isi sessizce bitirir ([[L-s219-olcum-aletinde-yanlis-sifir]]). S239 GUNCELLEME -- BOSLUK ISIRDI VE KAPATILDI: ayni kor nokta `core/es_index_schema.SORGU`'da da vardi (f-string ile kurulan ham SQL, split oncesi `q.question_text` varsayiyordu). Senkron HER kosumda `UndefinedColumnError` ile dusuyordu ve canli ES index AYLARDIR 0 dokumandi; #433 bunu 'index'i yeniden kur' diye yanlis teshis etmisti. Zorlayici artik VAR: `tests/integration/test_es_index_schema_split.py` sorgunun METNINI okumaz, canli semaya karsi KOSTURUR ve donen satir sayisini kapiyla karsilastirir (5 test)."
- id: L-s230-yavru-tablonun-pk-si-id
  baslik: "Split yavru tablolarin PK'si `id` ve AYNI ZAMANDA parent'a FK — `question_id` kolonu YOKTUR"
  kaynak: .claude/rules/database.md
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/integration/test_split_migration_cat_session.py
  kanit: "S230 — Y2 icin ilk onerilen JOIN kosulu `question_content.question_id = question_bank.id` idi; makul gorunuyordu ve uygulansa ayni `UndefinedColumnError`'i YENIDEN uretirdi. `information_schema` ile olculdu: uc yavru tablonun da (`question_content`/`question_metadata`/`question_statistics`) birincil anahtari `id` ve bu kolon ayni zamanda `question_bank.id`'ye FK; `question_id` adinda kolon HICBIRINDE yok. Dogru kosul `qc.id = qb.id`. LEFT JOIN secildi: canli 1:1 veride tam tutuyor (36967 x 4, yetim 0) ama bu YAPISAL bir garanti degil (bkz. S222 bulgusu -- `INSERT INTO question_statistics` depoda hicbir yerde yok, 1:1 trigger/constraint ile zorlanmiyor). Mutasyonla civili: JOIN anahtari `qc.id` -> `qb.created_by` yapilinca 9 test duser. Kural: bir JOIN anahtarini semadan OKUMADAN yazma; ad tahmini (`<tablo>_id`) bu semada yanlis"
- id: L-s230-hayatta-kalan-mutasyon-gecersiz-olabilir
  baslik: "LEFT JOIN'li sorguda niteliksiz kolon tek tabloda cozulur — 'onek silme' mutasyonu testi degil KENDISINI olcer"
  kaynak: .claude/rules/audit-methodology.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S230 — Y2 testlerini civilemek icin ilk denenen mutasyon SQL'deki `qs.` tablo onekini silmekti; mutasyon HAYATTA KALDI. Ilk okuma 'testler yuk tasimiyor' olurdu ve test paketi bosuna sertlestirilirdi. Gercek sebep olculdu: sorguda LEFT JOIN varken niteliksiz bir kolon adi Postgres tarafindan yine TEK tabloda cozuluyor, yani mutasyon SQL'in anlamini hic degistirmiyor -- gecersiz bir mutasyondu. Gecerli mutasyon (JOIN anahtarini `qc.id` -> `qb.created_by` degistirmek) uygulanip 9 test dustu (iki uc testi dahil). [[L-s223-mutasyonun-kendisi-de-bir-alet]] 'mutasyonun `failed` vermesi testin yuk tasidigini kanitlamaz' diyordu; bu vaka TERS yonu gosteriyor: mutasyonun HAYATTA KALMASI da testin zayif oldugunu kanitlamaz. Kural: hayatta kalan mutasyonda once 'bu mutasyon davranisi gercekten degistirdi mi' sorusunu olc; degistirmiyorsa bulgu testte degil aletdedir"
- id: L-s231-porcelain-bas-harfi-staged-sutunudur
  baslik: "`git status --porcelain` bas harfi INDEX sutunudur — `grep '^[MAD]'` unstaged degisikligi GORMEZ ve HER ZAMAN 0 der"
  kaynak: .claude/rules/audit-methodology.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S231 — kapanis turunda takipli-kirli sayisi olculdu ve `0` bildirildi; YANLISTI, gercek deger 4. Kok neden: `git status --porcelain` ciktisi iki sutunludur (XY) -- X = INDEX/staged durumu, Y = CALISMA AGACI durumu. Stage'lenmemis bir degisiklik ` M` olarak cikar, yani BAS KARAKTER BOSLUKTUR. Dolayisiyla `grep '^[MAD]'` yalniz STAGED degisiklikleri sayar ve hicbir sey `git add`lenmemisken HER ZAMAN 0 dondurur -- yani sessizce yanlis-sifir uretir. Daha kotusu: bu hatali yordam [[L-s229-yarim-commitin-artigi-sessiz-kalir]] dersinin ICINE 'bas harfi M olanlari say' diye YAZILMISTI, yani defter kendi kuralini bozan bir tarif tasiyordu ve bir sonraki tur onu izleyip ayni hataya dustu. Dogru filtre TAKIPSIZ olani DISLAMAKTIR: `git status --porcelain | grep -v '^??'`. Kontrol kolu (ayirt edici): hicbir sey add'lenmemisken yanlis filtre 0, dogru filtre 4 dondurdu; ayrica devralinan `backend/semantic_cache.pkl` yalniz dogru filtrede gorundu. Kural: bir sayaci 'temiz' okumasi verirken KONTROL KOLU sart -- bilinen-kirli bir dosyanin o sayacta GORUNDUGUNU kanitla ([[L-s219-olcum-aletinde-yanlis-sifir]]: yanlis-sifir tek kabul edilemez hata turudur)"
- id: L-s230-limiter-deposu-import-aninda-baglanir
  baslik: "Hiz siniri DEPOSU `settings.redis_url`e IMPORT ANINDA baglanir — `@limiter.limit` tasiyan her uc testi KONU-DISI 500 verir"
  kaynak: backend/conftest.py
  sinif: test
  durum: aktif
  zorlayici: backend/tests/integration/test_split_migration_cat_session.py
  kanit: "S230 — Y2'nin uc testleri once 500 donuyordu ve bu 'split gocu calismiyor' diye okunabilirdi. Olculdu: kok neden split ile ILGISIZ. `backend/conftest.py:25` `REDIS_URL`i `redis://localhost:6380/1` yapiyor, bu makinede 6380'de hicbir sey dinlemiyor (`[Errno 10061] Connect call failed`); hiz siniri deposu `settings.redis_url`e IMPORT ANINDA baglandigi icin istek islenmeden ham `ConnectionError` firliyor ve islenicisi olmadigindan 500 oluyor. Servis istemcisini kurtarmak (`_canli_redis()`) YETMIYOR -- limiter deposu ayri. Fix: `cat_client` fixture'inda limiter devre disi; ayni uc limiter kapaliyken 200 + gercek soru donuyor. KAPSAM: bu kusur Y2'ye ozgu DEGIL, bu makinede `@limiter.limit` tasiyan HER endpoint testi ayni sekilde duser -- yani ayni sinifta baska kirmizilar gorulurse once bu elenmeli. Kural: bir uc testinde 500 gorunce once 'istek isleniciye ULASTI mi' diye olc; import-aninda baglanan yan sistemler (limiter deposu, cache, metrik) testi konu-disi sebeple kirmiziya boyar"
- id: L-s231-hacim-vekil-olcum-icerik-degil
  baslik: "Satir sayisi ve invaryantlar YESILKEN icerik tamamen gecersiz olabilir — hacim bir VEKIL olcumdur"
  kaynak: docs/audits/2026-08-19_beta_kapisi_icerik_gecerliligi.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S231 — MEMORY'nin en ustunde 'DB DOLU: 36.967 her biri, yetim 0, kapi 27.073' yaziyordu ve bu SAYISAL OLARAK DOGRUYDU. Dort tablo senkron, yetim yok, kapi satir donduruyor, `student_coherent=true`, `quality_review_status='auto_judged_high'` -- her invaryant yesil. Y4 pilotu icin kapidan 40 soru cekilip (5 ders x 8, md5 siralamasi, TRUNCATE YOK) 40'i TEK TEK OKUNDU: yanitlanabilir VE anahtari dogru = 0 (%0); yanitlanabilir ama anahtar YANLIS = 5 (%12,5, aritmetigi elle dogrulandi: f(x)+f(-x)=2x^2+2 ama DB 'D' diyor; ucgenin ic acilari 180 ama DB '360' diyor); yanitlanamaz/bozuk/soru degil = 35 (%87,5 -- 'Parabol (Kismi Ozet)' baslik parcasi, 5 sikki AYNI olanlar, 10'un kuvvetleri sikki, 'Prazesente vla. ogur for evet cose servosu' gibi anlamsiz metin, paragrafi EKSIK sorular). Orneklem sansi degil: `source_book` NULL = 27.073/27.073, `auto_imported=true` = 36.967/36.967 -> CLAUDE.md'nin anlattigi 405-kitap korpusu BU DB'DE DEGIL. Kural: bir veri havuzuna dayanan isi 'deger uretiyor' saymadan once HACIM DISI bir olcum yap -- orneklemi OKU. Hacim, yetim sayisi, senkronluk ve bayraklar icerik gecerliligi hakkinda SIFIR bilgi tasir. ZORLAYICI YOK: bu sinifi yakalayan hicbir test mevcut degil ve bosluk bilincli olarak gorunur birakildi -- onerilen bekci kapidan orneklem alip yanitlanabilirlik/sik-tekrari/anahtar-tutarliligi sinar"
- id: L-s231-bayrak-tasidigi-iddiayi-kanitlamaz
  baslik: "Adi dogrulamak istedigin ozellik olan bir bayrak, en tehlikeli vekil olcumdur — toptan basilmis olabilir"
  kaynak: docs/audits/2026-08-19_beta_kapisi_icerik_gecerliligi.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S231 — `pipeline_metadata->>'student_coherent'` bayragi tam olarak 'bu soru ogrenci icin anlamli mi' sorusunu yanitliyormus gibi duruyor ve ogrenci kapisi (`mv_safe_for_beta`) buna dayaniyor. Olculdu: `student_coherent=true` = 27.073/27.073 -- yani TEK bir satir bile 'false' degil, dagilim YOK. Bir yargi surecinin cikti dagiliminin tekil olmasi, yargilama YAPILMADIGININ gostergesidir (ayni desen 3 Haz 2026'da da vardi: kor-judge yalniz keep'leri isaretledi, drop nedenleri persist EDILMEDI -> 'student_coherent=false' 0 satir). Okunan 40 sorunun en az 35'inde bayrak YANLIS. Kural: bir bayraga dayanmadan once (a) DAGILIMINI sorgula -- tek deger ise yargi degil varsayimdir, (b) bayragin iddia ettigi seyi BAGIMSIZ olarak orneklemle sina. Kardes ders: [[L-s229-server-default-fantom-olabilir]] deseninin veri-yargisi ayagi"
- id: L-s231-ters-tirnak-commit-mesajinda-komut-kosar
  baslik: "Bash cift-tirnakli commit mesajindaki TERS TIRNAK komut olarak kosar — mesaji dosyadan ver"
  kaynak: .claude/rules/audit-methodology.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: 'S231 — `git commit -m "...`del kayitlar` ile bitiyordu..."` yazildi ve kabuk `del: command not found` dondurdu: cift tirnak icindeki ters tirnak komut ikamesidir, yani mesaj metni SESSIZCE degisir. O commit ayrica ruff N802 yuzunden dustu, ama dusmeseydi mesaj bozuk halde repoya girecekti. Daha kotusu: ayni tuzak DOGRULAMA komutunu da bozdu -- `git log ... | grep -c "``"` calistirildi, ters tirnaklar bos komut ikamesine cozuldu, desen BOS DIZE oldu ve her satira esletti (43/43) -> ''bozulma yok'' diye YANLIS-POZITIF okundu. Dogru yordam: mesaji bir dosyaya yaz ve `git commit -F <dosya>` kullan (bu turda 2 commit boyle atildi, ikisi de temiz). Genel kural: metni kabuktan gecirirken ters tirnak / `$(...)` / `$VAR` iceriyorsa dosya kullan; ozellikle DOGRULAMA komutlarinda -- bozuk bir dogrulayici ''sorun yok'' der'
- id: L-s231-zorlayici-var-ama-otomatik-kosmuyor
  baslik: "Ders defterinin %29'unun zorlayicisi var ama zorlayicilarin %0'i OTOMATIK kosuyor — enforcement kagit uzerinde"
  kaynak: .claude/lessons/README.md
  sinif: surec
  durum: aktif
  zorlayici: backend/tests/unit/test_ders_kaydi.py
  kanit: "S231 — 'dersler etkin kullaniliyor mu yoksa yalniz yazili mi' sorusu OLCULDU. Defter: 125 ders, 83 `aktif` (%66), 42 `dogrulanmadi`; `zorlayici` (koruyan test) VAR = 36 (%29), YOK = 89 (%71); `aktif` ama zorlayicisiz = 47. Sonra asil soru soruldu -- o 36 zorlayici FIILEN kosuyor mu? IKI ayri olcum (L-s219): (a) pre-commit: kok `.pre-commit-config.yaml`de test kosan hook YOK, tek pytest hook'u `:211`de '`KALDIRILDI (28 Tem 2026)`' yorumu olarak duruyor -> commit aninda HICBIR test kosmuyor. (b) CI: dal listesi olan her workflow (`ci.yml`, `golden-flows.yml`, `quality-gate.yml`, `security.yml`) yalniz `main`/`master` hedefliyor; calisilan dal `feature/self-evolution-optimization` -> 0 workflow tetikleniyor. Yani zorlayicilar OTOMATIK olarak hic kosmuyor; yalniz birinin elle `pytest` cagirmasiyla kosuyorlar. KARSI TARAF da olculdu ve dersler OLU DEGIL: bu oturumda 14 ders fiilen uygulandi (kabuk `cd` kaliciligi, `-p no:xdist` usage-error tuzagi, mutasyondan once commit, `git show --stat` ile ne girdigini olcmek, `read_bytes` CRLF tuzagi, her olcumde kontrol kolu, truncate'siz orneklem, SKIP oncesi uc olcum, mock DB yerine gercek Postgres, vakum testi tespit+silme, `failed` vs `error` ayrimi, `n_live_tup` tahmin -> gercek COUNT, SQL'i yeniden yazmak yerine uretim fonksiyonunu cagirmak, mutasyon ankrajinin tekilligini dogrulamak) ve 3 ihlal oldu (porcelain `^[MAD]` -- dersin KENDI yordami yanlisti; commit mesajinda ters tirnak -- ders YOKTU; kusur kapsamini gurultulu yollari saymadan genis ilan etmek -- ders VARDI, tekrar ihlal). Kural: dersler ajan BAGLAMI uzerinden isliyor, arac zinciri uzerinden DEGIL. Bu, baglam kaybinda / farkli ajanda / insan unuttugunda SESSIZCE bozulur. Enforcement iddiasi 'zorlayici alani dolu' ile degil, 'o test otomatik bir kapida kosuyor' ile olculur"
- id: L-s231-kusur-kapsamini-gurultulu-yollari-sayarak-ilan-et
  baslik: "Bir kusur sinifinin KAPSAMINI ilan etmeden once ZATEN GURULTULU olan yollari say"
  kaynak: .claude/rules/audit-methodology.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S231 — CAT motoru icin 'motor sessizce anlamsiz cikti uretiyor' diye genis bir cerceve kuruldu ve kullaniciya oyle sunuldu. Sonra kod okundu ve cerceve YANLIS cikti: `submit_answer` havuz tukenince `termination_reason='pool_exhausted'` ile ACIKCA bitiriyor; `start_session` hic soru bulamayinca `ValueError` -> `cat.py:150` -> HTTP 422 donuyor (500 bile degil). Gercekten sessiz olan TEK yol `start_session:489` warm-up fallback'iydi (4 dalin 4'u bos, hicbir log yok). Yani 'sessiz kusur' sinifinin uc uyesinden ikisi zaten gurultuluydu ve kapsam 1/3'e indirildi. Bu, `audit-methodology.md#SEVERITY DE BIR OLCUMDUR` dersinin TEKRAR ihlaliydi (ders yaziliydi). Kural: 'X sessizce basarisiz oluyor' / 'her yerde kirik' gibi kapsam iddialarini yazmadan once ilgili yollari TEK TEK ac ve hangilerinin zaten log/exception/HTTP kodu urettigini SAY. Kapsami daraltmak bulguyu zayiflatmaz -- guvenilir kilar ve dogru yere odaklar"
- id: L-s232-kontrol-kolu-bekciyi-DUZELTIR
  baslik: "Yalniz bilinen-KOTU'ye kosulan bir bekci HER ZAMAN dogru gorunur — bilinen-IYI kol iki gercek kusur buldu"
  kaynak: docs/audits/2026-08-19_y12_kontrol_kolu.md
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/integration/test_icerik_gecerliligi.py
  kanit: "S232 — Y12 icerik-gecerliligi bekcisi yazildi, canli kapiya kosuldu, `8 xfailed` verdi ve DOGRU gorundu. Sonra audit-methodology.md#Metrik-Dogrulama-Gate geregi bilinen-IYI kola (kiro2_temp, 34.982 satir, gercek 420 kitap) kosuldu ve IKI KUSUR cikti. (1) I4 KOR DEDEKTORDU: iddia count(DISTINCT reviewed_at) > 1 idi; canli 1 -> duser (dogru), kiro2_temp 0 (hepsi NULL) -> DE duser (YANLIS). Iki kolda birden dusen dedektor hicbir sey olcmez. Kusur kavramsaldi: iddia 'hic incelenmemis' (durust, 0) ile 'incelendi YALANI' (toplu UPDATE imzasi, 1) durumlarini karistiriyordu -> != 1 yapildi. (2) K2 esigi bilinen-IYIYI REDDEDIYORDU: esik 0,02 idi ve BASKA bir populasyondan (jsonl page_inline katmani, 0,007) alinmisti; kiro2_temp olculunce 0,0256 cikti -> Y11 mukemmel calissa bile bekci kirmizi kalacakti. Esik iki koldan olculup 0,05'e cekildi (bilinen-iyinin ~2 kati, bilinen-kotunun ~4'te biri; canli 0,2075). Kural: bir bekcinin ayirt edici oldugu, bilinen-kotude kirmizi vermesiyle DEGIL, bilinen-iyide YESIL vermesiyle kanitlanir. Kontrol kolu kosulmasaydi bu dosya '8 xfailed' ile dogru gorunup iki kusuru tasiyacakti. Mutasyon 4/4 oldu (hepsi failed, hicbiri error, 4 geri alim git status BOS ile dogrulandi)"
- id: L-s232-acik-devre-dedektor-makul-sayi-dondurur
  baslik: "Baglantisi kopan bir dedektor 'her sey bozuk' deyip MAKUL bir skor dondurebilir — saglik kontrolu bulgudan once"
  kaynak: docs/audits/2026-08-19_y12_kontrol_kolu.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S232 — Turkce garble tespiti icin zemberek_spell_check MCP araci denendi (CLAUDE.md'de 'Zemberek Integration' bolumu var ve calistigi VARSAYILIYOR). Bilinen-KOTU girdi ('Prazesente vla. ogur for evet cose servosu') -> accuracy 0.0. Bu tek basina 'alet calisiyor' diye okunurdu. Kontrol kolu kosuldu: bilinen-IYI Turkce ('Buna gore paralelkenarin alani kac santimetrekaredir?' -- gore/kac/alani tartismasiz dogru) -> DE accuracy 0.0. Sebep her kelimenin error alaninda gomuluydu: 'All connection attempts failed'. zemberek_health teyit etti: status unhealthy, zemberek_available false, http_backend_available false. Yani arac ACIK-DEVRE basarisiz oluyor: istisna FIRLATMIYOR, her kelimeyi is_correct=false isaretleyip cagirana toplu accuracy 0.0 donduruyor. Bir kalite kapisi buna baglansaydi 'yasak kelime var mi' sorusunda HER metni reddederdi (gurultulu, fark edilir) ama 'Turkcesi duzgun mu' sorusunda HICBIR metni onaylamazdi ve accuracy 0.0 bir OLCUM gibi gorunurdu. Karar: Zemberek Y12'den ELENDI, dedektor yuku dile bagli olmayan yapisal kurallara birakildi. Kural: bir dedektore guvenmeden once (a) saglik ucunu cagir, (b) BILINEN-IYI girdiyle sina; agrega skor makul gorunse bile satir/kelime duzeyindeki error alanlarina bak"
- id: L-s232-kaynak-diskte-degil-YAN-VERITABANINDA
  baslik: "'Veri kayip, diskteki dosyadan kurtaralim' demeden once veritabani listesini cek — gercek korpus ayni sunucudaydi"
  kaynak: docs/audits/2026-08-19_y12_kontrol_kolu.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S231 kapi icerigini gecersiz buldu ve kurtarma kaynagi olarak d-dataset/eslesmis_sorucevap.jsonl'i (116 MB, 77.336 satir) isaret etti; Y11 boylece '116 MB dosya ice-aktarma' isi olarak planlandi. S232'de TEK komut (SELECT datname, pg_size_pretty(pg_database_size(datname)) FROM pg_database) ayni sunucuda kiro2_temp (2209 MB) veritabanini gosterdi: question_bank 187.835 satir / 187.725'i source_book dolu / 420 kaynak kitap / 5 zorluk seviyesi / 68.022 farkli irt_difficulty. Bagimsiz hash tuzuyla 12 soru cekilip ELLE COZULDU: 11'i servis edilebilir ve anahtari dogru (Kepler yasalari -> A; teget cember -> C; EBOB(a,b)=6 ve EBOB(b,c)=15 -> 51 -> A; tan(arcsin 7/25)=7/24 -> A; cift yarik girisimi -> C). Dahasi JSONL'in GERCEK katmani (answer_source=page_inline, 55.867 satir) DB'ye HIC girmemis (%0,0 gecis); DB'ye giren AI turevi katman (bayes_ai_upgrade %96,8 + jsonl_v11 %99,2). Yani JSONL'den ice aktarmak copu TEKRAR getirirdi. Adli isaret: canli 36.967/36.967 UUIDv4 ve tamami 17 Agu 04:47-04:49 (3 dakika) vs kiro2_temp 187.629 UUIDv5 ve 4 Mar-22 Haz; soru_hash kesisimi 0 -> ustune yazma DEGIL, tamamen AYRIK bir ikame. Kural: 'veri kayip, diskten kurtaralim' bir KAYNAK iddiasidir ve en ucuz olcumu veritabani listesidir. Kaynak secmeden once listeyi cek, sonra aday kaynaktan ORNEKLEM OKU (hacim degil icerik)"
- id: L-s232-yanlis-pozitifi-OKU-esigi-tahmin-etme
  baslik: "Bayrakli satirlari OKUMAK, esigi tahmin etmekten daha iyi kural uretir — ayirt edicilik VE FP birlikte iyilesti"
  kaynak: docs/audits/2026-08-19_y12_kontrol_kolu.md
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/integration/test_icerik_gecerliligi.py
  kanit: "S232 — Y12'nin R6 kurali ('bir sik govdenin birebir alt dizesi, >=15 karakter') bilinen-IYI kolda 232 satir bayrakliyordu. Esigi yukseltmek ya da kurali atmak yerine bayraklardan 10'u OKUNDU: 8 gercek kusur, 1 sinirda, 1 DOGRULANMIS YANLIS-POZITIF -- 'Nufus artis hizinin dusurulmesi ya da yukseltilmesi yonunde uygulanan nufus politikalarinin, asagidakilerden hangisine etkisi beklenmez?' + sik B) 'Nufus artis hizi' (17 karakter, uzunluk tabanini geciyor). Soru gercek, yanitlanabilir, anahtari dogru (D). FP'yi OKUMAK kuralin gercek sinyalini gosterdi: 'bir sik govdede geciyor' degil, 'SIK BLOGU govdeye kopyalanmis'. Kural >=1 sik -> >=3 sik yapildi, IKI KOLDA da olculdu: >=1 -> canli 968 / temp 232 (5,4x); >=3 -> canli 593 / temp 103 (7,4x); birlesim orani 0,2145/0,0288 -> 0,2075/0,0256 (8,1x). Yani sikilastirma hem ayirt ediciligi ARTIRDI hem FP sinifini KALDIRDI -- nadir bir ikili kazanc ve yalnizca bayraklari okuyarak gorulebilirdi. Kardes ders: L-olcum-garble-tail-silme (ucuz filtre tuzagi); orada da cozum sayilara degil orneklere bakmakti"
- id: L-s232-bayat-esik-mi-yoksa-susturulmus-gercek-alarm-mi
  baslik: "Bir esigi 'bayat' ilan etmeden once esigin KALIBRE EDILDIGI degeri ara — gercek alarm olabilir"
  kaynak: backend/tests/db/test_question_bank_invariants.py
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/db/test_question_bank_invariants.py
  kanit: "S232 — Bir denetim ajani test_question_bank_invariants.py'nin MIN_SATIR=150.000 esigini 'bayat' diye raporladi (canli DB 36.967 satir, yani esik hep dusuyor). Olculdu ve TERSI cikti: dosyanin kendi docstring'i '5 Agu 2026'da tablo 187.835 satirdan 2.304'e dustu' diyor ve kiro2_temp'te olculen deger tam olarak 187.835. Yani esik GERCEK korpusa gore kalibre edilmis; canlinin 36.967'de kalmasi 17 Agu'daki IKINCI icerik ikamesinin DOGRU bir alarmi. Esige dokunulmadi. ASIL kusur baskaydi ve ayni dosyadaydi: benzersizlik sorgusu 'SELECT count(DISTINCT question_text) FROM question_bank' diyordu ve o kolon S210'un 69-alan split'inde (0fd9b8413) question_content'e tasinmisti -> UndefinedColumnError. Yani benzersizlik invaryanti split'ten BERI hic olcmemisti; gorulmedi cunku DSN'siz kosumda test zaten skip oluyordu (iki kusur ust uste: sessiz skip + bayat sema). JOIN'e cevrildi, artik kosuyor (0,928 >= 0,90 GECIYOR). Kural: 'esik bayat' bir OLCUMDUR. Once esigin turedigi sayiyi bul (docstring / commit mesaji / kalibrasyon kaydi); o sayi baska bir yerde HALA gecerliyse esik bayat degil, ALARM GERCEKTIR. Ve her zaman sor: bu bekci gercekten KOSUYOR mu yoksa skip mi ediyor?"
- id: L-s232-kurtarma-kaynagi-da-olculur
  baslik: "Kurtarma kaynagini 'temiz' saymak, kaybettigin havuzu 'dolu' saymakla ayni hatadir"
  kaynak: docs/audits/2026-08-19_y11_kaynak_olcumu.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S232 — kiro2_temp bulundugunda hemen 12 soru okundu, 11'i servis edilebilir cikti (%92) ve bu 'kaynak saglam' gibi okundu. Kullanici esigi (>=%95) icin 60 soruluk ORANTILI STRATIFIYE kor okuma yapildi ve sonuc cok farkli cikti: Claude 39/60 (%65), ajanlar 43/60 (%71,7), figur duzeltmesiyle tavan 45/60 (%75). Yani ilk 12'lik cekim SANSLIYDI; nokta tahmin populasyon degeri degildir. Kalan kusur figurler hesaba katildiktan SONRA bile %21,7 ve siniflari somut: anlamsiz Turkce ('Atomojiklerin', 'denge notasi'), GEOMETRIK OLARAK IMKANSIZ veri (A=60, AB=3, BC=2 -> kosinus teoremi b^2-3b+5=0, diskriminant -11), birebir ayni iki sik, eksik onceki-veri. Kural: bir kurtarma kaynagini kullanmadan once HEDEF ESIGE gore olc, kucuk bir orneklemin verdigi izlenime gore degil. Kardes ders: L-s231-hacim-vekil-olcum-icerik-degil (orada hacim vekildi, burada KUCUK ORNEKLEM vekil)"
- id: L-s232-kendi-yargin-da-bir-olcum-aletidir
  baslik: "Metne bakip 'yanitlanamaz' demek, figur varsa OLCUM DEGIL VARSAYIMDIR"
  kaynak: docs/audits/2026-08-19_y11_kaynak_olcumu.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S232 — 60 soruluk orneklemde 19 soru 'yanitlanamaz' diye yargilandi; bunlarin 6'si 'figur-bagimli, figur yok' gerekcesiyle elenmisti. Ama yargi YALNIZ METNE bakilarak verilmisti. Olculdu: kiro2_temp'te question_image_url 34.901/34.982 (%99,8) dolu; d-dataset/output/crops altinda 528.651 PNG var ve container'a /app/static/crops olarak BAGLI; 6 sorunun 6'sinda da dosya diskte MEVCUT. Iki gorsel acilip bakildi (eskenar ucgen boyali bolgeler, A x B kartezyen grafigi) ve ikisi de soruyu KURTARIYOR. Yani %65 rakamý bir TABAN, %75 tavan. Bu, canli kapiyla en keskin farklardan biri: canlida question_image_url 0/27.073 -> orada 'figur yok' gercek kusur, kiro2_temp'te DEGIL. Kural: 'bu soru yanitlanamaz' demeden once sorunun TASIDIGI TUM varliklari (gorsel, pasaj, tablo) kontrol et; metin tek basina sorunun tamami olmayabilir. Yargilayan da bir olcum aletidir ve kendi kor noktasi vardir"
- id: L-s232-mekanik-siralamayi-insan-yargisiyla-dogrula
  baslik: "Ucuz bir metrikle KUME elemeden once, o metrigin insan yargisini ONGORDUGUNU dogrula"
  kaynak: docs/audits/2026-08-19_y11_kaynak_olcumu.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S232 — 60'lik orneklemde ayni kitaptan CIFT bozuk soru cikti (Neofizik Fizik 2/2, Esen Aps Tarih 2/2, Aramot Fen 2/2). Buradan makul bir hipotez kuruldu: cop KITAP duzeyinde yogunlasmis olabilir -> deterministik kitap elemesi ucuz ve geri alinabilir bir filtre olur. Uygulanmadan ONCE kontrol kolu kosuldu: Y12'nin dogrulanmis 6 kurali 350 kitaba tek tek uygulandi ve insan-bozuk kitaplarin MEKANIK SIRASI arandi. CURUDU: Neofizik %3,7 (sira 80/350), Esen Aps Tarih %1,8 (127/350), Aramot Fen %1,6 (135/350) -- hepsi ortalarda. Mekanik olarak EN KIRLI kitaplar (%24,6'ya kadar) Turkce/Dil Bilgisi/Paragraf kitaplariydi ve orneklemde ozellikle bozuk cikmamislardi. Yani kitap elemesi gercek copu YERINDE BIRAKIP muhtemelen saglam kitaplari atardi. Genel mekanik bayrak %2,40 iken insan yargisiyla cop %21,7 -- 9 kat boslugu. Kural: bir siralama/skor ile TOPLU eleme yapmadan once, o skorun elle dogrulanmis ornekleri ONGORDUGUNU olc. Ongormuyorsa skor o is icin kordur; hipotezi CURUTMEK uygulamaktan ucuzdur"
- id: L-s232-tur-kimligi-sonuc-semasinda-olmali
  baslik: "Paralel turlari AYIRT etmek istiyorsan tur kimligini SONUC SEMASINA koy — harness etiketi hash olabilir"
  kaynak: docs/audits/2026-08-19_y11_kaynak_olcumu.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S232 — kor cozumde iki bagimsiz tur tasarlandi (A: dogrudan cozum, B: eleme) cunku deponun kayitli dersi 'same-model DISPUTE != DB hatasi; ikinci sinyal sart' diyor. 8 ajanin 8'i dondu, 128 kayit uretti. Ama turlar AYRISTIRILAMADI: workflow journal'inda `key` alani hash (`v2:35c02da1...`), ajanin `label`'i sonuc nesnesinde yok, ve script'in koydugu `is` alani journal'a tasinmamis. Iki tur ayni sozluge yazip uzerine bindi -> turA=64, turB=0. Sonuc: tur-arasi anlasmazlik sinyali URETILEMEDI ve olcum tek kor tur olarak raporlandi. Kritik nokta: bu bir BULGU gibi gorunuyordu ('turB bos') ama ALET ARIZASIYDI. Kural: paralel turlari ayirt etmen gerekiyorsa tur kimligini ajanin DONDURDUGU semanin icine zorunlu alan olarak koy (orn. `tur: {enum: [A,B]}`); harness'in etiketleme mekanizmasina guvenme"
- id: L-s232-cevap-harfi-sik-listesi-olmadan-anlamsizdir
  baslik: "`correct_answer` bir DEGER degil, sik listesine KONUMSAL referanstir — govdeye gore eslestirip harf karsilastirmak fantom celiski uretir"
  kaynak: backend/scripts/quality/y11_celiski_curutme.sql
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S232-C — kiro2_temp'te mukerrer olcumu yapildi: `question_text` normalize edilip gruplandi, sonra grup icinde `count(DISTINCT correct_answer) > 1` olanlar 'korpus kendi kendiyle celisiyor' diye raporlandi. Sonuc etkileyiciydi: '118 metin, ayni soru farkli anahtar -> BEDAVA deterministik anahtar-hatasi dedektoru, LLM gerekmiyor'. Esik kontrolu (metin<80 karakter 'supheli birlesim') yapilirken SUPHELI orneklerinin 'ayni govde FARKLI SIKLAR' oldugu goruldu ve ayni riskin MUKERRER sinifinda da olabilecegi fark edildi. Olculdu: yalniz govde -> 669 fazlalik; govde+SIKLAR -> **153** fazlalik; yani **516 mesru soru YANLISLIKLA silinecekti** (%77). Ve govde+sik ayni olan gruplarda farkli anahtar tasiyan grup sayisi **0** -> '118 celiski' iddiasi TAMAMEN FANTOM. Cift kontrolu: ayni ucgen sorusunun iki satiri, biri A) 24 B) 30 C) 36... anahtar=B, digeri A) 30 B) 40 C) 50... anahtar=A -> **ikisi de 30'u isaret ediyor** (10x6/2=30, dogru). Harfler farkli cunku SIK SIRASI farkli. Kural: soru esitligi/celiskisi olcerken govde TEK BASINA yetmez; `correct_answer` karsilastirmasi ancak sik listeleri de ayni ise anlamlidir. Genel hali: bir alanin degeri baska bir alanin SIRASINA bagliysa, o iki alan ayrilamaz. Ilgili: [[L-s232-kendi-yargin-da-bir-olcum-aletidir]] — orada da yargi eksik girdiyle verilmisti (metne bakip figuru gormemek)"
- id: L-s232-bulguyu-degil-aleti-sina
  baslik: "Carpici bir bulgu geldiginde once ALETI sina — 'bedava dedektor buldum' iki kez ustuste alet arizasi cikti"
  kaynak: docs/audits/2026-08-19_y11_kaynak_olcumu.md
  sinif: surec
  durum: aktif
  zorlayici: null
  kanit: "S232 boyunca UC kez 'carpici bulgu' cikti ve UCUNDE de asil sorun ALETTEYDI. (1) 'Y12 bekcisi 8 xfailed, dogru calisiyor' -> kontrol kolu (kiro2_temp) kosulunca IKI kusur cikti: I4 iki kolda da dusuyordu (kor dedektor), K2 esigi bilinen-IYIYI reddediyordu. (2) 'KIMYA-555 metni kesik, olculemedi' -> kesen korpus degil BENIM cikarma script'imdi (`[:700]`); gercek metin 1076 karakter ve tam, ve cozulunce DB anahtarinin yanlis oldugu goruldu -> kendi olcum hatam bir kitap hatasini GIZLEMISTI. (3) '118 kendi-kendini celen cift, bedava anahtar dedektoru' -> normalizasyon yalniz question_text'e bakiyordu; siklar dahil edilince celiski sayisi 0, ve 516 mesru soru yanlislikla silinecekti. Ortak desen: bulgu ne kadar carpiciysa, aletin o bulguyu URETMIS olma ihtimali o kadar yuksek. Yordam: (a) bulguyu dogrulamadan once aleti bilinen-iyi girdiyle sina, (b) 'bedava/kolay kazanc' iddialarina ekstra suphe uygula, (c) aletin GORMEDIGI alanlari say (govde var ama sik yok; metin var ama figur yok)"
- id: L-s232-enforcement-listesi-defterden-turetilmeli
  baslik: "Bir dersi 'zorunlu' yapan sey defterdeki `zorlayici` alani DEGIL, o alanin bir kapiyi BESLEMESIDIR"
  kaynak: backend/hooks/ders_zorlayici_kos.py
  sinif: surec
  durum: aktif
  zorlayici: backend/tests/unit/test_ders_zorlayici_hook.py
  kanit: "S231 olctu: 141 dersin 40'inda (%28) `zorlayici` doluydu ama o zorlayicilarin **%0'i otomatik kosuyordu** — pre-commit'te test hook'u 28 Tem'de kaldirilmis, CI yalnizca main/master'da tetikleniyor, dal ise feature/self-evolution-optimization. Yani defter 'bu ders korunuyor' diyordu ve KORUNMUYORDU; dersler yalnizca AJAN BAGLAMI uzerinden isliyordu (baglam kaybinda sessizce sifira duser). S232'de 18 zorlayici dosyasi tek tek kosuldu: 17 yesil, 1 kirmizi (hacim bekcisi 36.967 < 150.000 — GERCEK alarm, xfail(strict=True) ile isaretlendi). Hook (`ders_zorlayici_kos.py`) pre-push'a baglandi. KRITIK TASARIM KARARI: liste ELLE YAZILMADI, defterden TURETILIYOR — cunku elle yazilan liste bayatlar ve enforcement gerilerken sayi dogru gorunur (`L-s219-ilerleme-sayaci-da-bir-olcum-aletidir`). Boylece 'bir derse zorlayici yazmak' = 'onu kapiya baglamak'; defter dokumantasyon degil YUK TASIYAN yapi olur. Kapi iki yonde de mutasyonla sinandi: defter var olmayan dosya gosterince exit 1, bekci kirmizi olunca exit 1, mutasyonsuz exit 0 (155 passed/3 skipped/8 xfailed, 45 sn). Bos liste de HATA sayilir (yanlis-sifir = alet arizasi). Kural: bir dersin 'zorunlu uygulandigini' iddia etmeden once **kapinin o dosyayi fiilen kostugunu** olc; `zorlayici` alani dolu olmasi tek basina hicbir sey kanitlamaz"
- id: L-s232-boru-hattinda-exit-kodu-SON-komutundur
  baslik: "`komut | tail` sonrasi `$?` boru hattinin SON halkasini olcer — 'EXIT 0' yanlis-pozitifi commit'i basarili gosterdi"
  kaynak: .claude/rules/audit-methodology.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S232 — enforcement commit'i `git commit -F ... 2>&1 | tail -25; echo EXIT: $?` ile calistirildi ve **EXIT: 0** yazdi. Gercekte `git commit` **exit 1** ile dusmustu (kapinin ruff'i 3 bulgu verdi); `$?` `tail`'in kodunu olcuyordu ve tail her zaman 0 doner. Yakalayan sey sans degil disiplindi: `L-s229-commit-yarim-gidebilir` geregi `git show --stat HEAD` kosuldu ve HEAD'in HALA eski commit oldugu goruldu. Yani deponun bir dersi, baska bir dersin olcum aletindeki arizayi yakaladi. Bu, `L-s224-amend-sessizce-iptal-olur` ile ayni sinif: **basarili gorunen bir kabuk ciktisi, komutun basarili oldugunu gostermez**. Yordam: cikis kodu onemliyse boru KULLANMA — `komut > /tmp/out.txt 2>&1; KOD=$?` yaz, sonra dosyayi ayri oku. Ya da `set -o pipefail` / `${PIPESTATUS[0]}`. Genel hali: **olcum aletinin kendisi olculmeden bulgu bildirilmez** ve bu depoda kabuk borusu tekrar eden bir alet arizasi kaynagi"
- id: L-s233-pg-dump-t-yedegi-kendi-kendine-yeterli-degil
  baslik: "`pg_dump -t <tablo>` yedegi enum/uzanti TIPLERINI tasimaz — 'satir sayildi' geri yuklenebilirlik kaniti DEGILDIR"
  kaynak: backend/scripts/quality/yedek_onkosul_uret.py
  sinif: sema
  durum: aktif
  zorlayici: backend/tests/db/test_yedek_onkosul_kapsami.py
  kanit: "S233 (19 Agu) — S232-G bir yedek alip 'DOGRULANDI: dump icinde 147.880 satir' demisti ve bu olcum DOGRUYDU: dump'in ICERIGI birebir sayildi. Ama yedek bir felakette GERI YUKLENEBILIR olmali; o hic denenmemisti. Bos bir hedefe pg_restore kosuldu ve DUSTU: `ERROR: type public.questiondifficultylevel does not exist` -> question_statistics TABLOSU HIC OLUSMADI -> 36.967 satir HIC YUKLENMEDI. 5 tablodan 4'u yuklendi, biri tamamen kayboldu ve pg_restore yalnizca EXIT=1 dedi (hata satirlari da Turkce locale'de `pg_restore: hata` yaziyordu, `error` grep'i 0 buldu -- bkz L-s233-aletin-cikti-dili-kor-nokta). Sebep: `-t` ile alinan dump, tablonun bagli oldugu KULLANICI TIPLERINI ve UZANTI TIPLERINI icermez. Tip eklenince IKINCI katman cikti (`public.vector`, pgvector) -> tek tek kesif yerine pg_catalog'dan SISTEMIK cikarildi (`L-s202-katmanli-hata-sistemik-tara`), bagimliliklarin tamami 2 tane. Onkosul dosyasi URETILDI (elle yazilmadi, `L-s202-ddl-orm-den-render`) ve ikinci prova 147.894/147.894 ile gecti. Bu, `L-s202-drop-table-enum-birakir` dersinin YEDEK ayagi. Kural: bir yedegi 'dogrulandi' saymadan once GERCEK bir hedefe pg_restore et; icerik sayimi ile geri yuklenebilirlik AYRI iki olcumdur. Bekci uretece bagli, dosyaya degil -- backups/* gitignore'da ve taze klonda anlamsiz olurdu"
- id: L-s233-devir-notundaki-engelleyici-de-olculur
  baslik: "Devir notundan tasinan bir ENGELLEYICI de bir iddiadir — 'parolam yok' iki oturum boyunca olculmeden tasindi"
  kaynak: .claude/rules/audit-methodology.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S233 — S232-G ve S232-H handoff'lari 'kiro2_app CREATE TABLE yetkisiz; DDL gereken is icin postgres parolasi lazim, ELIMDE YOK' engelleyicisini tasiyordu ve bu, planin FAZ 0'ini (yedek restore + matview REFRESH + backup tablo) bloke eden tek kalemdi. Hic olculmemisti. Tek komut cozdu: `grep -vE '^#|^$' pg_hba.conf` -> `local all all trust`, `host all all 127.0.0.1/32 trust`. PAROLA GEREKMIYOR. Kanit: `psql -U postgres -d kiro2 -c 'SELECT current_user, usesuper'` -> `postgres|t`, EXIT=0; kontrol kolu ayni komut kiro2_app ile -> `kiro2_app` (ayrim yapiyor). Uc P0 aninda kalkti. Bu, `audit-methodology.md#SEVERITY DE BIR OLCUMDUR` dersinin ENGELLEYICI ayagi: o bolum 'acil/P0/kritik/guvenli' iddialarini kapsiyordu ama 'X yapilamaz cunku Y yok' bicimindeki engelleyicileri kapsamiyordu ve o bosluktan dusuldu. Kural: bir engelleyiciyi devralirken sor -- bu iddianin yanlis oldugunu gosterecek TEK komut nedir? Ozellikle 'yetkim yok / erisimim yok / arac kurulu degil' sinifinda, cunku bunlar ORTAMA baglidir ve ortam degisir. YAN BULGU (ayri acik is, P1): trust yalniz localhost degil docker agi (172.17/172.18) ve LAN (192.168.65.0/24) icin de acik"
- id: L-s233-aletin-cikti-dili-kor-nokta
  baslik: "Dedektor grep'i aracin CIKTI DILINE bagli olabilir — Turkce locale'de `pg_restore: hata`, `error` degil"
  kaynak: .claude/rules/audit-methodology.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S233 — pg_restore EXIT=1 dondu ve hatalari saymak icin `grep -c '^pg_restore: error'` kosuldu: sonuc 0. 'Exit 1 ama 0 hata' celiskisi fark edilmeseydi 'kucuk bir uyari' diye gecilecek ve KIRIK bir yedek 'dogrulandi' diye kaydedilecekti. Gercek sebep: bu kurulum Turkce locale'de calisiyor ve satirlar `pg_restore: hata: ERROR: ...` bicimindeydi. Dogru olcum grep'e degil SONUCA bakmakti: probe DB'de `SELECT count(*) FROM question_statistics` -> `relation does not exist`, yani tablo HIC olusmamisti. Ayrica ayni dosyada `grep` ciktiyi BINARY sandi (Turkce karakter) ve `-a` gerekti. Bu, `L-s219-yanlis-sifir` ailesinin dil ayagi: 0 bulundu bir BULGU degil ALET ARIZASI adayidir. Kural: bir aracin ciktisini desenle sayacaksan once o desenin GERCEKTEN eslestigini bilinen-pozitif bir ornekle goster; locale/dil, renk kodlari ve satir sarmasi deseni sessizce bozar. Daha guvenlisi: aracin metnini degil ISINI olc (tablo olustu mu, satir yuklendi mi)"
- id: L-s233-bekci-dosya-sayimi-assert-sayimi-degil
  baslik: "'N bekci her push'ta kosuyor' bir DOSYA sayimidir — o dosyalarin ASSERT ettigini ayrica olc"
  kaynak: backend/hooks/ders_zorlayici_kos.py
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/unit/test_ders_zorlayici_hook.py
  kanit: "S233 — S232-H 'enforcement KAPANDI: %0 kosan -> 19 bekci her push'ta' diye kapatmisti ve 19 dosya gercekten kosuyordu. Ama `tests/db/test_question_bank_invariants.py` her push'ta `sss` (3 skipped, EXIT=0) veriyordu: DSN ve KIRO2_STRICT_DB_INVARIANTS yoktu. Yani hacim ve benzersizlik invaryantlari -- 5 Agu icerik kaybinin bekcileri, tam da Y11 gocu sirasinda ihtiyac duyulacak olanlar -- KAPALIYDI ve kapi YESIL gorunuyordu. Fix: hook DSN'i backend/.env'den cozup enjekte ediyor. Olculdu: kapi 172 passed/3 skipped/8 xfailed -> 182/0/9. Sayinin AYRISTIRMASI onemli (`L-s229-maskenin-altinda-maske`): +2 fix'in gercek kazanci, +8 ayni commit'te yazilan yeni testler. Mutasyon 2/2: DSN'i kaldir -> 3 skipped (bekci KOR), esik 0.90->0.99 -> 1 failed `assert 0.9286661076094895 >= 0.99` (bekci OLCUYOR). Yalniz birincisi kosulsaydi hicbir sey assert etmeyen bir bekci de yesil gorunurdu. Kural: enforcement iddiasini uc kademede olc -- (a) dosya kapida mi, (b) testler KOSUYOR mu (skip degil), (c) kostuklarinda gercekten ASSERT ediyorlar mi. S231 (a)'yi, S232 (b)'yi kismen, S233 (c)'yi kapatti"
- id: L-s233-commitsiz-dosya-mutasyona-sokulmaz
  baslik: "Yeni (takipsiz) bir dosyada `git checkout HEAD --` geri alimi CALISMAZ — mutasyonlar ust uste biner"
  kaynak: .claude/rules/verification.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S233 — A2b'nin mutasyon bataryasi henuz COMMIT EDILMEMIS bir script uzerinde kosuldu. Her turdan sonra `git checkout HEAD -- <dosya>` cagriliyordu ve `error: pathspec ... did not match any file(s) known to git` ile DUSTU: dosya git'in bilmedigi yeni bir dosyaydi. Sonuc: M1 geri alinmadi, M2 onun USTUNE bindi ve M2'nin '3 failed' ciktisi aslinda M1+M2 birlesimiydi -- GECERSIZ olcum. M1 (temiz baseline'da kosan) gecerli kaldi. Kural zaten yaziliydi ve ihlal edildi: `verification.md#GERI-ALIM-BIR-IDDIADIR` -> 'Mutasyondan ONCE commit et. Commit'siz isi mutasyona sokma.' (S226'da veri kaybi olarak yasanmisti; burada veri kaybi olmadi cunku geri alim dogrulamasi `git status --porcelain` ile yapiliyordu ve BASARISIZ dedi). Iki ek gozlem: (1) harness'in `assert count == 1` ankraj kontrolu M3'u dogru sekilde REDDETTI -- kabuk `\\n`'i literal ters-bolu-n olarak gecirmisti, yani ankraj hic eslesmedi ve 'uygulandi' yalani uretilmedi (`L-s229-mutasyon-reddedilmis-olabilir`); (2) geri alim BASARISIZ raporlandigi icin kayip fark edildi -- sessiz bir geri alim daha pahaliya mal olurdu. Yordam: yeni dosyayi ONCE commit et, mutasyonu SONRA kos; ya da geri alimi git'e degil dosya iceriginin baytina dayandir"
- id: L-s233-split-1e1-yapisal-garanti-degil-kismi-insert-sessizdir
  baslik: "4-tablo split'te 1:1 hicbir kisitla zorlanmiyor — yavrusuz ebeveyn satiri kapida GORUNMEZ ama tabloda DURUR"
  kaynak: backend/tests/db/test_soru_tablolari_parity.py
  sinif: sema
  durum: aktif
  zorlayici: backend/tests/db/test_soru_tablolari_parity.py
  kanit: "S233 (A4) — S210'un 69-alan split'i question_bank'i dorde ayirdi ama 1:1'i zorlayan HICBIR YAPI yok: (a) `INSERT INTO question_statistics` depoda hicbir yerde YOK (S222 olctu; backfill yok, split migration'i da yok), (b) FK yonu cocuk->ebeveyn ON DELETE CASCADE -- yetim COCUGU yasaklar, her ebeveynin cocugu olmasini SART KOSMAZ, (c) hedef tablolarda 0 trigger, (d) `rowcount` hicbir yazim noktasinda kontrol edilmiyor. Sonuc: question_bank'a yazip yavruya yazmayan bir yol SESSIZCE yarim satir birakir; o satir ogrenci kapisinda GORUNMEZ (v_safe_for_beta LEFT JOIN'liyor -> quality_review_status NULL -> elenir), question_bank'ta DURUR ve hacim sayimini sisirir, ve HICBIR TEST GORMEZ -- 19 Agu olcumu: parity/yetim assert eden test sayisi depoda 0 (grep). Bekci 6 yonlu (her yavru icin yetim-yavru + yavrusuz-ebeveyn). JOIN anahtari `c.id = qb.id`: yavru tablolarin PK'si `id` ve AYNI ZAMANDA parent'a FK; `question_id` adinda kolon HICBIRINDE yok (`L-s230-yavru-tablonun-pk-si-id`, ad tahmini bu semada bir kez yanlis fix uretti). ONEMLI: bu bekci dogustan YESIL cikti cunku invaryant bugun sagam (36.967 x 4, yetim 0) -- yani RED->GREEN yok. Boyle bir bekcinin yuk tasidigini yalnizca KONTROL KOLU ve MUTASYON gosterebilir, o yuzden ikisi de kalici olarak dosyada: sentetik yetim testi (VALUES ile, yazma YOK) `LEFT JOIN ... IS NULL` deseninin GORDUGUNU kanitlar; bos-tablo testi vakum-yesili engeller (5 Agu'da tablo 187.835->2.304 dustugunde hacim testi kirmizi verirken parity testi YESIL kalacakti)"
- id: L-s233-curutucunun-bulgusu-da-bir-iddiadir
  baslik: "Adversarial ajanin bulgusu da bir IDDIADIR — testin HANGI POPULASYONU olctugu sorgudan OKUNUR"
  kaynak: docs/audits/2026-08-19_y11_adim2-4_uygulama_plani.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S233 (A5) — 8 ajanli olcum turunun adversarial elestirmeni 8 P0 buldu ve 7'sinde HAKLIYDI (soru_hash UUID4, kapi is_active filtrelemiyor, 11 FK CASCADE, bayat yedek, 3/3 SKIP, REFRESH yetkisi, embedding 768/1536). P0-6'da ise CIKARIM yapti: 'Y12'nin 8 xfail'inden 4-5'i INSERT aninda XPASS verir, yani gocu yapan commit kendi pre-push kapisini kirar.' Bu, testlerin `question_bank`'i olctugu VARSAYIMINA dayaniyordu ve plana bir 'once veriyi yaz, sonra xfail'leri kaldir' adimi ekletti. OLCULDU ve CURUDU: kaynak sayimi `FROM mv_safe_for_beta` = 7, `FROM question_bank qb` = 1 (o da i6'nin ikinci ayagi). Yani i1-i5 ve k2'lerin hepsi KAPIYI olcuyor, tabloyu degil; `pending` yazilan satir ne kapiya girer (status filtresi) ne matview yenilenir -> hicbiri degismez. i6 icin DOGAL DENEY kosuldu: canlida ZATEN 9.894 `pending` satir var ve kapida OLANI 0; i6'nin IN listesine 'pending' eklenince sayi 0 -> 9.894 firliyor, eklenmeyince 0 kaliyor. Yani gelecekteki goc satirlarinin davranisi bugun olculebilir durumdaydi. Sonuc: 8 xfail'in 8'i de FAZ D'yi sag atlatir; xfail kaldirma isi tamamen FAZ E'ye (terfi) kayar. Olculmeseydi FAZ D'ye GEREKSIZ bir adim eklenecek ve o adim testleri GERCEKTEN kiracakti. Kural: bir curutucu/hakem/elestirmen ajanin ciktisi bulgu degil ADAY bulgudur; ozellikle 'su test su durumda kirilir' bicimindeki ONGORULER, testin fiilen sorguladigi tabloyu/kolonu okuyarak dogrulanir. Kardes ders: L-s232-bulguyu-degil-aleti-sina (orada alet benim script'imdi, burada bir AJAN)"
- id: L-s233-iki-sinifi-AYRI-olc-karistirici-cakisir
  baslik: "Bir sinif iddiasini test ederken KARISTIRICI degisken sinif degiskeniyle cakisabilir — iki sinifi AYRI AYRI ve cok katmanda olc"
  kaynak: docs/audits/2026-08-19_y11_adim2-4_uygulama_plani.md
  sinif: olcum
  durum: aktif
  zorlayici: null
  kanit: "S233 — `question_image_url` tasinsin mi karari icin gorsel sizintisi olculdu ve olcum IKI KEZ yon degistirdi. (1) TEK tam-sayfa goruntusu acildi, uzerinde 6 sorunun cevabi pembe daire icindeydi -> '_PAGE sinifinin %57,8'i sizdiriyor' denildi. YANLIS: acilan sayfa, sonradan el yazisiyla isaretli oldugu anlasilan TEK kitaptandi (Apotemi 2024 Ayt Kimya SB) -- karistirici (kitap) sinif degiskeniyle (PAGE/crop) CAKISMISTI. (2) 32 tekil crop, 16 kitaba yayilarak kor okundu: 30/30 temiz, sizintili 2'nin 2'si de o ayni isaretli kitaptan -> 'sizinti KITAP-kosullu' denildi. Kismen dogru ama PAGE'i aciklamiyordu. (3) 26 tam-sayfa, 27 ISARETSIZ kitaptan kor okundu: **23/26 sizintili (%88,5)** ve mekanizma tamamen farkli cikti -- el yazisi degil, YAYINEVININ SAYFA ALTINA BASTIGI CEVAP ANAHTARI seridi ('Soru 21a/ D', '1.E 2.E 3.A', biri 180 DERECE TERS basili, 'Ornek' sorularinda tam cozum + 'Cevap: B'). Sayfa basina ortalama 5,2 soru -> bir sayfa sizdiginda 5 sorunun cevabi birden aciliyor. Temiz cikan 3 sayfada serit kirpma disinda kalmisti (sans, tasarim degil). Crop'larin temiz olmasinin sebebi de ayni: kirpma siniri alt seridi disarida birakiyor. Yani UC ayri sizinti sinifi vardi (basili anahtar = sinif-kosullu · basili cozum = soru-tipi-kosullu · el yazisi = kitap-kosullu) ve tek orneklem hicbirini dogru gostermiyordu. Kural: bir SINIF iddiasini (bu sinif guvenli/guvensiz) test ederken orneklemi sinifin ICINDE de katmanla; tek katmandan (tek kitap, tek sayfa, tek yayinevi) cikan sonuc siniftan cok karistiriciyi olcuyor olabilir. Ipucu: iki alt-sinif AYNI yonde sonuc veriyorsa ama MEKANIZMA aciklamalari farkliysa, henuz dogru degiskeni bulmamissindir. Ilgili: [[L-s232-kurtarma-kaynagi-da-olculur]] (kucuk orneklem vekil), [[L-s232-kendi-yargin-da-bir-olcum-aletidir]]"
- id: L-s233-ayni-linter-iki-config-kural-ailesi-secili-degil
  baslik: "Ayni ruff, IKI pyproject, farkli kural ailesi — kok config'te `N` YOK, backend'de VAR; kanca ciktiyi da atiyor"
  kaynak: pyproject.toml
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: 'S233 — ayni oturumda BES kez ayni lint hatasini (N802, BUYUK harfli test adi) yaptim; her seferinde ancak COMMIT aninda gordum ve toplam 28 test yeniden adlandirildi. Kok neden ezbere degil olculdu, iki kademe: (1) `.claude/hooks/post-edit-format.py:46-52` her Edit/Write sonrasi `ruff check --fix --quiet` kosuyor ama `capture_output=True` + `--quiet` -> bulgular TAMAMEN ATILIYOR, ustelik N802 auto-fix EDILEBILIR DEGIL, yani `--fix` onu zaten duzeltemez. (2) Daha temeli: `pyproject.toml` (kok) `select = [E,W,F,I,B,C4,UP,ARG,SIM]` -- `N` YOK; `backend/pyproject.toml:143` ise `select` icinde `"N"` (pep8-naming) TASIYOR. Yani ayni linter, ayni dosya, iki config ve **iki farkli kural kumesi**. Bu, `reference_precommit-vs-bare-linter` (yanlis CWD -> yanlis config) ve `L-s224-arac-surumu-giris-noktasina-bagli` (yanlis giris noktasi -> yanlis SURUM) ailesinin UCUNCU uyesi: yanlis config -> yanlis KURAL AILESI. OLCUM ALETI ARIZASI DA YASANDI: kontrol kolu icin dosyaya kasitli bir N802 enjekte edilmeye calisildi, uc kol da EXIT=0 verdi ve bu ''kanca gormuyor'' diye okunacakti; ama once `''def ... BOS_DONER('' in metin` ile dogrulandi -> **False**, yani enjeksiyon hic uygulanmamisti. Kontrol kolu beklediğini vermiyorsa olcum bitmistir (`audit-methodology.md#OLCUM-ALETINI-DOGRULA`). KARAR: kanca DEGISTIRILMEDI. Gerekce `#451` deseni -- kapi N802''yi 5/5 yakaladi, yani enforcement eksik degil; eksik olan ERKEN sinyal. Bir hole''un varligi kapatmak icin yeterli gerekce degildir, kapatmanin bedeli de olculur: kancayi oturum kapanisinda, testsiz ve gurultu olcumu yapilmadan degistirmek yeni bir sessiz kusur sinifi acabilirdi. Olcum kayitli, degisiklik AYRI IS (handoff''ta Y13).'
- id: L-s233-benzerlik-metrigi-TERS-calisabilir
  baslik: "Karakter-benzerligi bu korpusta TERS calisiyor: en YUKSEK benzerlik FARKLI soru, ORTA benzerlik AYNI soru"
  kaynak: backend/scripts/quality/y11_dedup.py
  sinif: olcum
  durum: aktif
  zorlayici: backend/tests/fast/test_y11_dedup.py
  kanit: "S233 — dedup icin uc yontem 3.666 KABUL satirinda karsilastirildi: GOVDE-ONLY 74 grup/79 fazlalik · GOVDE+SIK sirali (SIKI) 16/16 · GOVDE+SIK sirasiz 17/17. Iki olcum CELISMIYOR, FARKLI SEY sayiyor (S233 olcum ajani 'benzersiz METNE' demis = govde-only). Farki olusturan 58 grup benzerlik oranina gore ayrildi ve metrik TERS cikti: benzerlik >=0,95 -> 32 grup ve bunlar FARKLI SORU; benzerlik 0,80-0,95 -> 11 grup ve bunlar AYNI SORU (yalniz `\\to` vs `\\rightarrow` LaTeX gosterimi); <0,80 -> 15 grup farkli sik kumeleri. Sebep OKUNARAK bulundu, tahmin edilmedi: 'yalniz I / I ve II / I ve III' ailesinde siklar KARAKTER olarak neredeyse ayni ama KUME olarak farkli (A: '...| ı ve ıı | ı ve ııı | ıı ve ııı' vs B: '...| ı ve ıı | ıı ve ııı | ı, ıı ve ııı'). KARAR: silme olcutu SIKI kimlik (16 grup); 58 grup RAPORLANIR, SILINMEZ. LaTeX-gosterimi normalizasyonu 11 grubu kurtarabilir ama kendi dogrulamasini GECMEDEN eklenmeyecek (32 farkli soruyu birlestirme riski). Regresyon bekcisi yazildi: biri ileride bulanik esleme eklerse `test_yalniz_i_ailesi_birlestirilmez_regresyon` DUSER. Kural: bir metrikle TOPLU eleme yapmadan once metrigin insan yargisini ONGORDUGUNU olc; ongormuyorsa metrik o is icin KORDUR ve daha kotusu YANLIS YONDE korduT. Ilgili: [[L-s232-mekanik-siralamayi-insan-yargisiyla-dogrula]], [[L-s232-cevap-harfi-sik-listesi-olmadan-anlamsizdir]]"
- id: L-s233-kendi-harness-in-alt-ajanin-girdisini-bozar
  baslik: "Alt ajana giden paketi kirpan bir satir, o ajanin raporunu 'veri eksik' diye yanlis yazdirir"
  kaynak: .claude/rules/audit-methodology.md
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S233 — 8 ajanli olcum turunda sentez ajani raporuna soyle basladi: 'Girdi olarak 6 olcum vaat edildi, fiilen 3 tam + 1 yarim geldi; olcum 5 ve 6 HIC GELMEDI.' Bu, ciddi bir bulgu gibi duruyordu (ajanlar duserse tur gecersiz olurdu). Journal okununca ALTI olcumun ALTISI da tam ve yapisal semayla donmustu; eksiklik benim workflow script'imdeki `JSON.stringify(gecerli).slice(0, 60000)` satirindan geliyordu -- paket kesilmis, sentezci de kesilen yerden sonrasini 'gelmemis' saymisti. Yani ALT AJANIN RAPORUNDAKI KUSUR, ONU CAGIRAN HARNESS'IN KUSURUYDU. Iki sonucu var: (1) bir ajanin 'veri eksik/gelmedi' bildirimi once HARNESS'te aranir, ajanda degil; (2) kirpma sessiz olmamali -- kesildiyse pakete acik bir isaret konmali ('...[KESILDI: N kalem]') ki ajan 'gelmedi' ile 'kesildi'yi ayirabilsin. Bu, `L-s232-bulguyu-degil-aleti-sina` dersinin ORKESTRASYON ayagi: orada alet bir SQL/script'ti, burada ajanin GIRDISINI hazirlayan kod."
