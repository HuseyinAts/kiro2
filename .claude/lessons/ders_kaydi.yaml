- id: L-s224-arac-surumu-giris-noktasina-bagli
  baslik: "`ruff --version` KAPININ surumu degildir — ayni aracin uc surumu var ve kapiyi EN ESKISI tutuyor"
  kaynak: .claude/rules/audit-methodology.md#ayni-aracin-uc-surumu-var-ve-kapiyi-en-eskisi-tutuyor-17-agu-2026-s224
  sinif: alet
  durum: aktif
  zorlayici: null
  kanit: "S224 — reference_precommit-vs-bare-linter'in (yanlis CWD -> yanlis CONFIG) bir adim otesi: yanlis GIRIS NOKTASI -> yanlis SURUM. Uc ayri ruff ikilisi `--version` ile olculdu: (a) kabuk PATH'i ve PostToolUse kancasi (.claude/hooks/post-edit-format.py:48,53 CIPLAK `ruff` cagiriyor) -> 0.14.13; (b) `git commit` KAPISI, kok .pre-commit-config.yaml:37 `rev: v0.7.1`, izole venv ~/.cache/pre-commit/repobiv5dj3f -> 0.7.1; (c) backend/.pre-commit-config.yaml:7 `rev: v0.13.2` -> 0.13.2 ama commit aninda HIC YUKLENMIYOR (S219). Karari veren surum, baska hicbir giris noktasinin kullanmadigi EN ESKI olani. Kanca her Edit/Write sonrasi 0.14.13 ile bicimlendirdigi icin dongu kendi kendine kuruluyor: kapi 0.7.1 ile YENIDEN bicimlendirip 'files were modified by this hook' + EXIT 1 veriyor. Yordam: `pre-commit run ruff-format --files <dosya>` (kapinin surumu) -> ikinci kez kos, 'Passed' = sabit nokta -> `git add` + amend"
