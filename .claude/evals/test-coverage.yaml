# Test Coverage Evaluation
# KIRO2 test coverage değerlendirmesi

name: test-coverage
description: Test coverage evaluation
version: "1.0.0"

triggers:
  - on: commit
    branches: [main, develop, "feature/*"]
  - on: pull_request
    branches: [main, develop]
  - on: schedule
    cron: "0 6 * * *"  # Daily 06:00 UTC

environment:
  working_dir: "."
  python_version: "3.11"
  node_version: "20"

checks:
  - name: pytest-coverage
    description: Backend Python test coverage
    command: |
      cd backend && pytest --cov=. --cov-report=term-missing --cov-report=json --cov-fail-under=60 -q
    threshold: 60
    weight: 40
    timeout: 300000
    artifacts:
      - backend/coverage.json
      - backend/htmlcov/

  - name: frontend-coverage
    description: Frontend React test coverage
    command: |
      cd frontend && npm test -- --coverage --watchAll=false --coverageReporters=json-summary
    threshold: 70
    weight: 30
    timeout: 180000
    artifacts:
      - frontend/coverage/coverage-summary.json

  - name: integration-tests
    description: API integration tests
    command: |
      cd backend && pytest tests/integration/ -v --tb=short -q
    weight: 20
    timeout: 300000
    required: true

  - name: e2e-tests
    description: End-to-end tests (optional)
    command: |
      cd frontend && npm run test:e2e || true
    weight: 10
    timeout: 600000
    required: false

coverage_thresholds:
  global:
    statements: 60
    branches: 50
    functions: 60
    lines: 60

  per_module:
    backend/services:
      statements: 80
      branches: 70
    backend/api:
      statements: 75
      branches: 65
    frontend/src/components:
      statements: 70
      branches: 60
    frontend/src/services:
      statements: 80
      branches: 70

scoring:
  pass: 80
  warn: 60
  fail: 0

  grade_scale:
    A: 90
    B: 80
    C: 70
    D: 60
    F: 0

reporting:
  format: json
  output: .claude/evals/results/test-coverage-{timestamp}.json

  github:
    enabled: true
    comment: true
    check_run: true
    badge: true

  slack:
    enabled: false
    webhook: "${SLACK_WEBHOOK_URL}"
    on: [fail, warn]

notifications:
  on_fail:
    - type: github_comment
      message: "❌ Test coverage below threshold. Current: {coverage}%, Required: {threshold}%"
    - type: email
      to: team@kiro2.com

  on_warn:
    - type: github_comment
      message: "⚠️ Test coverage is low. Current: {coverage}%, Recommended: {threshold}%"

  on_pass:
    - type: github_status
      state: success
      description: "✅ Test coverage: {coverage}%"

exclusions:
  paths:
    - "**/tests/**"
    - "**/test_*.py"
    - "**/__pycache__/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/htmlcov/**"

  patterns:
    - "# pragma: no cover"  # Sadece gerekli durumlarda!
    - "if TYPE_CHECKING:"

metrics:
  collect:
    - test_count
    - test_duration
    - coverage_percentage
    - uncovered_lines
    - branch_coverage

  export:
    prometheus: true
    endpoint: /metrics/coverage
