# Security Evaluation - KIRO2
# OWASP Top 10 Compliance

name: security
description: Security evaluation against OWASP standards
version: "1.0.0"

triggers:
  - on: commit
  - on: pr
  - on: schedule
    cron: "0 0 * * 0"  # Weekly

checks:
  # Secrets Detection
  - name: secrets-scan
    description: Scan for hardcoded secrets
    command: |
      git diff --cached --name-only | xargs -I {} sh -c '
        grep -l "API_KEY\|PASSWORD\|SECRET\|TOKEN" {} 2>/dev/null && exit 1 || true
      '
    severity: critical
    weight: 25

  # SQL Injection
  - name: sql-injection
    description: Check for SQL injection vulnerabilities
    command: |
      grep -r "f\".*SELECT\|f\".*INSERT\|f\".*UPDATE\|f\".*DELETE" backend/ && exit 1 || true
    severity: critical
    weight: 20

  # Dependency Vulnerabilities
  - name: python-deps
    description: Check Python dependencies for vulnerabilities
    command: cd backend && pip-audit --strict
    severity: high
    weight: 15

  - name: npm-deps
    description: Check npm dependencies for vulnerabilities
    command: cd frontend && npm audit --audit-level=high
    severity: high
    weight: 15

  # Bandit Security Scan
  - name: bandit-scan
    description: Python security analysis with Bandit
    command: cd backend && bandit -r . -f json -o /dev/stdout
    severity: high
    weight: 15

  # Sensitive Files
  - name: sensitive-files
    description: Check for sensitive files in repo
    command: |
      find . -name ".env" -o -name "*.pem" -o -name "*.key" | grep -v ".env.example" && exit 1 || true
    severity: critical
    weight: 10

owasp_mapping:
  - A01:2021 - Broken Access Control: [secrets-scan]
  - A02:2021 - Cryptographic Failures: [sensitive-files]
  - A03:2021 - Injection: [sql-injection]
  - A06:2021 - Vulnerable Components: [python-deps, npm-deps]
  - A07:2021 - Auth Failures: [bandit-scan]

scoring:
  pass: 100
  warn: 80
  fail: 0

report:
  format: markdown
  output: .claude/evals/results/security-{date}.md
  include_owasp_mapping: true

notifications:
  on_fail: true
  on_critical: true
  webhook: ${SECURITY_WEBHOOK_URL}
