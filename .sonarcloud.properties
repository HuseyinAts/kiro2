# SonarCloud Configuration for Cloud-based Analysis
# This file configures SonarCloud integration for automatic code quality analysis

# Organization and project settings (update with your actual values)
sonar.organization=your-github-username
sonar.projectKey=your-github-username_teknofest-2025-egitim-eylemci

# Inherit from main sonar-project.properties
# This file supplements the main configuration for cloud deployment

# Branch analysis
sonar.branch.name=main
sonar.branch.target=main

# Pull request analysis
sonar.pullrequest.key=${GITHUB_PR_NUMBER}
sonar.pullrequest.branch=${GITHUB_HEAD_REF}
sonar.pullrequest.base=${GITHUB_BASE_REF}

# GitHub integration
sonar.links.homepage=https://github.com/your-username/teknofest-2025-egitim-eylemci
sonar.links.ci=https://github.com/your-username/teknofest-2025-egitim-eylemci/actions
sonar.links.scm=https://github.com/your-username/teknofest-2025-egitim-eylemci
sonar.links.issue=https://github.com/your-username/teknofest-2025-egitim-eylemci/issues

# Additional cloud-specific settings
sonar.host.url=https://sonarcloud.io