version: '3.8'

services:
  # Backend API (Minimal)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.minimal
    container_name: teknofest-backend
    ports:
      - "8000:8000"
    environment:
      - HUGGINGFACE_ENDPOINT=${HUGGINGFACE_ENDPOINT:-https://cf781mfqobm2ynkk.us-east-1.aws.endpoints.huggingface.cloud}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - USE_MOCK_RESPONSES=${USE_MOCK_RESPONSES:-false}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./vector_db:/app/vector_db
      - ./data:/app/data
    networks:
      - teknofest-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teknofest-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent node_modules from being overwritten
    depends_on:
      - backend
    networks:
      - teknofest-network
    restart: unless-stopped

networks:
  teknofest-network:
    driver: bridge

# No external volumes needed for minimal setup
# ChromaDB uses embedded mode
# Data is stored in-memory