# Pre-commit hooks for KIRO2 project
# Run: pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-docstring-first
        files: '\.py$'
      - id: debug-statements
        files: '\.py$'

  # Python - Ruff (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        name: Ruff linter
        args: ['--fix', '--exit-non-zero-on-fix']
        files: ^backend/.*\.py$
        exclude: ^backend/(alembic/versions/|migrations/)
      
      - id: ruff-format
        name: Ruff formatter
        files: ^backend/.*\.py$
        exclude: ^backend/(alembic/versions/|migrations/)

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-r, --skip=B101,B601]
        files: ^backend/.*\.py$
        exclude: ^backend/(tests/|.*test.*\.py)

  # Type checking with MyPy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: MyPy type checker
        additional_dependencies:
          - pydantic==2.5.0
          - sqlalchemy==2.0.23
          - fastapi==0.104.1
          - types-requests
          - types-passlib
          - types-PyYAML
          - types-python-dateutil
        args: [
          '--config-file=pyproject.toml',
          '--ignore-missing-imports',
          '--no-strict-optional',
        ]
        files: ^backend/.*\.py$
        exclude: ^backend/(tests/|.*test.*\.py|migrations/|alembic/)

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Jupyter notebooks (using ruff)
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.7.1
    hooks:
      - id: nbqa-ruff
        name: Ruff on notebooks
        args: ['--fix']
        files: '\.ipynb$'
      
      - id: nbqa-mypy
        name: MyPy on notebooks
        files: '\.ipynb$'

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [yaml]
        exclude: ^\.github/workflows/

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck

  # KIRO2 Custom Hooks
  - repo: local
    hooks:
      # SECURITY: Custom secret detector for KIRO2-specific patterns
      - id: kiro2-secret-detector
        name: KIRO2 Secret Detector
        entry: python backend/hooks/secret_detector.py
        language: system
        types: [python]
        pass_filenames: true
        stages: [commit]
        verbose: true

      - id: pytest-changed
        name: Pytest on changed files
        entry: pytest
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        args: [-x, --tb=short, -q, backend/tests/]

      - id: reward-hacking-check
        name: Reward Hacking Prevention (Daisy Stanton Standards)
        entry: python -m backend.hooks.reward_hacking.cli
        language: system
        types: [python]
        pass_filenames: true
        always_run: false
        stages: [pre-push]
        verbose: true

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

# Configuration
default_language_version:
  python: python3.11

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false