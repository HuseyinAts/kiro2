# Pre-commit hooks for KIRO2 project
# Run: pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-docstring-first
        files: '\.py$'
      - id: debug-statements
        files: '\.py$'

  # Python - Ruff (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        name: Ruff linter
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^backend/.*\.py$
        exclude: ^backend/(alembic/versions/|migrations/)

      - id: ruff-format
        name: Ruff formatter
        files: ^backend/.*\.py$
        exclude: ^backend/(alembic/versions/|migrations/)

  # bandit — PyPI wheel'inden, kaynak repodan DEĞİL.
  #
  # 27 Tem 2026 (2. tur) — hook bu makinede HİÇ KURULAMIYORDU, yani hiç
  # koşmamıştı. `repo: https://github.com/pycqa/bandit` pre-commit'e depoyu
  # klonlatıp `pip install .` yaptırır; bandit paketlemede `pbr` kullanır ve
  # klonda git tag bağlamı olmadığı için sürümü `0.0.0` üretir. Windows'ta
  # bdist_wheel bu adla çakışıyor:
  #
  #     error: [WinError 183] Halen varolan bir dosya oluşturulamaz:
  #            'build\bdist.win-amd64\wheel\bandit-0.0.0.dist-info'
  #     ERROR: Failed building wheel for bandit
  #
  # Etkisi kozmetik değildi: pre-commit bir hook'un ortamını kuramayınca TÜM
  # koşumu düşürür — yani bandit'in çökmesi, aynı config'deki sır tarayıcısı
  # dahil her hook'u ve dolayısıyla her commit'i bloke ediyordu.
  #
  # Aynı turda eklenen `additional_dependencies: ['pbr']` bu çöküşü YARATMADI,
  # sadece görünür kıldı: ortam imzasını değiştirip yeniden kurulumu tetikledi.
  # Önceki `ModuleNotFoundError: pbr` de aynı kökün başka bir yüzüydü.
  #
  # Çözüm: `repo: local` + `language: python` + sürümü sabitlenmiş PyPI
  # bağımlılığı. pip hazır wheel'i indirir, kaynak build hiç olmaz.
  # Ölçüldü: temiz venv'de `pip install --only-binary=:all: bandit` -> 1.9.4 OK.
  #
  # NOT: ruff `S` (flake8-bandit) kural seti backend/pyproject.toml'da zaten
  # açık, yani bu hook'un çoğu kuralı ruff'ta da var. Yine de kaldırılmadı —
  # bandit'in AST tabanlı kontrolleri (B3xx/B5xx ailesi) ruff'ta birebir
  # karşılanmıyor ve çalışmayan bir güvenlik hook'unu silmek yerine
  # çalıştırmak doğrusu.
  - repo: local
    hooks:
      - id: bandit
        name: bandit (PyPI wheel)
        entry: bandit
        language: python
        additional_dependencies: ["bandit==1.9.4"]
        # args TIRNAKLI kalmalı: prettier YAML akış dizisini yeniden
        # biçimlerken `--skip=B101,B601`'i `--skip=B101, B601` yapıp İKİ
        # argümana bölüyordu; bandit `B601`'i yol sanardı.
        #
        # B105 (28 Tem 2026): `api/auth.py`de 8 yanlış pozitif üretiyordu —
        # rota önekleri ("/api", "/api/v1/auth"), "bearer" kelimesi ve
        # OpenAPI örnek JWT metinleri. Atlanması KONTROL KAYBI DEĞİL: ruff'ın
        # `S` seti (backend/pyproject.toml:139) aynı denetimi yapıyor ve
        # ölçüldü — `backend/api/` altına konan sahte `API_TOKEN = "sk-..."`
        # sabiti ruff tarafından S105 ile yakalandı. Gerçek sır denetimi
        # ayrıca detect-secrets + kiro2-secret-detector hook'larında.
        args: ["-r", "--skip=B101,B601,B105"]
        types: [python]
        files: ^backend/.*\.py$
        exclude: ^backend/(tests/|.*test.*\.py)

  # Type checking with MyPy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: MyPy type checker
        additional_dependencies:
          - pydantic==2.5.0
          - sqlalchemy==2.0.23
          - fastapi==0.104.1
          - types-requests
          - types-passlib
          - types-PyYAML
          - types-python-dateutil
        args:
          [
            "--config-file=pyproject.toml",
            "--ignore-missing-imports",
            "--no-strict-optional",
          ]
        files: ^backend/.*\.py$
        exclude: ^backend/(tests/|.*test.*\.py|migrations/|alembic/)

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

  # Jupyter notebooks (using ruff)
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.7.1
    hooks:
      - id: nbqa-ruff
        name: Ruff on notebooks
        args: ["--fix"]
        files: '\.ipynb$'

      - id: nbqa-mypy
        name: MyPy on notebooks
        files: '\.ipynb$'

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [yaml]
        exclude: ^\.github/workflows/

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck

  # KIRO2 Custom Hooks
  - repo: local
    hooks:
      # SECURITY: Custom secret detector for KIRO2-specific patterns
      #
      # 27 Tem 2026 — ÜÇ SESSİZ KUSUR DÜZELTİLDİ:
      #  1. `types: [python]` -> sadece .py taranıyordu. Sızan 11 anahtarın
      #     yaşayabileceği .env / .json / .yml / .md / .sh dosyaları KAPSAM
      #     DIŞIYDI. `types: [text]` tüm metin dosyalarını kapsar.
      #  2. `stages: [commit]` -> pre-commit 3.x'te `pre-commit` olarak
      #     yeniden adlandırıldı, 4.x'te `commit` GEÇERSİZ. Yanlış stage adı
      #     hook'un sessizce hiç koşmaması demekti.
      #  3. Kurulu .git/hooks/pre-commit bu kök config'i DEĞİL
      #     backend/.pre-commit-config.yaml'ı çağırıyordu — orada sır taraması
      #     hiç yok. Üstüne `core.hooksPath = nul` ayarlıydı, yani hiçbir hook
      #     çalışmıyordu (koşulsuz `exit 1` yapan bir hook bile commit'i
      #     bloklamadı — canlı deneyle ölçüldü).
      - id: kiro2-secret-detector
        name: KIRO2 Secret Detector
        entry: python backend/hooks/secret_detector.py
        language: system
        types: [text]
        exclude: '^(\.secrets\.baseline|.*\.lock|package-lock\.json|.*\.min\.(js|css))$'
        pass_filenames: true
        stages: [pre-commit]
        verbose: true

      # SON SAVUNMA HATTI — push edilen ARALIĞIN TAMAMINDA sır taraması.
      #
      # 28 Tem 2026: depo GitHub'da PUBLIC (auth'suz API 200 ile doğrulandı).
      # İçeriğin geri alınamaz biçimde kamuya çıktığı an push'tur, commit değil;
      # commit bekçisi bir gün yine sessizce ölürse (27 Tem'de tam olarak bu
      # oldu, 12 anahtar o pencerede geçmişe girdi) bu kapı yakalar.
      #
      # `pass_filenames: false` + `always_run: true`: aralık bilgisi stdin'den
      # geliyor, dosya listesinden değil.
      - id: push-secret-guard
        name: Push edilen aralıkta sır taraması
        entry: python backend/hooks/push_secret_guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true

      # KALDIRILDI (28 Tem 2026): `pytest -x --tb=short -q backend/tests/`
      #
      # Bu kapı hiç koşmamıştı (pre-push hook'u ölüydü) ve koşsaydı da
      # yürütülebilir değildi: 16.743 test + `-x` demek, bilinen tek bir
      # pre-existing fail'in HER push'u bloke etmesi demek. Böyle bir kapının
      # tek sonucu `--no-verify`'ın alışkanlığa dönüşmesidir — bu depoda sır
      # tarayıcısının fiilen kapanmasının hikâyesi tam olarak budur.
      # Tam paket CI'ın işi; pre-push dar ve hızlı kalmalı.

      - id: reward-hacking-check
        name: Reward Hacking Prevention (Daisy Stanton Standards)
        entry: python -m backend.hooks.reward_hacking.cli
        language: system
        types: [python]
        pass_filenames: true
        always_run: false
        stages: [pre-push]
        verbose: true

      # Session 146/147: Catch NameError/ImportError in backend/api/**/*.py
      # before commit. The Session 146 sweep surfaced 6 pre-existing broken
      # imports that had been sitting in master without anyone noticing
      # (FastAPI lazy router registration hides them at startup). The smoke
      # test imports every api module and exits non-zero on the first failure.
      - id: kiro2-api-import-smoke
        name: KIRO2 API module import smoke test
        description: Catch NameError/ImportError in backend/api/**/*.py before commit
        entry: python backend/scripts/_smoke_api_imports.py
        language: system
        pass_filenames: false
        files: ^backend/api/.*\.py$
        stages: [pre-commit]

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

# Configuration

# 28 Tem 2026 — ZORUNLU. pre-commit'te `stages:` belirtilmeyen bir hook
# TÜM aşamalarda koşar. Bu config'deki hook'ların çoğunda `stages:` yok, yani
# pre-push hook'u onarılır onarılmaz biçimlendiriciler/linter'lar da push'ta
# koşmaya başladı ve push, depoda önceden var olan sorunlara takıldı
# (`openapi.json` UTF-16 olduğu için check-json çöküyor).
#
# Böyle bir kapının tek sonucu `--no-verify`'ın alışkanlığa dönüşmesidir —
# bu depoda sır tarayıcısının fiilen kapanma hikâyesi tam olarak budur.
# Bu yüzden varsayılan aşama pre-commit'e sabitlendi; push'ta YALNIZ
# `stages: [pre-push]` diyen hook'lar koşar (şu an: push-secret-guard,
# reward-hacking-check).
default_stages: [pre-commit]

default_language_version:
  # 27 Tem 2026: 'python3.11' pin'lenmişti ama o yorumlayıcı bu makinede YOK
  # (PEP-514 registry kaydı bozuk: HKCU/PythonCore/3.11 var olmayan exe'yi
  # gösteriyor). Sonuç: kök config'i kullanan HER pre-commit koşumu
  # 'failed to find interpreter' ile çöküyordu — yani config koşulamıyordu.
  # Bu, hook'un neden sır taraması olmayan backend/ config'ine yönlendirilmiş
  # olabileceğini de açıklıyor. Sabit sürüm pin'i yerine çalışan yorumlayıcı.
  python: python3

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
